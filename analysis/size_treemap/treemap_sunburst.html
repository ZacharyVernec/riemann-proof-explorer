<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riemann Proof — Size, Treemap &amp; Sunburst Explorer</title>
<style>
  :root {
    --bg: #ffffff;
    --panel: #fafafa;
    --panel-2: #f2f2f2;
    --border: #cccccc;
    --border-soft: #e0e0e0;
    --text: #111111;
    --muted: #555555;
    --dim: #666666;
    --accent: #0056b3;
    --accent-2: #0056b3;
    --good: #15803d;
    --warn: #b45309;
    --danger: #b91c1c;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.4;
    overflow: hidden;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }

  /* Header */
  .header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 16px;
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .title-wrap {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }
  .title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
  }
  .subtitle {
    font-size: 11.5px;
    color: var(--muted);
    font-family: var(--mono);
  }
  .repo-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .pill {
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 2px 8px;
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }
  .pill strong {
    color: var(--text);
    font-weight: 600;
  }

  /* Controls toolbar */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    padding: 6px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ctrl-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
  }
  .seg {
    display: inline-flex;
    gap: 2px;
  }
  .seg button {
    background: #ffffff;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 3px 8px;
    font-size: 11.5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .seg button:hover {
    background: #eeeeee;
  }
  .seg button.active {
    background: #222222;
    color: #ffffff;
    border-color: #222222;
  }

  /* Search dropdown */
  .search-wrap {
    position: relative;
    margin-left: auto;
    min-width: 220px;
    max-width: 320px;
    flex: 1 1 220px;
  }
  .search-input {
    width: 100%;
    background: #ffffff;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 8px 4px 26px;
    font-size: 12px;
    font-family: var(--mono);
  }
  .search-icon {
    position: absolute;
    left: 8px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--dim);
    pointer-events: none;
    font-size: 11px;
  }
  .search-results {
    position: absolute;
    top: calc(100% + 2px);
    right: 0;
    left: 0;
    background: #ffffff;
    border: 1px solid var(--border);
    max-height: 300px;
    overflow-y: auto;
    z-index: 60;
    display: none;
  }
  .search-results.open { display: block; }
  .search-item {
    padding: 6px 8px;
    border-bottom: 1px solid var(--border-soft);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .search-item:last-child { border-bottom: none; }
  .search-item:hover { background: #eeeeee; }
  .search-path {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .search-meta {
    font-size: 10.5px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* Breadcrumb + quick jumps bar */
  .nav-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 5px 16px;
    background: #f5f5f5;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .crumbs-left {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    min-width: 0;
  }
  .nav-btn {
    background: #ffffff;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 2px 8px;
    font-size: 11.5px;
    cursor: pointer;
  }
  .nav-btn:hover:not(:disabled) {
    background: #eeeeee;
  }
  .nav-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .breadcrumbs {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 3px;
    font-family: var(--mono);
    font-size: 11.5px;
  }
  .crumb {
    color: var(--accent);
    cursor: pointer;
    padding: 1px 4px;
  }
  .crumb:hover { text-decoration: underline; }
  .crumb.current {
    color: var(--text);
    font-weight: 700;
    cursor: default;
  }
  .crumb-sep { color: var(--dim); user-select: none; }

  .quick-picks {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .qp-label { font-size: 11px; color: var(--dim); }
  .qp-btn {
    background: #ffffff;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 1px 6px;
    font-size: 11px;
    cursor: pointer;
  }
  .qp-btn:hover { background: #eeeeee; }

  /* Workspace split */
  .workspace {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    flex: 1 1 auto;
    min-height: 0;
  }
  @media (max-width: 1080px) {
    .workspace {
      grid-template-columns: 1fr;
      grid-template-rows: 58vh 1fr;
    }
    html, body { overflow: auto; }
    .app { height: auto; min-height: 100vh; }
  }

  /* Left viz pane */
  .viz-pane {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: #ffffff;
    border-right: 1px solid var(--border);
    position: relative;
  }
  .legend-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    padding: 5px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
    font-size: 11px;
  }
  .legend-items {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
  }
  .legend-swatch {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    color: var(--text);
  }
  .legend-swatch:hover { text-decoration: underline; }
  .swatch-box {
    width: 10px;
    height: 10px;
    display: inline-block;
    flex-shrink: 0;
  }
  .scale-bar-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
  }
  .scale-gradient {
    width: 160px;
    height: 10px;
    border: 1px solid var(--border);
  }
  .viz-hint {
    color: var(--dim);
    font-size: 11px;
  }

  .svg-stage {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
    overflow: hidden;
  }
  #viz-svg {
    width: 100%;
    height: 100%;
    display: block;
    user-select: none;
  }

  /* Treemap and sunburst SVG styles */
  .tm-tile {
    cursor: pointer;
  }
  .tm-tile:hover .tm-rect {
    stroke: #000000;
    stroke-width: 1.5px;
  }
  .tm-parent-header { cursor: pointer; }
  .tm-label {
    pointer-events: none;
    fill: #ffffff;
    font-family: var(--sans);
    font-weight: 600;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
  }
  .tm-sublabel {
    pointer-events: none;
    fill: #f8fafc;
    font-family: var(--mono);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
  }

  .sb-arc {
    cursor: pointer;
  }
  .sb-arc:hover {
    stroke: #000000;
    stroke-width: 1.5px;
  }
  .sb-arc.dimmed { opacity: 0.45; }
  .sb-label {
    pointer-events: none;
    fill: #ffffff;
    font-size: 10.5px;
    font-weight: 600;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
  }
  .sb-center { cursor: pointer; }
  .sb-center:hover circle { stroke: var(--accent); stroke-width: 2px; }

  /* Right inspector */
  .inspector {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--panel);
    overflow-y: auto;
  }
  .insp-section {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .insp-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .insp-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    word-break: break-word;
  }
  .insp-path {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    word-break: break-all;
    margin-top: 2px;
  }
  .file-link-btn {
    display: inline-block;
    padding: 2px 7px;
    background: #ffffff;
    border: 1px solid var(--border);
    color: var(--accent);
    text-decoration: none;
    font-size: 11px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .file-link-btn:hover {
    background: #eeeeee;
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 6px;
  }
  .kpi {
    background: #ffffff;
    border: 1px solid var(--border);
    padding: 6px 8px;
  }
  .kpi-k {
    font-size: 10px;
    color: var(--muted);
    font-weight: 600;
  }
  .kpi-v {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    margin-top: 1px;
  }
  .kpi-s {
    font-size: 10.5px;
    color: var(--muted);
  }

  .sec-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
  }
  .sec-count {
    font-family: var(--mono);
    font-weight: 400;
    color: var(--muted);
  }

  .sub-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .sub-row {
    background: #ffffff;
    border: 1px solid var(--border);
    padding: 5px 7px;
    cursor: pointer;
  }
  .sub-row:hover {
    background: #eeeeee;
  }
  .sub-row-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .sub-name-wrap {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
  }
  .sub-name {
    font-weight: 600;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sub-val {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }
  .bar-track {
    height: 3px;
    background: #e0e0e0;
    margin-top: 4px;
  }
  .bar-fill {
    height: 100%;
  }
  .sub-row-meta {
    display: flex;
    justify-content: space-between;
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 3px;
  }

  .file-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .file-row {
    background: #ffffff;
    border: 1px solid var(--border);
    padding: 6px 8px;
  }
  .file-link {
    color: var(--accent);
    text-decoration: none;
    font-family: var(--mono);
    font-size: 11.5px;
    font-weight: 600;
    word-break: break-all;
  }
  .file-link:hover {
    text-decoration: underline;
  }
  .file-rel {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    margin-top: 2px;
    word-break: break-all;
  }
  .file-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    margin-top: 4px;
    font-size: 10.5px;
    color: var(--muted);
  }
  .file-stats span strong { color: var(--text); }

  /* Floating tooltip */
  .tooltip {
    position: fixed;
    pointer-events: none;
    z-index: 100;
    background: #ffffff;
    border: 1px solid #666666;
    padding: 8px 10px;
    min-width: 220px;
    max-width: 320px;
    display: none;
  }
  .tt-title {
    font-weight: 700;
    color: var(--text);
    font-size: 12.5px;
    word-break: break-word;
  }
  .tt-path {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--accent);
    margin-bottom: 5px;
    word-break: break-all;
  }
  .tt-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 2px 10px;
    font-size: 11px;
  }
  .tt-k { color: var(--muted); }
  .tt-v {
    text-align: right;
    color: var(--text);
    font-family: var(--mono);
  }
  .tt-hint {
    margin-top: 5px;
    padding-top: 4px;
    border-top: 1px solid var(--border-soft);
    font-size: 10.5px;
    color: var(--muted);
  }

  .empty-note {
    color: var(--muted);
    font-style: italic;
    font-size: 11.5px;
    padding: 4px 0;
  }
</style>
</head>

<div class="app">
  <div style="padding:6px 16px;border-bottom:1px solid #ccc;font-size:12.5px;background:#fafafa;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">

<script>
(function () {
  "use strict";

  let DATA = null;
  let SRC_ROOT = "src";
  let ROOT = null;
  let nodeByPath = new Map();
  let parentByPath = new Map();
  let allDirNodes = [];

  const THEORY_COLORS = {
    "New": "#3b82f6",
    "Lib": "#10b981",
    "Development": "#3b82f6",
    "Formalism": "#f59e0b",
    "GroundTheory": "#10b981",
    "ReciprocityTheory": "#a855f7",
    "CompanionTheory": "#06b6d4",
    "PositivityTheory": "#f43f5e",
    "Lemmata": "#84cc16",
    "Supplements": "#fb923c",
    "BuildAid": "#64748b",
    "(root)": "#94a3b8"
  };

  const METRIC_INFO = {
    lines: { label: "Lines of Code", short: "lines", fmt: fmtInt },
    files: { label: "Files", short: "files", fmt: fmtInt },
    theorems_lemmas: { label: "Theorems & Lemmas", short: "thm+lem", fmt: fmtInt },
    defs_structures: { label: "Defs & Structures", short: "def+str", fmt: fmtInt }
  };

  const DIST_STOPS = [
    [0, [34, 211, 238]],
    [8, [59, 130, 246]],
    [13, [139, 92, 246]],
    [20, [236, 72, 153]],
    [32, [249, 115, 22]]
  ];

  const HEIGHT_STOPS = [
    [0, [51, 65, 85]],
    [25, [6, 182, 212]],
    [70, [16, 185, 129]],
    [130, [245, 158, 11]],
    [202, [239, 68, 68]]
  ];

  const state = {
    view: "treemap",
    metric: "lines",
    colorMode: "theory",
    tmNested: true,
    sbRings: 4,
    zoomPath: "",
    directOnlyMode: false
  };

  const svgEl = document.getElementById("viz-svg");
  const SVG_NS = svgEl.namespaceURI;
  const stageEl = document.getElementById("svg-stage");
  const tooltipEl = document.getElementById("tooltip");

  function fmtInt(n) {
    if (n === null || n === undefined) return "—";
    return Number(n).toLocaleString("en-US");
  }

  function fmtBytes(b) {
    if (b === null || b === undefined) return "—";
    if (b < 1024) return b + " B";
    if (b < 1024 * 1024) return (b / 1024).toFixed(1) + " KB";
    if (b < 1024 * 1024 * 1024) return (b / (1024 * 1024)).toFixed(2) + " MB";
    return (b / (1024 * 1024 * 1024)).toFixed(2) + " GB";
  }

  function fmtCompact(n) {
    if (n >= 1e6) return (n / 1e6).toFixed(2) + "M";
    if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
    return String(n);
  }

  function esc(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function fileUrl(relPath) {
    if (window.RHVersion) {
      if (relPath && relPath.endsWith(".lean") && RHVersion.sourceUrl) {
        return RHVersion.sourceUrl(relPath);
      }
      if (RHVersion.treeUrl) {
        return RHVersion.treeUrl(relPath || "");
      }
    }
    if (!relPath) return "file://" + SRC_ROOT;
    return "file://" + SRC_ROOT + "/" + relPath.split("/").map(encodeURIComponent).join("/");
  }

  function metricVal(node, metric) {
    const m = metric || state.metric;
    if (node.isFileTile) {
      if (m === "files") return 1;
      return node[m] || 0;
    }
    return node[m] || 0;
  }

  function interpStops(val, stops) {
    if (val === null || val === undefined) return "#475569";
    if (val <= stops[0][0]) {
      const c = stops[0][1];
      return `rgb(${c[0]},${c[1]},${c[2]})`;
    }
    for (let i = 1; i < stops.length; i++) {
      if (val <= stops[i][0]) {
        const [x0, c0] = stops[i - 1];
        const [x1, c1] = stops[i];
        const t = (val - x0) / (x1 - x0);
        const r = Math.round(c0[0] + t * (c1[0] - c0[0]));
        const g = Math.round(c0[1] + t * (c1[1] - c0[1]));
        const b = Math.round(c0[2] + t * (c1[2] - c0[2]));
        return `rgb(${r},${g},${b})`;
      }
    }
    const c = stops[stops.length - 1][1];
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }

  function getNodeColor(node, depthOffset) {
    if (node.isOtherBundle) return "#334155";
    if (state.colorMode === "theory") {
      const base = THEORY_COLORS[node.top_dir] || "#64748b";
      if (node.isDirectBundle) return shadeHex(base, -18);
      if (depthOffset && depthOffset > 0) return shadeHex(base, Math.min(18, depthOffset * 8));
      return base;
    }
    if (state.colorMode === "dist") {
      const v = node.isFileTile ? node.dist : node.avg_dist_from_main;
      return interpStops(v, DIST_STOPS);
    }
    const h = node.isFileTile ? node.height : node.max_height;
    return interpStops(h, HEIGHT_STOPS);
  }

  function shadeHex(hex, pct) {
    const num = parseInt(hex.slice(1), 16);
    const amt = Math.round(2.55 * pct);
    const r = Math.max(0, Math.min(255, (num >> 16) + amt));
    const g = Math.max(0, Math.min(255, ((num >> 8) & 0x00ff) + amt));
    const b = Math.max(0, Math.min(255, (num & 0x0000ff) + amt));
    return `rgb(${r},${g},${b})`;
  }

  function svgElCreate(tag, attrs) {
    const el = document.createElementNS(SVG_NS, tag);
    if (attrs) {
      for (const k in attrs) {
        el.setAttribute(k, attrs[k]);
      }
    }
    return el;
  }

  function getZoomChildren(node) {
    const m = state.metric;
    if (state.directOnlyMode || !(node.children && node.children.length)) {
      // Leaf or direct-files view: return top_files + remaining bucket
      const files = node.top_files || [];
      const prefix = node.path ? node.path + "/" : "";
      const dirStats = node.direct || node;
      const items = [];
      let sumFiles = 0, sumLines = 0, sumBytes = 0, sumTL = 0, sumDS = 0;
      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        const ft = {
          name: f.name,
          path: prefix + f.name,
          top_dir: node.top_dir,
          depth: node.depth + 1,
          files: 1,
          lines: f.lines,
          bytes: f.bytes,
          theorems_lemmas: f.theorems_lemmas,
          defs_structures: f.defs_structures,
          other_decls: f.other_decls,
          avg_dist_from_main: f.dist,
          min_dist_from_main: f.dist,
          max_height: f.height,
          dist: f.dist,
          height: f.height,
          isFileTile: true
        };
        sumFiles += 1;
        sumLines += f.lines;
        sumBytes += f.bytes;
        sumTL += f.theorems_lemmas;
        sumDS += f.defs_structures;
        if (metricVal(ft, m) > 0) items.push(ft);
      }
      const remFiles = dirStats.files - sumFiles;
      if (remFiles > 0) {
        const rem = {
          name: `+${fmtInt(remFiles)} smaller files`,
          path: node.path,
          top_dir: node.top_dir,
          depth: node.depth + 1,
          files: remFiles,
          lines: Math.max(0, dirStats.lines - sumLines),
          bytes: Math.max(0, dirStats.bytes - sumBytes),
          theorems_lemmas: Math.max(0, dirStats.theorems_lemmas - sumTL),
          defs_structures: Math.max(0, dirStats.defs_structures - sumDS),
          avg_dist_from_main: dirStats.avg_dist_from_main,
          min_dist_from_main: dirStats.min_dist_from_main,
          max_height: dirStats.max_height,
          isOtherBundle: true
        };
        if (metricVal(rem, m) > 0) items.push(rem);
      }
      items.sort((a, b) => metricVal(b, m) - metricVal(a, m));
      return items;
    }

    const items = [];
    const ch = node.children || [];
    for (let i = 0; i < ch.length; i++) {
      if (metricVal(ch[i], m) > 0) items.push(ch[i]);
    }
    if (node.direct && metricVal(node.direct, m) > 0) {
      items.push({
        name: "[direct .lean files]",
        path: node.path,
        top_dir: node.top_dir,
        depth: node.depth + 1,
        ...node.direct,
        top_files: node.top_files,
        isDirectBundle: true
      });
    }
    items.sort((a, b) => metricVal(b, m) - metricVal(a, m));
    return items;
  }

  // Subtree top-N files collector
  function collectSubtreeTopFiles(node, limit, sortMetric) {
    const prefix = node.path ? node.path + "/" : "";
    const list = [];
    function walk(n) {
      if (n.top_files) {
        const p = n.path ? n.path + "/" : "";
        for (let i = 0; i < n.top_files.length; i++) {
          const f = n.top_files[i];
          const relPath = p + f.name;
          const subRel = prefix && relPath.startsWith(prefix) ? relPath.slice(prefix.length) : relPath;
          list.push({ ...f, relPath, subRel });
        }
      }
      if (!state.directOnlyMode && n.children) {
        for (let i = 0; i < n.children.length; i++) walk(n.children[i]);
      }
    }
    walk(node);
    const key = sortMetric === "theorems_lemmas"
      ? "theorems_lemmas"
      : (sortMetric === "defs_structures" ? "defs_structures" : "lines");
    list.sort((a, b) => (b[key] - a[key]) || (b.lines - a.lines) || (b.bytes - a.bytes));
    return list.slice(0, limit);
  }

  // Squarified treemap layout
  function squarify(items, x, y, w, h) {
    const res = [];
    if (w <= 0 || h <= 0 || items.length === 0) return res;
    let total = 0;
    for (let i = 0; i < items.length; i++) total += items[i]._val;
    if (total <= 0) return res;

    const totalArea = w * h;
    const nodes = items.map(it => ({ item: it, area: (it._val / total) * totalArea }));

    let rx = x, ry = y, rw = w, rh = h;
    let row = [];
    let idx = 0;

    function worstAspect(arr, shortSide) {
      if (arr.length === 0 || shortSide <= 0) return Infinity;
      let sum = 0;
      for (let i = 0; i < arr.length; i++) sum += arr[i].area;
      if (sum <= 0) return Infinity;
      const t = sum / shortSide;
      const t2 = t * t;
      let worst = 0;
      for (let i = 0; i < arr.length; i++) {
        const a = arr[i].area;
        if (a <= 0) continue;
        const r = Math.max(t2 / a, a / t2);
        if (r > worst) worst = r;
      }
      return worst;
    }

    function layoutRow(arr) {
      let sum = 0;
      for (let i = 0; i < arr.length; i++) sum += arr[i].area;
      if (sum <= 0) return;
      if (rw >= rh) {
        const colW = Math.min(rw, sum / rh);
        let cy = ry;
        for (let i = 0; i < arr.length; i++) {
          const ih = i === arr.length - 1 ? Math.max(0, ry + rh - cy) : (arr[i].area / sum) * rh;
          res.push({ item: arr[i].item, x: rx, y: cy, w: colW, h: ih });
          cy += ih;
        }
        rx += colW;
        rw = Math.max(0, rw - colW);
      } else {
        const rowH = Math.min(rh, sum / rw);
        let cx = rx;
        for (let i = 0; i < arr.length; i++) {
          const iw = i === arr.length - 1 ? Math.max(0, rx + rw - cx) : (arr[i].area / sum) * rw;
          res.push({ item: arr[i].item, x: cx, y: ry, w: iw, h: rowH });
          cx += iw;
        }
        ry += rowH;
        rh = Math.max(0, rh - rowH);
      }
    }

    while (idx < nodes.length) {
      const next = nodes[idx];
      const shortSide = Math.min(rw, rh);
      if (shortSide <= 0) break;
      if (row.length === 0) {
        row.push(next);
        idx++;
      } else {
        const curWorst = worstAspect(row, shortSide);
        const cand = row.concat([next]);
        const nextWorst = worstAspect(cand, shortSide);
        if (nextWorst <= curWorst) {
          row.push(next);
          idx++;
        } else {
          layoutRow(row);
          row = [];
        }
      }
    }
    if (row.length > 0) layoutRow(row);
    return res;
  }

  function renderTreemap(zoomNode, width, height) {
    svgEl.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svgEl.innerHTML = "";

    const pad = 8;
    const boxW = Math.max(10, width - pad * 2);
    const boxH = Math.max(10, height - pad * 2);
    const totalVal = state.directOnlyMode
      ? metricVal(zoomNode.direct || zoomNode)
      : metricVal(zoomNode);

    const children = getZoomChildren(zoomNode).map(c => ({ ...c, _val: metricVal(c) }));
    if (children.length === 0 || totalVal <= 0) {
      const msg = svgElCreate("text", {
        x: width / 2, y: height / 2, "text-anchor": "middle",
        fill: "#94a3b8", "font-size": "14"
      });
      msg.textContent = "No items with positive values under the selected metric.";
      svgEl.appendChild(msg);
      return;
    }

    // Group tiny level-1 slivers only if > 200 items and sliver < 1.5px2
    const rects = squarify(children, pad, pad, boxW, boxH);
    const gRoot = svgElCreate("g");
    svgEl.appendChild(gRoot);

    for (let i = 0; i < rects.length; i++) {
      const r = rects[i];
      if (r.w < 0.8 || r.h < 0.8) continue;
      const item = r.item;
      const hasSubChildren = state.tmNested && !item.isFileTile && !item.isOtherBundle && !item.isDirectBundle && item.children && item.children.length > 0;
      const canNest = hasSubChildren && r.w >= 78 && r.h >= 56;

      if (canNest) {
        const headerH = 19;
        const fill = getNodeColor(item, 0);
        const group = svgElCreate("g");

        const bg = svgElCreate("rect", {
          x: r.x, y: r.y, width: r.w, height: r.h,
          fill: "#f8fafc", stroke: fill, "stroke-width": "1.5"
        });
        group.appendChild(bg);

        const hdrGroup = svgElCreate("g", { class: "tm-parent-header" });
        const hdrRect = svgElCreate("rect", {
          x: r.x, y: r.y, width: r.w, height: headerH,
          fill: fill, "fill-opacity": "0.92", rx: "2"
        });
        hdrGroup.appendChild(hdrRect);

        const pct = ((item._val / totalVal) * 100).toFixed(1);
        const hdrText = svgElCreate("text", {
          x: r.x + 6, y: r.y + 13, class: "tm-label", "font-size": "11"
        });
        hdrText.textContent = fitText(`${item.name} (${pct}%)`, r.w - 10, 6.4);
        hdrGroup.appendChild(hdrText);

        attachInteractions(hdrGroup, item, totalVal, true);
        group.appendChild(hdrGroup);

        // Nested children inside
        const subRaw = getZoomChildrenForPreview(item);
        const subItems = [];
        let tinyAgg = null;
        const innerX = r.x + 3, innerY = r.y + headerH + 2, innerW = r.w - 6, innerH = r.h - headerH - 5;
        const innerArea = innerW * innerH;
        const parentSum = item._val;

        for (let j = 0; j < subRaw.length; j++) {
          const sc = subRaw[j];
          const sv = metricVal(sc);
          const estArea = parentSum > 0 ? (sv / parentSum) * innerArea : 0;
          if (estArea < 16 && subRaw.length - j > 1) {
            if (!tinyAgg) {
              tinyAgg = {
                name: `+${subRaw.length - j} smaller`,
                path: item.path,
                top_dir: item.top_dir,
                depth: item.depth + 1,
                files: 0, lines: 0, bytes: 0, theorems_lemmas: 0, defs_structures: 0,
                avg_dist_from_main: item.avg_dist_from_main,
                min_dist_from_main: item.min_dist_from_main,
                max_height: item.max_height,
                isOtherBundle: true,
                _parentTarget: item,
                _val: 0
              };
            }
            tinyAgg.files += sc.files;
            tinyAgg.lines += sc.lines;
            tinyAgg.bytes += sc.bytes;
            tinyAgg.theorems_lemmas += sc.theorems_lemmas;
            tinyAgg.defs_structures += sc.defs_structures;
            tinyAgg._val += sv;
          } else {
            subItems.push({ ...sc, _val: sv });
          }
        }
        if (tinyAgg && tinyAgg._val > 0) subItems.push(tinyAgg);

        const subRects = squarify(subItems, innerX, innerY, innerW, innerH);
        for (let j = 0; j < subRects.length; j++) {
          const sr = subRects[j];
          if (sr.w < 1 || sr.h < 1) continue;
          drawLeafTile(group, sr.item, sr.x, sr.y, sr.w, sr.h, totalVal, 1);
        }
        gRoot.appendChild(group);
      } else {
        drawLeafTile(gRoot, item, r.x, r.y, r.w, r.h, totalVal, 0);
      }
    }
  }

  function getZoomChildrenForPreview(node) {
    const m = state.metric;
    const items = [];
    const ch = node.children || [];
    for (let i = 0; i < ch.length; i++) {
      if (metricVal(ch[i], m) > 0) items.push(ch[i]);
    }
    if (node.direct && metricVal(node.direct, m) > 0) {
      items.push({
        name: "[direct .lean files]",
        path: node.path,
        top_dir: node.top_dir,
        depth: node.depth + 1,
        ...node.direct,
        top_files: node.top_files,
        isDirectBundle: true
      });
    }
    items.sort((a, b) => metricVal(b, m) - metricVal(a, m));
    return items;
  }

  function drawLeafTile(container, item, x, y, w, h, totalVal, depthOff) {
    const g = svgElCreate("g", { class: "tm-tile" });
    const rect = svgElCreate("rect", {
      x: x + 0.5, y: y + 0.5,
      width: Math.max(0.5, w - 1),
      height: Math.max(0.5, h - 1),
      fill: getNodeColor(item, depthOff),
      "fill-opacity": item.isOtherBundle ? "0.65" : "0.9",
      stroke: "#ffffff",
      "stroke-width": "1"
    });
    g.appendChild(rect);

    if (w >= 42 && h >= 22) {
      const fs = w > 120 && h > 55 ? 12 : 10.5;
      const lbl = svgElCreate("text", {
        x: x + 5, y: y + fs + 3, class: "tm-label", "font-size": String(fs)
      });
      lbl.textContent = fitText(item.name, w - 9, fs * 0.58);
      g.appendChild(lbl);

      if (h >= 38 && w >= 54) {
        const val = metricVal(item);
        const pct = ((val / totalVal) * 100).toFixed(1);
        const sub = svgElCreate("text", {
          x: x + 5, y: y + fs + 16, class: "tm-sublabel", "font-size": "10"
        });
        sub.textContent = fitText(`${fmtCompact(val)} (${pct}%)`, w - 9, 5.8);
        g.appendChild(sub);
      }
    }

    attachInteractions(g, item, totalVal, true);
    container.appendChild(g);
  }

  function fitText(text, maxPx, charWidth) {
    if (maxPx <= 6) return "";
    const maxChars = Math.floor(maxPx / charWidth);
    if (maxChars <= 1) return "";
    if (text.length <= maxChars) return text;
    return text.slice(0, Math.max(1, maxChars - 1)) + "…";
  }

  // Sunburst renderer
  function annularArcPath(cx, cy, rIn, rOut, a0, a1) {
    const span = a1 - a0;
    if (span >= Math.PI * 2 - 1e-4) {
      // Full ring split into two 180-degree arcs so SVG renders properly
      const aMid = a0 + Math.PI;
      return annularArcPath(cx, cy, rIn, rOut, a0, aMid - 1e-4) + " " +
             annularArcPath(cx, cy, rIn, rOut, aMid - 1e-4, a1);
    }
    const large = span > Math.PI ? 1 : 0;
    const x0o = cx + rOut * Math.cos(a0);
    const y0o = cy + rOut * Math.sin(a0);
    const x1o = cx + rOut * Math.cos(a1);
    const y1o = cy + rOut * Math.sin(a1);
    const x1i = cx + rIn * Math.cos(a1);
    const y1i = cy + rIn * Math.sin(a1);
    const x0i = cx + rIn * Math.cos(a0);
    const y0i = cy + rIn * Math.sin(a0);
    return [
      `M ${x0o.toFixed(2)} ${y0o.toFixed(2)}`,
      `A ${rOut.toFixed(2)} ${rOut.toFixed(2)} 0 ${large} 1 ${x1o.toFixed(2)} ${y1o.toFixed(2)}`,
      `L ${x1i.toFixed(2)} ${y1i.toFixed(2)}`,
      `A ${rIn.toFixed(2)} ${rIn.toFixed(2)} 0 ${large} 0 ${x0i.toFixed(2)} ${y0i.toFixed(2)}`,
      "Z"
    ].join(" ");
  }

  function renderSunburst(zoomNode, width, height) {
    svgEl.setAttribute("viewBox", `0 0 ${width} ${height}`);
    svgEl.innerHTML = "";

    const cx = width / 2;
    const cy = height / 2;
    const maxR = Math.max(80, Math.min(width, height) / 2 - 14);
    const centerR = Math.max(46, Math.min(82, maxR * 0.24));
    const maxRings = state.sbRings;
    const ringW = (maxR - centerR) / maxRings;
    const totalVal = state.directOnlyMode
      ? metricVal(zoomNode.direct || zoomNode)
      : metricVal(zoomNode);

    const gArcs = svgElCreate("g");
    const gLabels = svgElCreate("g");
    svgEl.appendChild(gArcs);
    svgEl.appendChild(gLabels);

    // Center circle
    const cGroup = svgElCreate("g", { class: "sb-center" });
    const cCircle = svgElCreate("circle", {
      cx, cy, r: centerR,
      fill: "#f8fafc",
      stroke: state.zoomPath || state.directOnlyMode ? "#0056b3" : "#999999",
      "stroke-width": "1.5"
    });
    cGroup.appendChild(cCircle);

    const cName = svgElCreate("text", {
      x: cx, y: cy - 8, "text-anchor": "middle",
      fill: "#111111", "font-size": "12", "font-weight": "700"
    });
    cName.textContent = fitText(state.directOnlyMode ? "[direct files]" : zoomNode.name, centerR * 1.75, 6.8);
    cGroup.appendChild(cName);

    const cVal = svgElCreate("text", {
      x: cx, y: cy + 8, "text-anchor": "middle",
      fill: "#0056b3", "font-size": "11", "font-family": "var(--mono)"
    });
    cVal.textContent = `${fmtCompact(totalVal)} ${METRIC_INFO[state.metric].short}`;
    cGroup.appendChild(cVal);

    if (state.zoomPath || state.directOnlyMode) {
      const cUp = svgElCreate("text", {
        x: cx, y: cy + 23, "text-anchor": "middle",
        fill: "#555555", "font-size": "10"
      });
      cUp.textContent = "↑ zoom up";
      cGroup.appendChild(cUp);
      cGroup.addEventListener("click", zoomUp);
    }
    svgEl.appendChild(cGroup);

    if (totalVal <= 0) {
      const msg = svgElCreate("text", {
        x: cx, y: cy + maxR * 0.55, "text-anchor": "middle",
        fill: "#94a3b8", "font-size": "13"
      });
      msg.textContent = "No items with positive values under this metric.";
      svgEl.appendChild(msg);
      return;
    }

    const MIN_ARC_RAD = 0.0045;
    const arcEntries = [];

    function walkRing(node, ring, a0, a1, useDirect) {
      if (ring > maxRings) return;
      let children;
      if (useDirect) {
        const saved = state.directOnlyMode;
        state.directOnlyMode = true;
        children = getZoomChildren(node);
        state.directOnlyMode = saved;
      } else if (ring === 1) {
        children = getZoomChildren(node);
      } else {
        if (node.isFileTile || node.isOtherBundle || node.isDirectBundle || !(node.children && node.children.length)) {
          return;
        }
        children = getZoomChildrenForPreview(node);
      }
      if (!children || children.length === 0) return;

      let sum = 0;
      for (let i = 0; i < children.length; i++) sum += metricVal(children[i]);
      if (sum <= 0) return;

      const span = a1 - a0;
      let curA = a0;
      let aggOther = null;

      for (let i = 0; i < children.length; i++) {
        const ch = children[i];
        const cv = metricVal(ch);
        if (cv <= 0) continue;
        const dA = span * (cv / sum);
        if (dA < MIN_ARC_RAD && children.length - i > 1) {
          if (!aggOther) {
            aggOther = {
              name: `+${children.length - i} smaller`,
              path: node.path,
              top_dir: node.top_dir,
              depth: node.depth + 1,
              files: 0, lines: 0, bytes: 0, theorems_lemmas: 0, defs_structures: 0,
              avg_dist_from_main: node.avg_dist_from_main,
              min_dist_from_main: node.min_dist_from_main,
              max_height: node.max_height,
              isOtherBundle: true,
              _parentTarget: node,
              _val: 0,
              _dA: 0
            };
          }
          aggOther.files += ch.files;
          aggOther.lines += ch.lines;
          aggOther.bytes += ch.bytes;
          aggOther.theorems_lemmas += ch.theorems_lemmas;
          aggOther.defs_structures += ch.defs_structures;
          aggOther._val += cv;
          aggOther._dA += dA;
        } else {
          const nextA = curA + dA;
          arcEntries.push({ item: ch, ring, a0: curA, a1: nextA });
          if (ring < maxRings && !ch.isFileTile && !ch.isOtherBundle && !ch.isDirectBundle) {
            walkRing(ch, ring + 1, curA, nextA, false);
          }
          curA = nextA;
        }
      }

      if (aggOther && aggOther._dA > 0) {
        arcEntries.push({ item: aggOther, ring, a0: curA, a1: Math.min(a1, curA + aggOther._dA) });
      }
    }

    walkRing(zoomNode, 1, -Math.PI / 2, Math.PI * 1.5, state.directOnlyMode);

    for (let i = 0; i < arcEntries.length; i++) {
      const e = arcEntries[i];
      const rIn = centerR + (e.ring - 1) * ringW + 1.5;
      const rOut = centerR + e.ring * ringW - 1.5;
      const d = annularArcPath(cx, cy, rIn, rOut, e.a0, e.a1);
      const path = svgElCreate("path", {
        d,
        class: "sb-arc",
        fill: getNodeColor(e.item, e.ring - 1),
        "fill-opacity": e.item.isOtherBundle ? "0.6" : "0.9",
        stroke: "#ffffff",
        "stroke-width": "1"
      });
      attachInteractions(path, e.item, totalVal, false);
      gArcs.appendChild(path);

      // Arc label if wide enough
      const midR = (rIn + rOut) / 2;
      const arcLen = (e.a1 - e.a0) * midR;
      if (arcLen >= 28 && ringW >= 24) {
        const midA = (e.a0 + e.a1) / 2;
        const lx = cx + midR * Math.cos(midA);
        const ly = cy + midR * Math.sin(midA);
        // Tangential vs radial depending on aspect
        const isRadial = ringW > arcLen * 1.2 && ringW >= 42;
        let rot = ((midA * 180) / Math.PI) + (isRadial ? 0 : 90);
        rot = ((rot % 360) + 360) % 360;
        if (rot > 90 && rot < 270) rot -= 180;
        const availPx = (isRadial ? ringW : arcLen) - 10;

        const txt = fitText(e.item.name, availPx, 6.2);
        if (txt) {
          const lbl = svgElCreate("text", {
            x: lx.toFixed(1),
            y: ly.toFixed(1),
            "text-anchor": "middle",
            "dominant-baseline": "central",
            class: "sb-label",
            transform: `rotate(${rot.toFixed(1)} ${lx.toFixed(1)} ${ly.toFixed(1)})`
          });
          lbl.textContent = txt;
          gLabels.appendChild(lbl);
        }
      }
    }
  }

  function attachInteractions(el, item, totalVal, isTreemap) {
    el.addEventListener("mousemove", function (ev) {
      showTooltip(ev, item, totalVal);
    });
    el.addEventListener("mouseleave", hideTooltip);
    el.addEventListener("click", function (ev) {
      ev.stopPropagation();
      hideTooltip();
      if (item.isFileTile) {
        window.open(fileUrl(item.path), "_blank");
        return;
      }
      if (item.isOtherBundle) {
        if (item._parentTarget) {
          zoomTo(item._parentTarget.path, false);
        }
        return;
      }
      if (item.isDirectBundle) {
        zoomTo(item.path, true);
        return;
      }
      zoomTo(item.path, false);
    });
  }

  function showTooltip(ev, item, totalVal) {
    const val = metricVal(item);
    const pctView = totalVal > 0 ? ((val / totalVal) * 100).toFixed(2) : "0.00";
    const pctRepo = metricVal(ROOT) > 0 ? ((val / metricVal(ROOT)) * 100).toFixed(2) : "0.00";
    const distVal = item.isFileTile ? item.dist : item.avg_dist_from_main;
    const minDist = item.isFileTile ? item.dist : item.min_dist_from_main;
    const hVal = item.isFileTile ? item.height : item.max_height;

    const actionHint = item.isFileTile
      ? "Click to open file:// in browser/editor"
      : (item.isOtherBundle ? "Click to zoom into parent folder" : "Click to zoom in");

    tooltipEl.innerHTML = `
      <div class="tt-title">${esc(item.name)}</div>
      <div class="tt-path">${esc(item.path || "lean/src")}</div>
      <div class="tt-grid">
        <div class="tt-k">${esc(METRIC_INFO[state.metric].label)}</div>
        <div class="tt-v"><strong>${fmtInt(val)}</strong> (${pctView}% view · ${pctRepo}% repo)</div>
        <div class="tt-k">Files</div><div class="tt-v">${fmtInt(item.files)}</div>
        <div class="tt-k">Lines of Code</div><div class="tt-v">${fmtInt(item.lines)}</div>
        <div class="tt-k">Size</div><div class="tt-v">${fmtBytes(item.bytes)}</div>
        <div class="tt-k">Theorems &amp; Lemmas</div><div class="tt-v">${fmtInt(item.theorems_lemmas)}</div>
        <div class="tt-k">Defs &amp; Structures</div><div class="tt-v">${fmtInt(item.defs_structures)}</div>
        <div class="tt-k">Avg / Min Dist from Main</div><div class="tt-v">${distVal !== null && distVal !== undefined ? distVal : "—"} / ${minDist !== null && minDist !== undefined ? minDist : "—"}</div>
        <div class="tt-k">Max Height from Leaves</div><div class="tt-v">${hVal !== null && hVal !== undefined ? hVal : "—"}</div>
      </div>
      <div class="tt-hint">${actionHint}</div>
    `;
    tooltipEl.style.display = "block";
    const tw = tooltipEl.offsetWidth || 260;
    const th = tooltipEl.offsetHeight || 190;
    let left = ev.clientX + 14;
    let top = ev.clientY + 14;
    if (left + tw > window.innerWidth - 10) left = Math.max(10, ev.clientX - tw - 14);
    if (top + th > window.innerHeight - 10) top = Math.max(10, ev.clientY - th - 14);
    tooltipEl.style.left = left + "px";
    tooltipEl.style.top = top + "px";
  }

  function hideTooltip() {
    tooltipEl.style.display = "none";
  }

  function getActiveZoomNode() {
    return nodeByPath.get(state.zoomPath) || ROOT;
  }

  function zoomTo(path, directOnly) {
    state.zoomPath = path || "";
    state.directOnlyMode = Boolean(directOnly);
    renderAll();
  }

  function zoomUp() {
    if (state.directOnlyMode) {
      state.directOnlyMode = false;
      renderAll();
      return;
    }
    const cur = getActiveZoomNode();
    const p = parentByPath.get(cur.path);
    if (p) {
      state.zoomPath = p.path;
      renderAll();
    }
  }

  function renderHeader() {
    const m = DATA.meta;
    document.getElementById("header-sub").textContent =
      `${SRC_ROOT} · ${fmtInt(DATA.tree_stats.total_dir_nodes)} dir nodes · max depth ${DATA.tree_stats.max_dir_depth}`;
    document.getElementById("repo-pills").innerHTML = [
      `<span class="pill"><strong>${fmtInt(m.total_files)}</strong> files (100% reachable)</span>`,
      `<span class="pill"><strong>${fmtInt(m.total_lines)}</strong> lines</span>`,
      `<span class="pill"><strong>${fmtBytes(m.total_bytes)}</strong></span>`,
      `<span class="pill"><strong>${fmtInt(ROOT.theorems_lemmas)}</strong> thm+lem</span>`,
      `<span class="pill"><strong>${fmtInt(ROOT.defs_structures)}</strong> def+str</span>`
    ].join("");
  }

  function renderBreadcrumbs() {
    const cur = getActiveZoomNode();
    const chain = [];
    let walk = cur;
    while (walk) {
      chain.push(walk);
      walk = parentByPath.get(walk.path);
    }
    chain.reverse();

    const parts = chain.map((n, i) => {
      const isLast = i === chain.length - 1 && !state.directOnlyMode;
      return `<span class="crumb ${isLast ? "current" : ""}" data-path="${esc(n.path)}">${esc(n.name)}</span>`;
    });
    if (state.directOnlyMode) {
      parts.push(`<span class="crumb current">[direct .lean files]</span>`);
    }
    const el = document.getElementById("breadcrumbs");
    el.innerHTML = parts.join(`<span class="crumb-sep">/</span>`);
    el.querySelectorAll(".crumb:not(.current)").forEach(sp => {
      sp.addEventListener("click", () => zoomTo(sp.getAttribute("data-path"), false));
    });

    document.getElementById("btn-up").disabled = !state.zoomPath && !state.directOnlyMode;
    document.getElementById("btn-root").disabled = !state.zoomPath && !state.directOnlyMode;
  }

  function renderViz() {
    const zoomNode = getActiveZoomNode();
    const rect = stageEl.getBoundingClientRect();
    const width = Math.max(320, Math.floor(rect.width));
    const height = Math.max(280, Math.floor(rect.height));
    if (state.view === "treemap") {
      renderTreemap(zoomNode, width, height);
    } else {
      renderSunburst(zoomNode, width, height);
    }
  }

  function updateDepthControl() {
    const label = document.getElementById("depth-label");
    const seg = document.getElementById("ctrl-depth");
    if (state.view === "treemap") {
      label.textContent = "Nesting";
      seg.innerHTML = `
        <button type="button" data-val="nested" class="${state.tmNested ? "active" : ""}">2-Level</button>
        <button type="button" data-val="flat" class="${!state.tmNested ? "active" : ""}">1-Level</button>
      `;
      seg.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", () => {
          state.tmNested = btn.getAttribute("data-val") === "nested";
          updateDepthControl();
          renderViz();
        });
      });
    } else {
      label.textContent = "Rings";
      seg.innerHTML = `
        <button type="button" data-val="3" class="${state.sbRings === 3 ? "active" : ""}">3 Rings</button>
        <button type="button" data-val="4" class="${state.sbRings === 4 ? "active" : ""}">4 Rings</button>
      `;
      seg.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", () => {
          state.sbRings = Number(btn.getAttribute("data-val"));
          updateDepthControl();
          renderViz();
        });
      });
    }
  }

  function renderAll() {
    const zoomNode = getActiveZoomNode();
    renderBreadcrumbs();
    renderLegend();
    renderInspector(zoomNode);
    renderViz();
  }

  // Bind segmented controls
  function bindSeg(id, key) {
    const el = document.getElementById(id);
    el.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        el.querySelectorAll("button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state[key] = btn.getAttribute("data-val");
        if (key === "view") updateDepthControl();
        if (DATA && ROOT) renderAll();
      });
    });
  }

  // Search box
  const searchInput = document.getElementById("dir-search");
  const searchRes = document.getElementById("search-results");

  function updateSearch() {
    if (!DATA || !ROOT) return;
    const q = searchInput.value.trim().toLowerCase();
    if (!q) {
      searchRes.classList.remove("open");
      searchRes.innerHTML = "";
      return;
    }
    const matches = [];
    for (let i = 0; i < allDirNodes.length; i++) {
      const n = allDirNodes[i];
      const p = (n.path || "lean/src").toLowerCase();
      if (p.includes(q)) {
        matches.push(n);
        if (matches.length >= 14) break;
      }
    }
    if (matches.length === 0) {
      searchRes.innerHTML = `<div class="search-item"><span class="search-path" style="color:var(--dim)">No matching folder</span></div>`;
    } else {
      searchRes.innerHTML = matches.map(n => `
        <div class="search-item" data-path="${esc(n.path)}">
          <span class="search-path">${esc(n.path || "lean/src")}</span>
          <span class="search-meta">${fmtInt(n.files)}f · ${fmtCompact(n.lines)}L</span>
        </div>
      `).join("");
      searchRes.querySelectorAll(".search-item").forEach(item => {
        item.addEventListener("click", () => {
          const p = item.getAttribute("data-path");
          if (p !== null) zoomTo(p, false);
          searchRes.classList.remove("open");
        });
      });
    }
    searchRes.classList.add("open");
  }

  function setupStaticListeners() {
    bindSeg("ctrl-view", "view");
    bindSeg("ctrl-metric", "metric");
    bindSeg("ctrl-color", "colorMode");
    updateDepthControl();

    document.getElementById("btn-up").addEventListener("click", () => { if (DATA && ROOT) zoomUp(); });
    document.getElementById("btn-root").addEventListener("click", () => { if (DATA && ROOT) zoomTo("", false); });

    document.querySelectorAll(".qp-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        if (DATA && ROOT) zoomTo(btn.getAttribute("data-jump"), false);
      });
    });

    searchInput.addEventListener("input", updateSearch);
    searchInput.addEventListener("focus", () => { if (searchInput.value.trim()) updateSearch(); });
    searchInput.addEventListener("keydown", ev => {
      if (ev.key === "Enter") {
        const first = searchRes.querySelector(".search-item[data-path]");
        if (first && DATA && ROOT) {
          zoomTo(first.getAttribute("data-path"), false);
          searchRes.classList.remove("open");
        }
      } else if (ev.key === "Escape") {
        searchRes.classList.remove("open");
      }
    });
    document.addEventListener("click", ev => {
      if (!ev.target.closest(".search-wrap")) searchRes.classList.remove("open");
    });

    if (typeof ResizeObserver !== "undefined") {
      let rafId = null;
      new ResizeObserver(() => {
        if (!DATA || !ROOT) return;
        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(renderViz);
      }).observe(stageEl);
    } else {
      window.addEventListener("resize", () => {
        if (DATA && ROOT) renderViz();
      });
    }
  }

  function prepareHierarchy(data) {
    if (!data || !data.tree) {
      return { data: null, root: null, srcRoot: "src", nodeByPath: new Map(), parentByPath: new Map(), allDirNodes: [] };
    }
    const pNodeByPath = new Map();
    const pParentByPath = new Map();
    const pAllDirNodes = [];
    function indexTree(node, parent) {
      pNodeByPath.set(node.path, node);
      pParentByPath.set(node.path, parent);
      pAllDirNodes.push(node);
      const ch = node.children || [];
      for (let i = 0; i < ch.length; i++) {
        indexTree(ch[i], node);
      }
    }
    indexTree(data.tree, null);
    pAllDirNodes.sort((a, b) => b.lines - a.lines);
    return {
      data,
      root: data.tree,
      srcRoot: data.src_root || "src",
      nodeByPath: pNodeByPath,
      parentByPath: pParentByPath,
      allDirNodes: pAllDirNodes
    };
  }

  function applyHierarchy(prepared, ver) {
    hideTooltip();
    searchRes.classList.remove("open");
    if (!prepared || !prepared.data || !prepared.root) {
      stageEl.innerHTML = "<div style='padding:24px;color:#b91c1c;font-family:monospace'>Missing hierarchy_data.js dataset.</div>";
      return;
    }

    DATA = prepared.data;
    SRC_ROOT = prepared.srcRoot;
    ROOT = prepared.root;
    nodeByPath = prepared.nodeByPath;
    parentByPath = prepared.parentByPath;
    allDirNodes = prepared.allDirNodes;

    const curVer = ver || (window.RHVersion && RHVersion.current);
    if (curVer) {
      document.getElementById("treemap-title").textContent =
        `Riemann Proof (${curVer.short_label || curVer.label}) — Size, Treemap & Sunburst Explorer`;
    }

    const qpWrap = document.querySelector(".quick-picks");
    if (qpWrap) {
      let picks = [];
      if (nodeByPath.has("Development/AbelianVarietyTheory/Proofs/DivisorProofs")) {
        picks = [
          ["Development/AbelianVarietyTheory/Proofs/DivisorProofs", "DivisorProofs"],
          ["Formalism/HermitianCurvature/HermitianCurvatureProofs", "HermitianCurvatureProofs"],
          ["Development/AutomorphicArithmetic/IntegralCasts/CapelliIdentities", "CapelliIdentities"],
          ["GroundTheory/HeightsAndTheta/Heights", "Heights"],
          ["Lemmata", "Lemmata"]
        ].filter(([p]) => nodeByPath.has(p));
      } else {
        const d2Cands = [];
        (ROOT.children || []).forEach(top => {
          if (top.name === "(root)") return;
          (top.children || []).forEach(ch => {
            if (!ch.isDirectBundle && ch.path) d2Cands.push(ch);
          });
        });
        d2Cands.sort((a, b) => (b.lines || 0) - (a.lines || 0));
        picks = d2Cands.slice(0, 5).map(ch => [ch.path, ch.path]);
      }
      qpWrap.innerHTML = `<span class="qp-label">Quick jump:</span>` + picks.map(([p, lbl]) =>
        `<button type="button" class="qp-btn" data-jump="${esc(p)}">${esc(lbl)}</button>`
      ).join("");
      qpWrap.querySelectorAll(".qp-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          if (DATA && ROOT) zoomTo(btn.getAttribute("data-jump"), false);
        });
      });
    }

    if (state.zoomPath && !nodeByPath.has(state.zoomPath)) {
      state.zoomPath = "";
      state.directOnlyMode = false;
    }

    updateDepthControl();
    renderHeader();
    renderAll();
  }

  setupStaticListeners();
