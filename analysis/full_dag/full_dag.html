      gl.uniform1f(nodeLocs.u_maxDepth, curMaxDepth + 0.5);
      gl.drawArrays(gl.POINTS, 0, av.nodeCount);

      if (useBuckets === 8) {
        lastFullDrawMs = performance.now() - t0;
      }

      drawOverlay();
    }

    function scheduleRender() {
      if (!rafPending) {
        rafPending = true;
        requestAnimationFrame(renderFrame);
      }
    }

    function markInteracting() {
      isInteracting = true;
      if (idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        isInteracting = false;
        scheduleRender();
      }, 90);
    }

    function zoomAt(screenX, screenY, factor) {
      const minZoom = fitZoom * 0.4;
      const maxZoom = 380.0;
      const nextZoom = Math.max(minZoom, Math.min(maxZoom, zoom * factor));
      if (Math.abs(nextZoom - zoom) < 1e-9) return;
      const wx = (screenX - panX) / zoom;
      const wy = (screenY - panY) / zoom;
      zoom = nextZoom;
      panX = screenX - wx * zoom;
      panY = screenY - wy * zoom;
      markInteracting();
      scheduleRender();
    }

    function formatPct(cur, base) {
      if (base <= 0) return "0%";
      const pct = cur === base ? 100 : Math.min(99, Math.round((100 * cur) / base));
      return pct + "%";
    }

    function setToggleLabelAria(offEl, onEl, active) {
      if (offEl) offEl.setAttribute("aria-hidden", String(active));
      if (onEl) onEl.setAttribute("aria-hidden", String(!active));
    }

    function updateToggleLabels() {
      setToggleLabelAria(lblCollapseOff, lblCollapseOn, viewState.existing);
      setToggleLabelAria(lblHasseOff, lblHasseOn, viewState.hasse);
      setToggleLabelAria(lblChainsOff, lblChainsOn, viewState.simplify);
    }

    function syncDepthControls() {
      const av = activeView;
      const curD = getEffectiveMaxDepth(av);
      const isAll = maxDepthLimit === null || curD >= av.maxDepth;
      if (depthSlider) {
        depthSlider.max = String(av.maxDepth);
        depthSlider.value = String(curD);
      }
      if (depthNumber) {
        depthNumber.max = String(av.maxDepth);
        depthNumber.value = String(curD);
      }
      if (depthTotal) {
        depthTotal.textContent = "/ " + av.maxDepth;
      }
      if (btnDepthAll) {
        btnDepthAll.setAttribute("aria-pressed", String(isAll));
      }
    }

    function setMaxDepth(val) {
      const av = activeView;
      if (val === null || val >= av.maxDepth) {
        maxDepthLimit = null;
      } else {
        maxDepthLimit = Math.max(0, Math.floor(val));
      }
      syncDepthControls();
      updateViewStats();
      updateModeMetadata();
      scheduleRender();
    }

    function updateViewStats() {
      const av = activeView;
      const curD = getEffectiveMaxDepth(av);
      const shownNodes = av.nodesByDepth ? av.nodesByDepth[curD] : av.nodeCount;
      const shownEdges = av.edgesByDepth ? av.edgesByDepth[curD] : av.edgeCount;
      const shownLayers = av.layersByDepth ? av.layersByDepth[curD] : av.numLayers;
      if (statNodesAbs) statNodesAbs.textContent = shownNodes.toLocaleString();
      if (statEdgesAbs) statEdgesAbs.textContent = shownEdges.toLocaleString();
      if (statLayersAbs) statLayersAbs.textContent = shownLayers.toLocaleString();
      if (statNodesPct) statNodesPct.textContent = formatPct(shownNodes, N);
      if (statEdgesPct) statEdgesPct.textContent = formatPct(shownEdges, M);
      if (statLayersPct) statLayersPct.textContent = formatPct(shownLayers, numLayers);
    }

    function updateModeMetadata() {
      const av = activeView;
      const curD = getEffectiveMaxDepth(av);
      const shownNodes = av.nodesByDepth ? av.nodesByDepth[curD] : av.nodeCount;
      const shownEdges = av.edgesByDepth ? av.edgesByDepth[curD] : av.edgeCount;
      const shownLayers = av.layersByDepth ? av.layersByDepth[curD] : av.numLayers;
      window.__FULL_DAG_MODE__ = av.key;
      window.__FULL_DAG_STATS__ = {
        mode: av.key,
        existing: viewState.existing,
        hasse: viewState.hasse,
        simplify: viewState.simplify,
        maxDepth: maxDepthLimit,
        effectiveMaxDepth: curD,
        viewMaxDepth: av.maxDepth,
        nodeCount: shownNodes,
        edgeCount: shownEdges,
        numLayers: shownLayers,
        collapsedModules: viewState.existing && cMeta ? cMeta.collapsed_module_count : 0,
        supernodeCount: viewState.existing && cMeta ? cMeta.supernode_count : 0,
      };
    }

    function applyViewState(preserveCamera) {
      const nextView = getViewForState(viewState);
      if (!nextView) return;
      activeView = nextView;

      if (btnCollapse) btnCollapse.setAttribute("aria-pressed", String(viewState.existing));
      if (btnHideRedundant) btnHideRedundant.setAttribute("aria-pressed", String(viewState.hasse));
      if (btnCollapseChains) btnCollapseChains.setAttribute("aria-pressed", String(viewState.simplify));

      updateToggleLabels();
      syncDepthControls();
      updateViewStats();

      if (legendSuperNote) legendSuperNote.classList.toggle("visible", viewState.existing);
      if (legendAnchorNote) legendAnchorNote.classList.toggle("visible", viewState.simplify);
      if (legendWedgeNote) legendWedgeNote.classList.toggle("visible", viewState.existing || viewState.simplify);

      lastFullDrawMs = 0;
      isInteracting = false;
      if (!preserveCamera) {
        fitToView();
      }
      updateModeMetadata();
      renderFrame();
    }

    function toggleExistingTheory() {
      if (!cMeta) return;
      viewState.existing = !viewState.existing;
      applyViewState(false);
    }

    function toggleHideRedundant() {
      if (!fullHasseMeta) return;
      const preserveCamera = !viewState.simplify;
      viewState.hasse = !viewState.hasse;
      applyViewState(preserveCamera);
    }

    function toggleCollapseChains() {
      if (!simpMetaMap) return;
      viewState.simplify = !viewState.simplify;
      applyViewState(false);
    }

    if (controlsStack) controlsStack.classList.add("visible");
    if (cMeta || fullHasseMeta || simpMetaMap) {
      if (cMeta && btnCollapse) {
        btnCollapse.hidden = false;
        btnCollapse.addEventListener("click", toggleExistingTheory);
      }
      if (fullHasseMeta && btnHideRedundant) {
        btnHideRedundant.hidden = false;
        btnHideRedundant.addEventListener("click", toggleHideRedundant);
      }
      if (simpMetaMap && btnCollapseChains) {
        btnCollapseChains.hidden = false;
        btnCollapseChains.addEventListener("click", toggleCollapseChains);
      }
    } else if (collapsePill) {
      collapsePill.hidden = true;
    }

    if (depthSlider) {
      depthSlider.addEventListener("input", () => {
        const val = parseInt(depthSlider.value, 10);
        if (!Number.isNaN(val)) setMaxDepth(val);
      });
    }
    if (depthNumber) {
      depthNumber.addEventListener("input", () => {
        const raw = depthNumber.value.trim();
        if (raw === "") return;
        const val = parseInt(raw, 10);
        if (!Number.isNaN(val)) setMaxDepth(Math.max(0, Math.min(activeView.maxDepth, val)));
      });
      depthNumber.addEventListener("blur", () => {
        syncDepthControls();
      });
    }
    if (btnDepthAll) {
      btnDepthAll.addEventListener("click", () => {
        setMaxDepth(null);
      });
    }

    if (btnLegendToggle && legendPill) {
      btnLegendToggle.addEventListener("click", () => {
        const isCollapsed = legendPill.classList.toggle("collapsed");
        btnLegendToggle.setAttribute("aria-expanded", String(!isCollapsed));
        if (legendToggleIcon) {
          legendToggleIcon.textContent = isCollapsed ? "+" : "\u2212";
        }
        scheduleRender();
      });
    }

    // Initial sizing & first draw
    updateToggleLabels();
    syncDepthControls();
    updateViewStats();
    resizeCanvases(false);
    loadingEl.remove();
    glCanvas.style.visibility = "visible";
    updateModeMetadata();
    renderFrame();
    window.__FULL_DAG_READY__ = true;

    // Mouse wheel / trackpad zoom
    glCanvas.addEventListener(
      "wheel",
      (ev) => {
        ev.preventDefault();
        let dy = ev.deltaY;
        if (ev.deltaMode === 1) dy *= 16;
        else if (ev.deltaMode === 2) dy *= cssH;
        const clamped = Math.max(-180, Math.min(180, dy));
        const factor = Math.exp(-clamped * 0.0018);
        zoomAt(ev.clientX, ev.clientY, factor);
      },
      { passive: false }
    );

    // Pointer pan + multi-touch pinch-zoom (strictly no node clicking or tooltips)
    const pointers = new Map();
    let dragLastX = 0;
    let dragLastY = 0;
    let pinchLastDist = 0;
    let pinchLastMidX = 0;
    let pinchLastMidY = 0;

    glCanvas.addEventListener("pointerdown", (ev) => {
      if (ev.button !== 0 && ev.pointerType === "mouse") return;
      glCanvas.setPointerCapture(ev.pointerId);
      pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pointers.size === 1) {
        dragLastX = ev.clientX;
        dragLastY = ev.clientY;
        glCanvas.classList.add("grabbing");
      } else if (pointers.size === 2) {
        const pts = Array.from(pointers.values());
        pinchLastDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        pinchLastMidX = 0.5 * (pts[0].x + pts[1].x);
        pinchLastMidY = 0.5 * (pts[0].y + pts[1].y);
      }
    });

    glCanvas.addEventListener("pointermove", (ev) => {
      if (!pointers.has(ev.pointerId)) return;
      pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });

      if (pointers.size === 1) {
        const dx = ev.clientX - dragLastX;
        const dy = ev.clientY - dragLastY;
        if (dx === 0 && dy === 0) return;
        dragLastX = ev.clientX;
        dragLastY = ev.clientY;
        panX += dx;
        panY += dy;
        markInteracting();
        scheduleRender();
      } else if (pointers.size >= 2) {
        const pts = Array.from(pointers.values());
        const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        const midX = 0.5 * (pts[0].x + pts[1].x);
        const midY = 0.5 * (pts[0].y + pts[1].y);
        panX += midX - pinchLastMidX;
        panY += midY - pinchLastMidY;
        if (pinchLastDist > 1 && dist > 1) {
          zoomAt(midX, midY, dist / pinchLastDist);
        } else {
          markInteracting();
          scheduleRender();
        }
        pinchLastDist = dist;
        pinchLastMidX = midX;
        pinchLastMidY = midY;
      }
    });

    function endPointer(ev) {
      if (!pointers.has(ev.pointerId)) return;
      pointers.delete(ev.pointerId);
      if (pointers.size === 1) {
        const rem = Array.from(pointers.values())[0];
        dragLastX = rem.x;
        dragLastY = rem.y;
      } else if (pointers.size === 0) {
        glCanvas.classList.remove("grabbing");
      }
    }

    glCanvas.addEventListener("pointerup", endPointer);
    glCanvas.addEventListener("pointercancel", endPointer);

    // Corner zoom pill controls
    btnZoomIn.addEventListener("click", () => {
      zoomAt(cssW * 0.5, cssH * 0.5, 1.45);
    });
    btnZoomOut.addEventListener("click", () => {
      zoomAt(cssW * 0.5, cssH * 0.5, 1.0 / 1.45);
    });
    btnReset.addEventListener("click", () => {
      fitToView();
      isInteracting = false;
      scheduleRender();
    });

    // Keyboard pan/zoom + collapse toggle
    window.addEventListener("keydown", (ev) => {
      if (ev.target && /^(INPUT|SELECT|TEXTAREA)$/.test(ev.target.tagName)) return;
      if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
      const step = Math.round(Math.min(cssW, cssH) * 0.14);
      if (ev.key === "c" || ev.key === "C") {
        ev.preventDefault();
        toggleExistingTheory();
      } else if (ev.key === "h" || ev.key === "H") {
        ev.preventDefault();
        toggleHideRedundant();
      } else if (ev.key === "l" || ev.key === "L") {
        ev.preventDefault();
        toggleCollapseChains();
      } else if (ev.key === "[") {
        ev.preventDefault();
        setMaxDepth(Math.max(0, getEffectiveMaxDepth() - 1));
      } else if (ev.key === "]") {
        ev.preventDefault();
        setMaxDepth(Math.min(activeView.maxDepth, getEffectiveMaxDepth() + 1));
      } else if (ev.key === "+" || ev.key === "=") {
        ev.preventDefault();
        zoomAt(cssW * 0.5, cssH * 0.5, 1.35);
      } else if (ev.key === "-" || ev.key === "_") {
        ev.preventDefault();
        zoomAt(cssW * 0.5, cssH * 0.5, 1.0 / 1.35);
      } else if (ev.key === "0" || ev.key === "r" || ev.key === "R") {
        ev.preventDefault();
        fitToView();
        isInteracting = false;
        scheduleRender();
      } else if (ev.key === "ArrowLeft") {
        ev.preventDefault();
        panX += step;
        markInteracting();
        scheduleRender();
      } else if (ev.key === "ArrowRight") {
        ev.preventDefault();
        panX -= step;
        markInteracting();
        scheduleRender();
      } else if (ev.key === "ArrowUp") {
        ev.preventDefault();
        panY += step;
        markInteracting();
        scheduleRender();
      } else if (ev.key === "ArrowDown") {
        ev.preventDefault();
        panY -= step;
        markInteracting();
        scheduleRender();
      }
    });

    window.addEventListener("resize", () => {
      resizeCanvases(true);
      scheduleRender();
    });
  }

  RHVersion.loadDataScript("full_dag/full_dag_data.js", "__FULL_DAG_GZ_B64__", () => init());
})();
</script>
