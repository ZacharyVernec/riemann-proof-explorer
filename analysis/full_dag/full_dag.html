  function showLoadError(msg) {
    loadingEl.textContent = msg;
    loadingEl.style.color = "#b91c1c";
    loadingEl.style.borderColor = "#fca5a5";
  }

  function base64ToUint8Array(b64) {
    const bin = atob(b64);
    const len = bin.length;
    const out = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      out[i] = bin.charCodeAt(i);
    }
    return out;
  }

  async function gunzipBuffer(gzBytes) {
    if (typeof DecompressionStream === "function") {
      const ds = new DecompressionStream("gzip");
      const stream = new Blob([gzBytes]).stream().pipeThrough(ds);
      return await new Response(stream).arrayBuffer();
    }
    throw new Error("DecompressionStream('gzip') is unavailable in this browser.");
  }

  function align4(pos) {
    return (pos + 3) & ~3;
  }

  function lowerBound(arr, lo, hi, val) {
    let l = lo, r = hi;
    while (l < r) {
      const m = (l + r) >>> 1;
      if (arr[m] < val) l = m + 1;
      else r = m;
    }
    return l;
  }

  function upperBound(arr, lo, hi, val) {
    let l = lo, r = hi;
    while (l < r) {
      const m = (l + r) >>> 1;
      if (arr[m] <= val) l = m + 1;
      else r = m;
    }
    return l;
  }

  function compileShader(gl, type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(sh);
      gl.deleteShader(sh);
      throw new Error("Shader compile error: " + log);
    }
    return sh;
  }

  function linkProgram(gl, vsSrc, fsSrc) {
    const vs = compileShader(gl, gl.VERTEX_SHADER, vsSrc);
    const fs = compileShader(gl, gl.FRAGMENT_SHADER, fsSrc);
    const prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      const log = gl.getProgramInfoLog(prog);
      gl.deleteProgram(prog);
      throw new Error("Program link error: " + log);
    }
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    return prog;
  }

  function formatCompact(n) {
    if (n >= 10000) return (n / 1000).toFixed(1) + "k";
    return n.toLocaleString();
  }

  async function init() {
    const b64 = window.__FULL_DAG_GZ_B64__;
    if (!b64 || typeof b64 !== "string") {
      showLoadError("Missing full_dag_data.js dataset.");
      return;
    }

    let rawBuf;
    try {
      const gzBytes = base64ToUint8Array(b64);
      rawBuf = await gunzipBuffer(gzBytes);
      delete window.__FULL_DAG_GZ_B64__;
    } catch (err) {
      showLoadError("Failed to decompress DAG data: " + (err && err.message ? err.message : err));
      return;
    }

    const view = new DataView(rawBuf);
    const u8 = new Uint8Array(rawBuf);
    const td = new TextDecoder("utf-8");

    if (
      u8[0] !== 76 || // 'L'
      u8[1] !== 68 || // 'D'
      u8[2] !== 65 || // 'A'
      u8[3] !== 71    // 'G'
    ) {
      showLoadError("Invalid binary DAG container magic.");
      return;
    }

    const version = view.getUint32(4, true);
    if (version !== 1 && version !== 2 && version !== 3) {
      showLoadError("Unsupported binary DAG version: " + version);
      return;
    }

    const headerLen = view.getUint32(8, true);
    let pos = 12;
    const header = JSON.parse(td.decode(u8.subarray(pos, pos + headerLen)));
    pos = align4(pos + headerLen);

    const N = header.node_count;
    const M = header.edge_count;
    const numLayers = header.num_layers;
    const layerDy = header.layer_dy;
    const bounds = header.bounds;
    const groups = header.groups;

    const layerOffsets = new Uint32Array(rawBuf, pos, numLayers + 1);
    pos += (numLayers + 1) * 4;

    const nodeX = new Float32Array(rawBuf, pos, N);
    pos += N * 4;

    const nodeGroup = new Uint8Array(rawBuf, pos, N);
    pos = align4(pos + N);

    const nodeInDeg = new Uint16Array(rawBuf, pos, N);
    pos = align4(pos + N * 2);

    const nodeOutDeg = new Uint16Array(rawBuf, pos, N);
    pos = align4(pos + N * 2);

    const nodeDirId = new Uint32Array(rawBuf, pos, N);
    pos += N * 4;

    const dirBlobLen = view.getUint32(pos, true);
    pos += 4;
    const dirList = td.decode(u8.subarray(pos, pos + dirBlobLen)).split("\n");
    pos = align4(pos + dirBlobLen);

    const nameBlobLen = view.getUint32(pos, true);
    pos += 4;
    const shortNames = td.decode(u8.subarray(pos, pos + nameBlobLen)).split("\n");
    pos = align4(pos + nameBlobLen);

    const edgesBlobLen = view.getUint32(pos, true);
    pos += 4;
    const edgeStream = u8.subarray(pos, pos + edgesBlobLen);
    pos = align4(pos + edgesBlobLen);

    // Optional LDAG v2 collapsed data
    let cMeta = null;
    let cLayerOffsets = null;
    let cNodeX = null;
    let cNodeFullId = null;
    let cSuperCounts = null;
    let cSuperFrontierCounts = null;
    let cSuperGroup = null;
    let cSuperTitles = null;
    let cSuperEdgeStream = null;
    let deadEdgesRaw = null;

    if (version >= 2 && header.collapsed) {
      cMeta = header.collapsed;
      const cN = cMeta.node_count;
      const cNumLayers = cMeta.num_layers;
      const cSuperN = cMeta.supernode_count;

      cLayerOffsets = new Uint32Array(rawBuf, pos, cNumLayers + 1);
      pos += (cNumLayers + 1) * 4;

      cNodeX = new Float32Array(rawBuf, pos, cN);
      pos += cN * 4;

      cNodeFullId = new Int32Array(rawBuf, pos, cN);
      pos += cN * 4;

      cSuperCounts = new Uint32Array(rawBuf, pos, cSuperN);
      pos += cSuperN * 4;

      cSuperFrontierCounts = new Uint16Array(rawBuf, pos, cSuperN);
      pos = align4(pos + cSuperN * 2);

      cSuperGroup = new Uint8Array(rawBuf, pos, cSuperN);
      pos = align4(pos + cSuperN);

      const cTitlesLen = view.getUint32(pos, true);
      pos += 4;
      cSuperTitles = cTitlesLen > 0 ? td.decode(u8.subarray(pos, pos + cTitlesLen)).split("\n") : [];
      pos = align4(pos + cTitlesLen);

      const cSuperEdgesLen = view.getUint32(pos, true);
      pos += 4;
      cSuperEdgeStream = u8.subarray(pos, pos + cSuperEdgesLen);
      pos = align4(pos + cSuperEdgesLen);

      const deadEdgeCount = view.getUint32(pos, true);
      pos += 4;
      deadEdgesRaw = new Uint32Array(rawBuf, pos, deadEdgeCount * 2);
      pos += deadEdgeCount * 8;
    }

    // Optional LDAG v3 Hasse bitmasks & 4 simplified views
    let fullHasseMeta = null;
    let existingHasseMeta = null;
    let simpMetaMap = null;
    let fullHasseMask = null;
    let existingHasseMask = null;
    const simpRaw = {};

    if (version >= 3) {
      fullHasseMeta = header.full_hasse || null;
      existingHasseMeta = header.existing_hasse || null;
      simpMetaMap = header.simplified || null;

      if (fullHasseMeta) {
        const fMaskLen = view.getUint32(pos, true);
        pos += 4;
        fullHasseMask = u8.subarray(pos, pos + fMaskLen);
        pos = align4(pos + fMaskLen);
      }

      if (existingHasseMeta) {
        const eMaskLen = view.getUint32(pos, true);
        pos += 4;
        existingHasseMask = u8.subarray(pos, pos + eMaskLen);
        pos = align4(pos + eMaskLen);
      }

      if (simpMetaMap) {
        const simpKeys = ["full_simp", "full_hasse_simp", "existing_simp", "existing_hasse_simp"];
        for (let idx = 0; idx < simpKeys.length; idx++) {
          const skey = simpKeys[idx];
          const sm = simpMetaMap[skey];
          if (!sm) continue;
          const sN = sm.node_count;
          const sLayers = sm.num_layers;

          const sLayerOffsets = new Uint32Array(rawBuf, pos, sLayers + 1);
          pos += (sLayers + 1) * 4;

          const sNodeX = new Float32Array(rawBuf, pos, sN);
          pos += sN * 4;

          const sNodeFullId = new Int32Array(rawBuf, pos, sN);
          pos += sN * 4;

          const recCount = view.getUint32(pos, true);
          pos += 4;
          const recsStart = pos;
          pos += recCount * 16;

          const sEdgeLen = view.getUint32(pos, true);
          pos += 4;
          const sEdgeStream = u8.subarray(pos, pos + sEdgeLen);
          pos = align4(pos + sEdgeLen);

          simpRaw[skey] = {
            meta: sm,
            layerOffsets: sLayerOffsets,
            nodeX: sNodeX,
            nodeFullId: sNodeFullId,
            recCount: recCount,
            recsStart: recsStart,
            edgeStream: sEdgeStream,
          };
        }
      }
    }

    // Derive dense nodeLayer array from layerOffsets
    const nodeLayer = new Uint16Array(N);
    for (let ly = 0; ly < numLayers; ly++) {
      const a = layerOffsets[ly];
      const b = layerOffsets[ly + 1];
      for (let i = a; i < b; i++) {
        nodeLayer[i] = ly;
      }
    }

    // Decode LEB128 CSR edges, count reverse in-degrees and 8 stratified edge buckets
    const edgeOffsets = new Uint32Array(N + 1);
    const edgeTargets = new Uint32Array(M);
    const revCounts = new Uint32Array(N);
    const bucketCounts = new Uint32Array(8);

    let ePtr = 0;
    let tIdx = 0;
    for (let u = 0; u < N; u++) {
      edgeOffsets[u] = tIdx;
      let deg = 0;
      let shift = 0;
      while (true) {
        const b = edgeStream[ePtr++];
        deg |= (b & 0x7f) << shift;
        if ((b & 0x80) === 0) break;
        shift += 7;
      }
      let prevV = 0;
      for (let k = 0; k < deg; k++) {
        let delta = 0;
        shift = 0;
        while (true) {
          const b = edgeStream[ePtr++];
          delta |= (b & 0x7f) << shift;
          if ((b & 0x80) === 0) break;
          shift += 7;
        }
        const v = prevV + delta;
        prevV = v;
        edgeTargets[tIdx++] = v;
        revCounts[v]++;
        const bkt = ((Math.imul(u, 2654435761) ^ Math.imul(v, 2246822519)) >>> 29) & 7;
        bucketCounts[bkt]++;
      }
    }
    edgeOffsets[N] = tIdx;

    // Build reverse CSR for deep-zoom incoming arrowheads
    const revOffsets = new Uint32Array(N + 1);
    let rAcc = 0;
    for (let i = 0; i < N; i++) {
      revOffsets[i] = rAcc;
      rAcc += revCounts[i];
    }
    revOffsets[N] = rAcc;
    const revSources = new Uint32Array(M);
    const revWrite = new Uint32Array(revOffsets);
    for (let u = 0; u < N; u++) {
      const a = edgeOffsets[u];
      const b = edgeOffsets[u + 1];
      for (let k = a; k < b; k++) {
        const v = edgeTargets[k];
        revSources[revWrite[v]++] = u;
      }
    }

    // Group RGB lookup
    const numGroups = groups.length;
    const groupR = new Uint8Array(numGroups);
    const groupG = new Uint8Array(numGroups);
    const groupB = new Uint8Array(numGroups);
    const groupCss = new Array(numGroups);
    for (let g = 0; g < numGroups; g++) {
      groupR[g] = groups[g].rgb[0];
      groupG[g] = groups[g].rgb[1];
      groupB[g] = groups[g].rgb[2];
      groupCss[g] = groups[g].color;
    }

    function buildLegend() {
      if (!legendPill || !legendListEl || !Array.isArray(groups) || groups.length === 0) return;
      const frag = document.createDocumentFragment();
      for (let g = 0; g < groups.length; g++) {
        const item = groups[g];
        const cnt = typeof item.count === "number" ? item.count : 0;
        const li = document.createElement("li");
        li.className = "legend-row";
        li.title = `${item.name}: ${cnt.toLocaleString()} ${cnt === 1 ? "module" : "modules"} (${item.color})`;

        const dot = document.createElement("span");
        dot.className = "legend-dot";
        dot.style.background = item.color;
        dot.setAttribute("aria-hidden", "true");

        const nameEl = document.createElement("span");
        nameEl.className = "legend-name";
        nameEl.textContent = item.name;

        const countEl = document.createElement("span");
        countEl.className = "legend-count";
        countEl.textContent = cnt.toLocaleString();

        li.appendChild(dot);
        li.appendChild(nameEl);
        li.appendChild(countEl);
        frag.appendChild(li);
      }
      legendListEl.textContent = "";
      legendListEl.appendChild(frag);
      legendPill.classList.add("visible");
    }
    buildLegend();

    // Landmark list for fast overview/mid-zoom progressive labels (full DAG)
    const roots = [];
    const nonRoots = [];
    for (let i = 0; i < N; i++) {
      if (nodeInDeg[i] === 0) roots.push(i);
      else if (nodeInDeg[i] >= 12 || nodeLayer[i] <= 12) nonRoots.push(i);
    }
    nonRoots.sort((a, b) => {
      const da = nodeInDeg[a];
      const db = nodeInDeg[b];
      if (da !== db) return db - da;
      return a - b;
    });
    const maxLandmarks = Math.min(1800, nonRoots.length);
    const fullLandmarkIds = new Uint32Array(roots.length + maxLandmarks);
    for (let i = 0; i < roots.length; i++) fullLandmarkIds[i] = roots[i];
    for (let i = 0; i < maxLandmarks; i++) fullLandmarkIds[roots.length + i] = nonRoots[i];

    // Compute shortest-path BFS depth from root nodes (inDeg == 0) plus per-depth stats & bounds
    function computeRootDepths(
      vNodeCount,
      vNodeX,
      vNodeLayer,
      vNumLayers,
      vLayerDy,
      vNodeInDeg,
      vEdgeOffsets,
      vEdgeTargets,
      vFullBounds
    ) {
      const nodeDepth = new Uint16Array(vNodeCount);
      nodeDepth.fill(65535);
      const queue = new Uint32Array(vNodeCount);
      let qHead = 0;
      let qTail = 0;
      for (let i = 0; i < vNodeCount; i++) {
        if (vNodeInDeg[i] === 0) {
          nodeDepth[i] = 0;
          queue[qTail++] = i;
        }
      }
      if (qTail === 0 && vNodeCount > 0) {
        nodeDepth[0] = 0;
        queue[qTail++] = 0;
      }

      let maxDepth = 0;
      while (qHead < qTail) {
        const u = queue[qHead++];
        const nextD = nodeDepth[u] + 1;
        const a = vEdgeOffsets[u];
        const b = vEdgeOffsets[u + 1];
        for (let k = a; k < b; k++) {
          const v = vEdgeTargets[k];
          if (nodeDepth[v] === 65535) {
            nodeDepth[v] = nextD;
            if (nextD > maxDepth) maxDepth = nextD;
            queue[qTail++] = v;
          }
        }
      }

      if (qTail < vNodeCount) {
        for (let i = 0; i < vNodeCount; i++) {
          if (nodeDepth[i] === 65535) nodeDepth[i] = maxDepth;
        }
      }

      const dLen = maxDepth + 1;
      const nodesByDepth = new Uint32Array(dLen);
      const edgesByDepth = new Uint32Array(dLen);
      const layersByDepth = new Uint32Array(dLen);
      const minLayerDepth = new Uint16Array(vNumLayers);
      minLayerDepth.fill(65535);

      const xminD = new Float64Array(dLen);
      const xmaxD = new Float64Array(dLen);
      const yminD = new Float64Array(dLen);
      const ymaxD = new Float64Array(dLen);
      for (let d = 0; d < dLen; d++) {
        xminD[d] = Infinity;
        xmaxD[d] = -Infinity;
        yminD[d] = Infinity;
        ymaxD[d] = -Infinity;
      }

      for (let i = 0; i < vNodeCount; i++) {
        const d = nodeDepth[i];
        nodesByDepth[d]++;
        const ly = vNodeLayer[i];
        if (d < minLayerDepth[ly]) minLayerDepth[ly] = d;
        const x = vNodeX[i];
        const y = ly * vLayerDy;
        if (x < xminD[d]) xminD[d] = x;
        if (x > xmaxD[d]) xmaxD[d] = x;
        if (y < yminD[d]) yminD[d] = y;
        if (y > ymaxD[d]) ymaxD[d] = y;

        const a = vEdgeOffsets[i];
        const b = vEdgeOffsets[i + 1];
        for (let k = a; k < b; k++) {
          const v = vEdgeTargets[k];
          const dv = nodeDepth[v];
          edgesByDepth[d >= dv ? d : dv]++;
        }
      }

      for (let ly = 0; ly < vNumLayers; ly++) {
        const md = minLayerDepth[ly];
        if (md < dLen) layersByDepth[md]++;
      }

      const boundsByDepth = new Array(dLen);
      let accXmin = Infinity, accXmax = -Infinity, accYmin = Infinity, accYmax = -Infinity;
      for (let d = 0; d < dLen; d++) {
        if (d > 0) {
          nodesByDepth[d] += nodesByDepth[d - 1];
          edgesByDepth[d] += edgesByDepth[d - 1];
          layersByDepth[d] += layersByDepth[d - 1];
        }
        if (xminD[d] < accXmin) accXmin = xminD[d];
        if (xmaxD[d] > accXmax) accXmax = xmaxD[d];
        if (yminD[d] < accYmin) accYmin = yminD[d];
        if (ymaxD[d] > accYmax) accYmax = ymaxD[d];
        boundsByDepth[d] =
          d === maxDepth
            ? vFullBounds
            : Number.isFinite(accXmin)
              ? { xmin: accXmin, xmax: accXmax, ymin: accYmin, ymax: accYmax }
              : vFullBounds;
      }

      return {
        nodeDepth,
        maxDepth,
        nodesByDepth,
        edgesByDepth,
        layersByDepth,
        boundsByDepth,
      };
    }

    // Build stratified Edge VBO (12 bytes/vertex: f32 x, f32 y, u8 r,g,b,a) + matching edge depth VBO
    function createEdgeVboData(
      vNodeCount,
      vEdgeCount,
      vNodeX,
      vNodeLayer,
      vLayerDy,
      vNodeGroup,
      vEdgeOffsets,
      vEdgeTargets,
      vEdgeWeights,
      vBucketCounts,
      vNodeFullId,
      vNodeDepth
    ) {
      const bucketEdgeEnd = new Uint32Array(8);
      const bucketWriteVert = new Uint32Array(8);
      let eAcc = 0;
      for (let b = 0; b < 8; b++) {
        bucketWriteVert[b] = eAcc * 2;
        eAcc += vBucketCounts[b];
        bucketEdgeEnd[b] = eAcc;
      }

      const edgeBuf = new ArrayBuffer(vEdgeCount * 24);
      const edgeF32 = new Float32Array(edgeBuf);
      const edgeU8 = new Uint8Array(edgeBuf);
      const edgeDepthArr = new Uint16Array(vEdgeCount * 2);

      for (let u = 0; u < vNodeCount; u++) {
        const ux = vNodeX[u];
        const uy = vNodeLayer[u] * vLayerDy;
        const ug = vNodeGroup[u];
        const ur = groupR[ug], ugr = groupG[ug], ub = groupB[ug];
        const du = vNodeDepth[u];
        const a = vEdgeOffsets[u];
        const b = vEdgeOffsets[u + 1];
        for (let k = a; k < b; k++) {
          const v = vEdgeTargets[k];
          const bkt = ((Math.imul(u, 2654435761) ^ Math.imul(v, 2246822519)) >>> 29) & 7;
          const vIdx = bucketWriteVert[bkt];
          bucketWriteVert[bkt] = vIdx + 2;

          const dv = vNodeDepth[v];
          const ed = du >= dv ? du : dv;
          edgeDepthArr[vIdx] = ed;
          edgeDepthArr[vIdx + 1] = ed;

          let alphaByte = 64; // 1.0x baseline via (v_color.a * 4.0)
          if (vEdgeWeights !== null) {
            const w = vEdgeWeights[k];
            if (w >= 2) {
              alphaByte = Math.min(255, Math.round(124 + 28 * Math.log2(w)));
            } else if (vNodeFullId !== null && vNodeFullId[v] < 0) {
              const sCnt = cSuperCounts[-(vNodeFullId[v] + 1)];
              alphaByte = Math.min(255, Math.round(108 + 20 * Math.log10(Math.max(10, sCnt))));
            }
          } else if (vNodeFullId !== null && vNodeFullId[v] < 0) {
            const sCnt = cSuperCounts[-(vNodeFullId[v] + 1)];
            alphaByte = Math.min(255, Math.round(108 + 20 * Math.log10(Math.max(10, sCnt))));
          }

          const fOff0 = vIdx * 3;
          const bOff0 = vIdx * 12;
          edgeF32[fOff0] = ux;
          edgeF32[fOff0 + 1] = uy;
          edgeU8[bOff0 + 8] = ur;
          edgeU8[bOff0 + 9] = ugr;
          edgeU8[bOff0 + 10] = ub;
          edgeU8[bOff0 + 11] = alphaByte;

          const vg = vNodeGroup[v];
          const fOff1 = fOff0 + 3;
          const bOff1 = bOff0 + 12;
          edgeF32[fOff1] = vNodeX[v];
          edgeF32[fOff1 + 1] = vNodeLayer[v] * vLayerDy;
          edgeU8[bOff1 + 8] = groupR[vg];
          edgeU8[bOff1 + 9] = groupG[vg];
          edgeU8[bOff1 + 10] = groupB[vg];
          edgeU8[bOff1 + 11] = alphaByte;
        }
      }

      return { edgeBuf, edgeDepthArr, bucketEdgeEnd };
    }

    function createNodeVboData(
      vNodeCount,
      vNodeX,
      vNodeLayer,
      vLayerDy,
      vNodeGroup,
      vNodeInDeg,
      vNodeFullId,
      vNodeWeight
    ) {
      const nodeBuf = new ArrayBuffer(vNodeCount * 16);
      const nodeF32 = new Float32Array(nodeBuf);
      const nodeU8 = new Uint8Array(nodeBuf);
      for (let i = 0; i < vNodeCount; i++) {
        const fOff = i * 4;
        const bOff = i * 16;
        let weight;
        let markerByte = 0; // 0: normal disc, 128: weighted anchor disc, 255: literature supernode diamond
        if (vNodeFullId !== null && vNodeFullId[i] < 0) {
          const sCnt = cSuperCounts[-(vNodeFullId[i] + 1)];
          weight = 1.7 + 0.52 * Math.log1p(sCnt);
          markerByte = 255;
        } else {
          const inD = vNodeInDeg[i];
          const baseW = inD === 0 ? 2.4 : (1.0 + 0.32 * Math.log1p(inD));
          const nw = vNodeWeight ? vNodeWeight[i] : 1;
          if (nw > 1) {
            weight = baseW + 0.55 * Math.log1p(nw - 1);
            markerByte = 128;
          } else {
            weight = baseW;
          }
        }
        nodeF32[fOff] = vNodeX[i];
        nodeF32[fOff + 1] = vNodeLayer[i] * vLayerDy;
        nodeF32[fOff + 2] = weight;
        const g = vNodeGroup[i];
        nodeU8[bOff + 12] = groupR[g];
        nodeU8[bOff + 13] = groupG[g];
        nodeU8[bOff + 14] = groupB[g];
        nodeU8[bOff + 15] = markerByte;
      }
      return nodeBuf;
    }

    const fullDepthInfo = computeRootDepths(
      N, nodeX, nodeLayer, numLayers, layerDy, nodeInDeg, edgeOffsets, edgeTargets, bounds
    );
    const fullEdgePack = createEdgeVboData(
      N, M, nodeX, nodeLayer, layerDy, nodeGroup, edgeOffsets, edgeTargets, null, bucketCounts, null, fullDepthInfo.nodeDepth
    );
    const fullNodeBuf = createNodeVboData(N, nodeX, nodeLayer, layerDy, nodeGroup, nodeInDeg, null, null);

    // Initialize WebGL1 (or fallback to 2D Canvas if unavailable)
    const gl =
      glCanvas.getContext("webgl", {
        antialias: true,
        alpha: false,
        preserveDrawingBuffer: true,
        powerPreference: "high-performance",
      }) ||
      glCanvas.getContext("experimental-webgl", {
        antialias: true,
        alpha: false,
        preserveDrawingBuffer: true,
      });

    let edgeProg = null;
    let nodeProg = null;
    let edgeLocs = null;
    let nodeLocs = null;
    let maxPointSize = 64.0;

    if (gl) {
      const edgeVs = [
        "attribute vec2 a_pos;",
        "attribute vec4 a_color;",
        "attribute float a_depth;",
        "uniform vec2 u_scale;",
        "uniform vec2 u_offset;",
        "uniform float u_maxDepth;",
        "varying vec4 v_color;",
        "void main() {",
        "  if (a_depth > u_maxDepth) {",
        "    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);",
        "    v_color = vec4(0.0);",
        "    return;",
        "  }",
        "  gl_Position = vec4(a_pos * u_scale + u_offset, 0.0, 1.0);",
        "  v_color = a_color;",
        "}",
      ].join("\n");

      const edgeFs = [
        "precision mediump float;",
        "uniform float u_alpha;",
        "varying vec4 v_color;",
        "void main() {",
        "  float mult = v_color.a * 4.0;",
        "  gl_FragColor = vec4(v_color.rgb, clamp(u_alpha * mult, 0.0, 0.92));",
        "}",
      ].join("\n");

      const nodeVs = [
        "attribute vec2 a_pos;",
        "attribute float a_weight;",
        "attribute vec4 a_color;",
        "attribute float a_depth;",
        "uniform vec2 u_scale;",
        "uniform vec2 u_offset;",
        "uniform float u_zoom;",
        "uniform float u_dpr;",
        "uniform float u_maxPointSize;",
        "uniform float u_maxDepth;",
        "varying vec4 v_color;",
        "varying float v_pointSize;",
        "varying float v_rimStrength;",
        "varying float v_isSuper;",
        "void main() {",
        "  if (a_depth > u_maxDepth) {",
        "    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);",
        "    gl_PointSize = 0.0;",
        "    v_pointSize = 0.0;",
        "    v_rimStrength = 0.0;",
        "    v_isSuper = 0.0;",
        "    v_color = vec4(0.0);",
        "    return;",
        "  }",
        "  gl_Position = vec4(a_pos * u_scale + u_offset, 0.0, 1.0);",
        "  float sz = (1.25 + 0.55 * a_weight) * (0.72 + 0.38 * sqrt(max(u_zoom, 0.05))) * u_dpr;",
        "  if (u_zoom >= 4.0) {",
        "    float cap = a_color.a > 0.75 ? 0.85 : 0.76;",
        "    sz = min(sz, cap * u_zoom * u_dpr);",
        "  }",
        "  float minSz = (a_color.a > 0.75 ? 2.2 : (a_color.a > 0.25 ? 1.9 : 1.5)) * u_dpr;",
        "  sz = clamp(sz, minSz, u_maxPointSize);",
        "  gl_PointSize = sz;",
        "  v_pointSize = sz;",
        "  v_rimStrength = clamp((sz - 5.5 * u_dpr) / (3.0 * u_dpr), 0.0, 1.0);",
        "  v_isSuper = a_color.a;",
        "  v_color = a_color;",
        "}",
      ].join("\n");

      const nodeFs = [
        "precision mediump float;",
        "varying vec4 v_color;",
        "varying float v_pointSize;",
        "varying float v_rimStrength;",
        "varying float v_isSuper;",
        "void main() {",
        "  vec2 p = (gl_PointCoord - vec2(0.5)) * 2.0;",
        "  if (v_isSuper > 0.75) {",
        "    float dist = abs(p.x) + abs(p.y);",
        "    float edgeW = min(0.45, 2.1 / max(v_pointSize, 2.0));",
        "    float alpha = 1.0 - smoothstep(1.0 - edgeW, 1.0, dist);",
        "    if (alpha < 0.02) discard;",
        "    vec3 col = v_color.rgb;",
        "    if (dist < 0.48 && v_pointSize > 4.5) {",
        "      col = mix(col, vec3(1.0), 0.74);",
        "    } else {",
        "      float rim = smoothstep(0.68, 0.90, dist);",
        "      col = mix(col, col * 0.48, rim * 0.70);",
        "    }",
        "    gl_FragColor = vec4(col, alpha);",
        "  } else {",
        "    float dist = length(p);",
        "    float edgeW = min(0.45, 1.75 / max(v_pointSize, 2.0));",
        "    float alpha = 1.0 - smoothstep(1.0 - edgeW, 1.0, dist);",
        "    if (alpha < 0.02) discard;",
        "    vec3 col = v_color.rgb;",
        "    if (v_isSuper > 0.25 && v_pointSize > 4.5) {",
        "      float ring = smoothstep(0.36, 0.44, dist) * (1.0 - smoothstep(0.54, 0.62, dist));",
        "      col = mix(col, vec3(1.0), ring * 0.78);",
        "    }",
        "    if (v_rimStrength > 0.01) {",
        "      float rim = smoothstep(0.70, 0.86, dist);",
        "      col = mix(col, col * 0.55, rim * 0.75 * v_rimStrength);",
        "    }",
        "    gl_FragColor = vec4(col, alpha);",
        "  }",
        "}",
      ].join("\n");

      edgeProg = linkProgram(gl, edgeVs, edgeFs);
      nodeProg = linkProgram(gl, nodeVs, nodeFs);

      edgeLocs = {
        a_pos: gl.getAttribLocation(edgeProg, "a_pos"),
        a_color: gl.getAttribLocation(edgeProg, "a_color"),
        a_depth: gl.getAttribLocation(edgeProg, "a_depth"),
        u_scale: gl.getUniformLocation(edgeProg, "u_scale"),
        u_offset: gl.getUniformLocation(edgeProg, "u_offset"),
        u_alpha: gl.getUniformLocation(edgeProg, "u_alpha"),
        u_maxDepth: gl.getUniformLocation(edgeProg, "u_maxDepth"),
      };
      nodeLocs = {
        a_pos: gl.getAttribLocation(nodeProg, "a_pos"),
        a_weight: gl.getAttribLocation(nodeProg, "a_weight"),
        a_color: gl.getAttribLocation(nodeProg, "a_color"),
        a_depth: gl.getAttribLocation(nodeProg, "a_depth"),
        u_scale: gl.getUniformLocation(nodeProg, "u_scale"),
        u_offset: gl.getUniformLocation(nodeProg, "u_offset"),
        u_zoom: gl.getUniformLocation(nodeProg, "u_zoom"),
        u_dpr: gl.getUniformLocation(nodeProg, "u_dpr"),
        u_maxPointSize: gl.getUniformLocation(nodeProg, "u_maxPointSize"),
        u_maxDepth: gl.getUniformLocation(nodeProg, "u_maxDepth"),
      };

      const ptRange = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE);
      if (ptRange && ptRange.length >= 2) {
        maxPointSize = Math.min(128.0, ptRange[1]);
      }
    }

    function uploadVbo(buf) {
      if (!gl) return null;
      const vbo = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
      gl.bufferData(gl.ARRAY_BUFFER, buf, gl.STATIC_DRAW);
      return vbo;
    }

    function buildLandmarkIds(vNodeCount, vNodeLayer, vNodeInDeg, vNodeFullId, vNodeWeight) {
      const lRoots = [];
      const lSupers = [];
      const lHubs = [];
      for (let i = 0; i < vNodeCount; i++) {
        const fid = vNodeFullId ? vNodeFullId[i] : i;
        const nw = vNodeWeight ? vNodeWeight[i] : 1;
        if (fid < 0) {
          lSupers.push(i);
        } else if (vNodeInDeg[i] === 0) {
          lRoots.push(i);
        } else if (vNodeInDeg[i] >= 10 || vNodeLayer[i] <= 10 || nw >= 6) {
          lHubs.push(i);
        }
      }
      lSupers.sort((a, b) => {
        const ca = cSuperCounts[-(vNodeFullId[a] + 1)];
        const cb = cSuperCounts[-(vNodeFullId[b] + 1)];
        if (ca !== cb) return cb - ca;
        return a - b;
      });
      lHubs.sort((a, b) => {
        const na = vNodeWeight ? vNodeWeight[a] : 1;
        const nb = vNodeWeight ? vNodeWeight[b] : 1;
        const sa = vNodeInDeg[a] + (na > 1 ? na * 12 : 0);
        const sb = vNodeInDeg[b] + (nb > 1 ? nb * 12 : 0);
        if (sa !== sb) return sb - sa;
        return a - b;
      });
      const maxHubs = Math.min(1400, lHubs.length);
      const out = new Uint32Array(lRoots.length + lSupers.length + maxHubs);
      let off = 0;
      for (let i = 0; i < lRoots.length; i++) out[off++] = lRoots[i];
      for (let i = 0; i < lSupers.length; i++) out[off++] = lSupers[i];
      for (let i = 0; i < maxHubs; i++) out[off++] = lHubs[i];
      return out;
    }

    function buildHeavyEdgeList(
      vNodeCount,
      vEdgeOffsets,
      vEdgeTargets,
      vEdgeWeights,
      vEdgeMults,
      vEdgeChains,
      vNodeFullId,
      maxKeep
    ) {
      if (!vEdgeWeights && !vNodeFullId) return null;
      const cU = [];
      const cV = [];
      const cM = [];
      const cC = [];
      const cScore = [];
      for (let u = 0; u < vNodeCount; u++) {
        const a = vEdgeOffsets[u];
        const b = vEdgeOffsets[u + 1];
        for (let k = a; k < b; k++) {
          const v = vEdgeTargets[k];
          const w = vEdgeWeights ? vEdgeWeights[k] : 1;
          const mult = vEdgeMults ? vEdgeMults[k] : w;
          const ch = vEdgeChains ? vEdgeChains[k] : 0;
          const isLargeSuper =
            vNodeFullId !== null &&
            vNodeFullId[v] < 0 &&
            cSuperCounts[-(vNodeFullId[v] + 1)] >= 400;
          if (w >= 2 || isLargeSuper) {
            cU.push(u);
            cV.push(v);
            cM.push(mult);
            cC.push(ch);
            cScore.push(w >= 2 ? w * 1000 : 500 + (isLargeSuper ? 1 : 0));
          }
        }
      }
      const total = cU.length;
      if (total === 0) return null;
      if (total <= maxKeep) {
        const out = new Uint32Array(total * 4);
        for (let i = 0; i < total; i++) {
          const j = i * 4;
          out[j] = cU[i];
          out[j + 1] = cV[i];
          out[j + 2] = cM[i];
          out[j + 3] = cC[i];
        }
        return out;
      }
      const idxs = new Uint32Array(total);
      for (let i = 0; i < total; i++) idxs[i] = i;
      idxs.sort((ia, ib) => {
        const d = cScore[ib] - cScore[ia];
        return d !== 0 ? d : ia - ib;
      });
      const out = new Uint32Array(maxKeep * 4);
      for (let i = 0; i < maxKeep; i++) {
        const src = idxs[i];
        const j = i * 4;
        out[j] = cU[src];
        out[j + 1] = cV[src];
        out[j + 2] = cM[src];
        out[j + 3] = cC[src];
      }
      return out;
    }

    const fullView = {
      key: "full",
      isExisting: false,
      isHasse: false,
      isSimplified: false,
      nodeCount: N,
      edgeCount: M,
      numLayers: numLayers,
      layerDy: layerDy,
      bounds: bounds,
      layerOffsets: layerOffsets,
      nodeX: nodeX,
      nodeLayer: nodeLayer,
      nodeGroup: nodeGroup,
      nodeInDeg: nodeInDeg,
      nodeOutDeg: nodeOutDeg,
      nodeFullId: null,
      nodeWeight: null,
      nodeMetaMap: null,
      edgeOffsets: edgeOffsets,
      edgeTargets: edgeTargets,
      edgeWeights: null,
      edgeMults: null,
      edgeChains: null,
      revOffsets: revOffsets,
      revSources: revSources,
      revWeights: null,
      landmarkIds: fullLandmarkIds,
      heavyEdgeList: null,
      bucketEdgeEnd: fullEdgePack.bucketEdgeEnd,
      nodeDepth: fullDepthInfo.nodeDepth,
      maxDepth: fullDepthInfo.maxDepth,
      nodesByDepth: fullDepthInfo.nodesByDepth,
      edgesByDepth: fullDepthInfo.edgesByDepth,
      layersByDepth: fullDepthInfo.layersByDepth,
      boundsByDepth: fullDepthInfo.boundsByDepth,
      edgeVbo: uploadVbo(fullEdgePack.edgeBuf),
      edgeDepthVbo: uploadVbo(fullEdgePack.edgeDepthArr),
      nodeVbo: uploadVbo(fullNodeBuf),
      nodeDepthVbo: uploadVbo(fullDepthInfo.nodeDepth),
    };

    const viewsCache = { full: fullView };

    function getOrBuildExistingView() {
      if (viewsCache.existing) return viewsCache.existing;
      if (!cMeta) return null;

      const cN = cMeta.node_count;
      const cM = cMeta.edge_count;
      const cNumLayers = cMeta.num_layers;
      const cLayerDy = cMeta.layer_dy;

      const fullToCollapsed = new Int32Array(N);
      fullToCollapsed.fill(-1);

      const cNodeLayer = new Uint16Array(cN);
      for (let ly = 0; ly < cNumLayers; ly++) {
        const a = cLayerOffsets[ly];
        const b = cLayerOffsets[ly + 1];
        for (let i = a; i < b; i++) {
          cNodeLayer[i] = ly;
        }
      }

      const cNodeGroup = new Uint8Array(cN);
      const cNodeInDeg = new Uint16Array(cN);
      const cNodeOutDeg = new Uint16Array(cN);
      const cNodeWeight = new Uint32Array(cN);
      for (let i = 0; i < cN; i++) {
        const fid = cNodeFullId[i];
        if (fid >= 0) {
          fullToCollapsed[fid] = i;
          cNodeGroup[i] = nodeGroup[fid];
          cNodeWeight[i] = 1;
        } else {
          const sIdx = -(fid + 1);
          cNodeGroup[i] = cSuperGroup[sIdx];
          cNodeWeight[i] = cSuperCounts[sIdx];
        }
      }

      const deadSet = new Set();
      for (let i = 0; i < deadEdgesRaw.length; i += 2) {
        deadSet.add(deadEdgesRaw[i] * 262144 + deadEdgesRaw[i + 1]);
      }

      // Decode supernode edges from cSuperEdgeStream
      const cSuperN = cMeta.super_edge_count;
      const supStart = new Uint32Array(cN);
      const supEnd = new Uint32Array(cN);
      const supTargets = new Uint32Array(cSuperN);
      const supWeights = new Uint16Array(cSuperN);
      let sp = 0;
      let sIdxWrite = 0;
      for (let cu = 0; cu < cN; cu++) {
        supStart[cu] = sIdxWrite;
        let deg = 0;
        let shift = 0;
        while (true) {
          const b = cSuperEdgeStream[sp++];
          deg |= (b & 0x7f) << shift;
          if ((b & 0x80) === 0) break;
          shift += 7;
        }
        let prevV = 0;
        for (let k = 0; k < deg; k++) {
          let delta = 0;
          shift = 0;
          while (true) {
            const b = cSuperEdgeStream[sp++];
            delta |= (b & 0x7f) << shift;
            if ((b & 0x80) === 0) break;
            shift += 7;
          }
          let w = 0;
          shift = 0;
          while (true) {
            const b = cSuperEdgeStream[sp++];
            w |= (b & 0x7f) << shift;
            if ((b & 0x80) === 0) break;
            shift += 7;
          }
          const cv = prevV + delta;
          prevV = cv;
          supTargets[sIdxWrite] = cv;
          supWeights[sIdxWrite] = w;
          sIdxWrite++;
        }
        supEnd[cu] = sIdxWrite;
      }

      const cEdgeOffsets = new Uint32Array(cN + 1);
      const cEdgeTargets = new Uint32Array(cM);
      const cEdgeWeights = new Uint16Array(cM);
      const cRevCounts = new Uint32Array(cN);
      const cBucketCounts = new Uint32Array(8);

      let ctIdx = 0;
      for (let cu = 0; cu < cN; cu++) {
        cEdgeOffsets[cu] = ctIdx;
        const fid = cNodeFullId[cu];
        if (fid >= 0) {
          const a = edgeOffsets[fid];
          const b = edgeOffsets[fid + 1];
          for (let k = a; k < b; k++) {
            const fv = edgeTargets[k];
            const cv = fullToCollapsed[fv];
            if (cv >= 0 && (deadSet.size === 0 || !deadSet.has(fid * 262144 + fv))) {
              cEdgeTargets[ctIdx] = cv;
              cEdgeWeights[ctIdx] = 1;
              ctIdx++;
              cRevCounts[cv]++;
              const bkt = ((Math.imul(cu, 2654435761) ^ Math.imul(cv, 2246822519)) >>> 29) & 7;
              cBucketCounts[bkt]++;
            }
          }
          const sa = supStart[cu];
          const sb = supEnd[cu];
          for (let s = sa; s < sb; s++) {
            const cv = supTargets[s];
            const w = supWeights[s];
            cEdgeTargets[ctIdx] = cv;
            cEdgeWeights[ctIdx] = w;
            ctIdx++;
            cRevCounts[cv]++;
            const bkt = ((Math.imul(cu, 2654435761) ^ Math.imul(cv, 2246822519)) >>> 29) & 7;
            cBucketCounts[bkt]++;
          }
        }
        cNodeOutDeg[cu] = Math.min(65535, ctIdx - cEdgeOffsets[cu]);
      }
      cEdgeOffsets[cN] = ctIdx;

      const cRevOffsets = new Uint32Array(cN + 1);
      let cRAcc = 0;
      for (let i = 0; i < cN; i++) {
        cNodeInDeg[i] = Math.min(65535, cRevCounts[i]);
        cRevOffsets[i] = cRAcc;
        cRAcc += cRevCounts[i];
      }
      cRevOffsets[cN] = cRAcc;
      const cRevSources = new Uint32Array(ctIdx);
      const cRevWeights = new Uint16Array(ctIdx);
      const cRevWrite = new Uint32Array(cRevOffsets);
      for (let cu = 0; cu < cN; cu++) {
        const a = cEdgeOffsets[cu];
        const b = cEdgeOffsets[cu + 1];
        for (let k = a; k < b; k++) {
          const cv = cEdgeTargets[k];
          const posW = cRevWrite[cv]++;
          cRevSources[posW] = cu;
          cRevWeights[posW] = cEdgeWeights[k];
        }
      }

      const cDepthInfo = computeRootDepths(
        cN, cNodeX, cNodeLayer, cNumLayers, cLayerDy, cNodeInDeg, cEdgeOffsets, cEdgeTargets, cMeta.bounds
      );
      const cLandmarks = buildLandmarkIds(cN, cNodeLayer, cNodeInDeg, cNodeFullId, cNodeWeight);
      const cHeavyEdgeList = buildHeavyEdgeList(
        cN, cEdgeOffsets, cEdgeTargets, cEdgeWeights, cEdgeWeights, null, cNodeFullId, 2500
      );
      const cEdgePack = createEdgeVboData(
        cN, ctIdx, cNodeX, cNodeLayer, cLayerDy, cNodeGroup, cEdgeOffsets, cEdgeTargets, cEdgeWeights, cBucketCounts, cNodeFullId, cDepthInfo.nodeDepth
      );
      const cNodeBuf = createNodeVboData(
        cN, cNodeX, cNodeLayer, cLayerDy, cNodeGroup, cNodeInDeg, cNodeFullId, cNodeWeight
      );

      viewsCache.existing = {
        key: "existing",
        isExisting: true,
        isHasse: false,
        isSimplified: false,
        nodeCount: cN,
        edgeCount: ctIdx,
        numLayers: cNumLayers,
        layerDy: cLayerDy,
        bounds: cMeta.bounds,
        layerOffsets: cLayerOffsets,
        nodeX: cNodeX,
        nodeLayer: cNodeLayer,
        nodeGroup: cNodeGroup,
        nodeInDeg: cNodeInDeg,
        nodeOutDeg: cNodeOutDeg,
        nodeFullId: cNodeFullId,
        nodeWeight: cNodeWeight,
        nodeMetaMap: null,
        edgeOffsets: cEdgeOffsets,
        edgeTargets: cEdgeTargets,
        edgeWeights: cEdgeWeights,
        edgeMults: cEdgeWeights,
        edgeChains: null,
        revOffsets: cRevOffsets,
        revSources: cRevSources,
        revWeights: cRevWeights,
        landmarkIds: cLandmarks,
        heavyEdgeList: cHeavyEdgeList,
        bucketEdgeEnd: cEdgePack.bucketEdgeEnd,
        nodeDepth: cDepthInfo.nodeDepth,
        maxDepth: cDepthInfo.maxDepth,
        nodesByDepth: cDepthInfo.nodesByDepth,
        edgesByDepth: cDepthInfo.edgesByDepth,
        layersByDepth: cDepthInfo.layersByDepth,
        boundsByDepth: cDepthInfo.boundsByDepth,
        edgeVbo: uploadVbo(cEdgePack.edgeBuf),
        edgeDepthVbo: uploadVbo(cEdgePack.edgeDepthArr),
        nodeVbo: uploadVbo(cNodeBuf),
        nodeDepthVbo: uploadVbo(cDepthInfo.nodeDepth),
      };
      return viewsCache.existing;
    }

    function buildHasseFilteredView(key, baseView, bitmask, targetEdgeCount) {
      if (viewsCache[key]) return viewsCache[key];
      if (!baseView || !bitmask) return null;

      const vN = baseView.nodeCount;
      const hEdgeOffsets = new Uint32Array(vN + 1);
      const hEdgeTargets = new Uint32Array(targetEdgeCount);
      const hEdgeWeights = baseView.edgeWeights ? new Uint16Array(targetEdgeCount) : null;
      const hEdgeMults = baseView.edgeMults ? new Uint16Array(targetEdgeCount) : null;
      const hEdgeChains = baseView.edgeChains ? new Uint16Array(targetEdgeCount) : null;
      const hNodeInDeg = new Uint16Array(vN);
      const hNodeOutDeg = new Uint16Array(vN);
      const hRevCounts = new Uint32Array(vN);
      const hBucketCounts = new Uint32Array(8);

      let htIdx = 0;
      for (let u = 0; u < vN; u++) {
        hEdgeOffsets[u] = htIdx;
        const a = baseView.edgeOffsets[u];
        const b = baseView.edgeOffsets[u + 1];
        for (let k = a; k < b; k++) {
          if (((bitmask[k >> 3] >> (k & 7)) & 1) === 0) continue;
          const v = baseView.edgeTargets[k];
          hEdgeTargets[htIdx] = v;
          if (hEdgeWeights) hEdgeWeights[htIdx] = baseView.edgeWeights[k];
          if (hEdgeMults) hEdgeMults[htIdx] = baseView.edgeMults[k];
          if (hEdgeChains) hEdgeChains[htIdx] = baseView.edgeChains[k];
          htIdx++;
          hRevCounts[v]++;
          const bkt = ((Math.imul(u, 2654435761) ^ Math.imul(v, 2246822519)) >>> 29) & 7;
          hBucketCounts[bkt]++;
        }
        hNodeOutDeg[u] = Math.min(65535, htIdx - hEdgeOffsets[u]);
      }
      hEdgeOffsets[vN] = htIdx;

      const hRevOffsets = new Uint32Array(vN + 1);
      let hRAcc = 0;
      for (let i = 0; i < vN; i++) {
        hNodeInDeg[i] = Math.min(65535, hRevCounts[i]);
        hRevOffsets[i] = hRAcc;
        hRAcc += hRevCounts[i];
      }
      hRevOffsets[vN] = hRAcc;
      const hRevSources = new Uint32Array(htIdx);
      const hRevWeights = hEdgeWeights ? new Uint16Array(htIdx) : null;
      const hRevWrite = new Uint32Array(hRevOffsets);
      for (let u = 0; u < vN; u++) {
        const a = hEdgeOffsets[u];
        const b = hEdgeOffsets[u + 1];
        for (let k = a; k < b; k++) {
          const v = hEdgeTargets[k];
          const posW = hRevWrite[v]++;
          hRevSources[posW] = u;
          if (hRevWeights) hRevWeights[posW] = hEdgeWeights[k];
        }
      }

      const hDepthInfo = computeRootDepths(
        vN, baseView.nodeX, baseView.nodeLayer, baseView.numLayers, baseView.layerDy,
        hNodeInDeg, hEdgeOffsets, hEdgeTargets, baseView.bounds
      );
      const hLandmarks = buildLandmarkIds(
        vN, baseView.nodeLayer, hNodeInDeg, baseView.nodeFullId, baseView.nodeWeight
      );
      const hHeavyEdgeList = buildHeavyEdgeList(
        vN, hEdgeOffsets, hEdgeTargets, hEdgeWeights, hEdgeMults, hEdgeChains, baseView.nodeFullId, 2500
      );
      const hEdgePack = createEdgeVboData(
        vN, htIdx, baseView.nodeX, baseView.nodeLayer, baseView.layerDy, baseView.nodeGroup,
        hEdgeOffsets, hEdgeTargets, hEdgeWeights, hBucketCounts, baseView.nodeFullId, hDepthInfo.nodeDepth
      );

      viewsCache[key] = {
        key: key,
        isExisting: baseView.isExisting,
        isHasse: true,
        isSimplified: false,
        nodeCount: vN,
        edgeCount: htIdx,
        numLayers: baseView.numLayers,
        layerDy: baseView.layerDy,
        bounds: baseView.bounds,
        layerOffsets: baseView.layerOffsets,
        nodeX: baseView.nodeX,
        nodeLayer: baseView.nodeLayer,
        nodeGroup: baseView.nodeGroup,
        nodeInDeg: hNodeInDeg,
        nodeOutDeg: hNodeOutDeg,
        nodeFullId: baseView.nodeFullId,
        nodeWeight: baseView.nodeWeight,
        nodeMetaMap: baseView.nodeMetaMap,
        edgeOffsets: hEdgeOffsets,
        edgeTargets: hEdgeTargets,
        edgeWeights: hEdgeWeights,
        edgeMults: hEdgeMults,
        edgeChains: hEdgeChains,
        revOffsets: hRevOffsets,
        revSources: hRevSources,
        revWeights: hRevWeights,
        landmarkIds: hLandmarks,
        heavyEdgeList: hHeavyEdgeList,
        bucketEdgeEnd: hEdgePack.bucketEdgeEnd,
        nodeDepth: hDepthInfo.nodeDepth,
        maxDepth: hDepthInfo.maxDepth,
        nodesByDepth: hDepthInfo.nodesByDepth,
        edgesByDepth: hDepthInfo.edgesByDepth,
        layersByDepth: hDepthInfo.layersByDepth,
        boundsByDepth: hDepthInfo.boundsByDepth,
        edgeVbo: uploadVbo(hEdgePack.edgeBuf),
        edgeDepthVbo: uploadVbo(hEdgePack.edgeDepthArr),
        nodeVbo: baseView.nodeVbo,
        nodeDepthVbo: uploadVbo(hDepthInfo.nodeDepth),
      };
      return viewsCache[key];
    }

    function getOrBuildSimplifiedView(key) {
      if (viewsCache[key]) return viewsCache[key];
      const desc = simpRaw[key];
      if (!desc) return null;

      const sm = desc.meta;
      const sN = sm.node_count;
      const sM = sm.edge_count;
      const sNumLayers = sm.num_layers;
      const sLayerDy = sm.layer_dy;
      const sLayerOffsets = desc.layerOffsets;
      const sNodeX = desc.nodeX;
      const sNodeFullId = desc.nodeFullId;

      const sNodeLayer = new Uint16Array(sN);
      for (let ly = 0; ly < sNumLayers; ly++) {
        const a = sLayerOffsets[ly];
        const b = sLayerOffsets[ly + 1];
        for (let i = a; i < b; i++) {
          sNodeLayer[i] = ly;
        }
      }

      const sNodeGroup = new Uint8Array(sN);
      const sNodeWeight = new Uint32Array(sN);
      for (let i = 0; i < sN; i++) {
        const fid = sNodeFullId[i];
        if (fid >= 0) {
          sNodeGroup[i] = nodeGroup[fid];
          sNodeWeight[i] = 1;
        } else {
          const sIdx = -(fid + 1);
          sNodeGroup[i] = cSuperGroup[sIdx];
          sNodeWeight[i] = cSuperCounts[sIdx];
        }
      }

      const sNodeMetaMap = new Map();
      for (let r = 0; r < desc.recCount; r++) {
        const off = desc.recsStart + r * 16;
        const nidW = view.getUint32(off, true);
        const wVal = view.getUint32(off + 4, true);
        const aL = view.getUint16(off + 8, true);
        const aC = view.getUint16(off + 10, true);
        const rFid = view.getInt32(off + 12, true);
        sNodeWeight[nidW] = wVal;
        sNodeMetaMap.set(nidW, { weight: wVal, leaves: aL, chains: aC, repFullId: rFid });
      }

      const stream = desc.edgeStream;
      let sp = 0;
      function readVarint() {
        let val = 0;
        let shift = 0;
        while (true) {
          const b = stream[sp++];
          val |= (b & 0x7f) << shift;
          if ((b & 0x80) === 0) return val;
          shift += 7;
        }
      }

      const sEdgeOffsets = new Uint32Array(sN + 1);
      const sEdgeTargets = new Uint32Array(sM);
      const sEdgeWeights = new Uint16Array(sM);
      const sEdgeMults = new Uint16Array(sM);
      const sEdgeChains = new Uint16Array(sM);
      const sNodeInDeg = new Uint16Array(sN);
      const sNodeOutDeg = new Uint16Array(sN);
      const sRevCounts = new Uint32Array(sN);
      const sBucketCounts = new Uint32Array(8);

      let stIdx = 0;
      for (let u = 0; u < sN; u++) {
        sEdgeOffsets[u] = stIdx;
        const deg = readVarint();
        let prevV = 0;
        for (let k = 0; k < deg; k++) {
          const code = readVarint();
          const delta = code >>> 1;
          const isW = code & 1;
          const v = prevV + delta;
          prevV = v;
          let mult = 1;
          let ch = 0;
          if (isW) {
            mult = readVarint();
            ch = readVarint();
          }
          sEdgeTargets[stIdx] = v;
          sEdgeMults[stIdx] = Math.min(65535, mult);
          sEdgeChains[stIdx] = Math.min(65535, ch);
          sEdgeWeights[stIdx] = Math.min(65535, mult + ch);
          stIdx++;
          sRevCounts[v]++;
          const bkt = ((Math.imul(u, 2654435761) ^ Math.imul(v, 2246822519)) >>> 29) & 7;
          sBucketCounts[bkt]++;
        }
        sNodeOutDeg[u] = Math.min(65535, stIdx - sEdgeOffsets[u]);
      }
      sEdgeOffsets[sN] = stIdx;

      const sRevOffsets = new Uint32Array(sN + 1);
      let sRAcc = 0;
      for (let i = 0; i < sN; i++) {
        sNodeInDeg[i] = Math.min(65535, sRevCounts[i]);
        sRevOffsets[i] = sRAcc;
        sRAcc += sRevCounts[i];
      }
      sRevOffsets[sN] = sRAcc;
      const sRevSources = new Uint32Array(stIdx);
      const sRevWeights = new Uint16Array(stIdx);
      const sRevWrite = new Uint32Array(sRevOffsets);
      for (let u = 0; u < sN; u++) {
        const a = sEdgeOffsets[u];
        const b = sEdgeOffsets[u + 1];
        for (let k = a; k < b; k++) {
          const v = sEdgeTargets[k];
          const posW = sRevWrite[v]++;
          sRevSources[posW] = u;
          sRevWeights[posW] = sEdgeWeights[k];
        }
      }

      const sDepthInfo = computeRootDepths(
        sN, sNodeX, sNodeLayer, sNumLayers, sLayerDy, sNodeInDeg, sEdgeOffsets, sEdgeTargets, sm.bounds
      );
      const sLandmarks = buildLandmarkIds(sN, sNodeLayer, sNodeInDeg, sNodeFullId, sNodeWeight);
      const sHeavyEdgeList = buildHeavyEdgeList(
        sN, sEdgeOffsets, sEdgeTargets, sEdgeWeights, sEdgeMults, sEdgeChains, sNodeFullId, 2500
      );
      const sEdgePack = createEdgeVboData(
        sN, stIdx, sNodeX, sNodeLayer, sLayerDy, sNodeGroup, sEdgeOffsets, sEdgeTargets, sEdgeWeights, sBucketCounts, sNodeFullId, sDepthInfo.nodeDepth
      );
      const sNodeBuf = createNodeVboData(
        sN, sNodeX, sNodeLayer, sLayerDy, sNodeGroup, sNodeInDeg, sNodeFullId, sNodeWeight
      );

      viewsCache[key] = {
        key: key,
        isExisting: key.startsWith("existing"),
        isHasse: key.indexOf("hasse") >= 0,
        isSimplified: true,
        nodeCount: sN,
        edgeCount: stIdx,
        numLayers: sNumLayers,
        layerDy: sLayerDy,
        bounds: sm.bounds,
        layerOffsets: sLayerOffsets,
        nodeX: sNodeX,
        nodeLayer: sNodeLayer,
        nodeGroup: sNodeGroup,
        nodeInDeg: sNodeInDeg,
        nodeOutDeg: sNodeOutDeg,
        nodeFullId: sNodeFullId,
        nodeWeight: sNodeWeight,
        nodeMetaMap: sNodeMetaMap,
        edgeOffsets: sEdgeOffsets,
        edgeTargets: sEdgeTargets,
        edgeWeights: sEdgeWeights,
        edgeMults: sEdgeMults,
        edgeChains: sEdgeChains,
        revOffsets: sRevOffsets,
        revSources: sRevSources,
        revWeights: sRevWeights,
        landmarkIds: sLandmarks,
        heavyEdgeList: sHeavyEdgeList,
        bucketEdgeEnd: sEdgePack.bucketEdgeEnd,
        nodeDepth: sDepthInfo.nodeDepth,
        maxDepth: sDepthInfo.maxDepth,
        nodesByDepth: sDepthInfo.nodesByDepth,
        edgesByDepth: sDepthInfo.edgesByDepth,
        layersByDepth: sDepthInfo.layersByDepth,
        boundsByDepth: sDepthInfo.boundsByDepth,
        edgeVbo: uploadVbo(sEdgePack.edgeBuf),
        edgeDepthVbo: uploadVbo(sEdgePack.edgeDepthArr),
        nodeVbo: uploadVbo(sNodeBuf),
        nodeDepthVbo: uploadVbo(sDepthInfo.nodeDepth),
      };
      return viewsCache[key];
    }

    function getViewKey(st) {
      if (!st.existing && !st.hasse && !st.simplify) return "full";
      if (!st.existing && st.hasse && !st.simplify) return "full_hasse";
      if (st.existing && !st.hasse && !st.simplify) return "existing";
      if (st.existing && st.hasse && !st.simplify) return "existing_hasse";
      if (!st.existing && !st.hasse && st.simplify) return "full_simp";
      if (!st.existing && st.hasse && st.simplify) return "full_hasse_simp";
      if (st.existing && !st.hasse && st.simplify) return "existing_simp";
      return "existing_hasse_simp";
    }

    function getViewForState(st) {
      const key = getViewKey(st);
      if (viewsCache[key]) return viewsCache[key];
      if (key === "full_hasse") {
        return buildHasseFilteredView("full_hasse", fullView, fullHasseMask, fullHasseMeta.edge_count);
      }
      if (key === "existing") {
        return getOrBuildExistingView();
      }
      if (key === "existing_hasse") {
        const baseE = getOrBuildExistingView();
        return buildHasseFilteredView("existing_hasse", baseE, existingHasseMask, existingHasseMeta.edge_count);
      }
      return getOrBuildSimplifiedView(key);
    }

    const viewState = { existing: false, hasse: false, simplify: false };
    let activeView = fullView;
    let maxDepthLimit = null; // null = All (unbounded)

    function getEffectiveMaxDepth(av) {
      const v = av || activeView;
      if (maxDepthLimit === null) return v.maxDepth;
      return Math.max(0, Math.min(v.maxDepth, maxDepthLimit));
    }

    // Viewport state
    let cssW = window.innerWidth || 1280;
    let cssH = window.innerHeight || 720;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let zoom = 1.0;
    let panX = 0.0;
    let panY = 0.0;
    let fitZoom = 0.35;

    function computeFitTransform() {
      const curD = getEffectiveMaxDepth(activeView);
      const b = (activeView.boundsByDepth && activeView.boundsByDepth[curD]) || activeView.bounds;
      const worldW = Math.max(20, b.xmax - b.xmin);
      const worldH = Math.max(20, b.ymax - b.ymin);
      const padX = Math.max(40, cssW * 0.04);
      const padY = Math.max(44, cssH * 0.055);
      const z = Math.min((cssW - 2 * padX) / worldW, (cssH - 2 * padY) / worldH);
      fitZoom = Math.max(0.05, Math.min(48.0, z));
      const cx = 0.5 * (b.xmin + b.xmax);
      const cy = 0.5 * (b.ymin + b.ymax);
      return {
        zoom: fitZoom,
        panX: cssW * 0.5 - cx * fitZoom,
        panY: cssH * 0.5 - cy * fitZoom,
      };
    }

    function fitToView() {
      const t = computeFitTransform();
      zoom = t.zoom;
      panX = t.panX;
      panY = t.panY;
    }

    function resizeCanvases(preserveCenter) {
      const prevW = cssW;
      const prevH = cssH;
      const worldCx = (prevW * 0.5 - panX) / zoom;
      const worldCy = (prevH * 0.5 - panY) / zoom;

      cssW = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1280);
      cssH = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 720);
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      const pixW = Math.max(1, Math.round(cssW * dpr));
      const pixH = Math.max(1, Math.round(cssH * dpr));

      glCanvas.width = pixW;
      glCanvas.height = pixH;
      ovCanvas.width = pixW;
      ovCanvas.height = pixH;
      if (gl) {
        gl.viewport(0, 0, pixW, pixH);
      }

      if (preserveCenter) {
        const t = computeFitTransform();
        fitZoom = t.zoom;
        panX = cssW * 0.5 - worldCx * zoom;
        panY = cssH * 0.5 - worldCy * zoom;
      } else {
        fitToView();
      }
    }

    // Adaptive rendering & LOD state
    let rafPending = false;
    let isInteracting = false;
    let idleTimer = 0;
    let lastFullDrawMs = 0;

    function nodeRadiusCss(av, idx) {
      const fid = av.nodeFullId ? av.nodeFullId[idx] : idx;
      let weight;
      let isSuper = false;
      let isAnchor = false;
      if (fid < 0) {
        const sCnt = cSuperCounts[-(fid + 1)];
        weight = 1.7 + 0.52 * Math.log1p(sCnt);
        isSuper = true;
      } else {
        const inD = av.nodeInDeg[idx];
        const baseW = inD === 0 ? 2.4 : (1.0 + 0.32 * Math.log1p(inD));
        const nw = av.nodeWeight ? av.nodeWeight[idx] : 1;
        if (nw > 1) {
          weight = baseW + 0.55 * Math.log1p(nw - 1);
          isAnchor = true;
        } else {
          weight = baseW;
        }
      }
      let sz = (1.25 + 0.55 * weight) * (0.72 + 0.38 * Math.sqrt(Math.max(zoom, 0.05)));
      if (zoom >= 4.0) {
        sz = Math.min(sz, (isSuper ? 0.85 : 0.76) * zoom);
      }
      sz = Math.max(isSuper ? 2.2 : (isAnchor ? 1.9 : 1.5), Math.min(maxPointSize / dpr, sz));
      return 0.5 * sz;
    }

    function reserveUiRects(placed) {
      const pad = 6;
      const els = [navPill, collapsePill, depthPill, statsPill, legendPill, zoomPill];
      for (let i = 0; i < els.length; i++) {
        const el = els[i];
        if (!el) continue;
        const r = el.getBoundingClientRect();
        if (r.width > 0 && r.height > 0) {
          placed.push([r.left - pad, r.top - pad, r.right + pad, r.bottom + pad]);
        }
      }
    }

    function drawOverlay() {
      const av = activeView;
      const curMaxDepth = getEffectiveMaxDepth(av);
      const depthFiltered = curMaxDepth < av.maxDepth;
      const nDepth = av.nodeDepth;
      ovCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ovCtx.clearRect(0, 0, cssW, cssH);

      const wxMin = -panX / zoom;
      const wxMax = (cssW - panX) / zoom;
      const wyMin = -panY / zoom;
      const wyMax = (cssH - panY) / zoom;

      const marginWorldX = 16 / zoom;
      const marginWorldY = 16 / zoom;

      const minLy = Math.max(0, Math.floor((wyMin - marginWorldY) / av.layerDy));
      const maxLy = Math.min(av.numLayers - 1, Math.ceil((wyMax + marginWorldY) / av.layerDy));

      const slices = [];
      let visibleCount = 0;
      for (let ly = minLy; ly <= maxLy; ly++) {
        const lStart = av.layerOffsets[ly];
        const lEnd = av.layerOffsets[ly + 1];
        if (lStart >= lEnd) continue;
        const a = lowerBound(av.nodeX, lStart, lEnd, wxMin - marginWorldX);
        const b = upperBound(av.nodeX, a, lEnd, wxMax + marginWorldX);
        if (a < b) {
          slices.push(a, b);
          if (!depthFiltered) {
            visibleCount += (b - a);
          } else {
            for (let i = a; i < b; i++) {
              if (nDepth[i] <= curMaxDepth) visibleCount++;
            }
          }
        }
      }

      const placed = [];
      reserveUiRects(placed);

      // Post-collapse variable-thickness weighted edges overlay (existing-theory and/or chain-collapsed views)
      if (av.edgeWeights !== null || (av.heavyEdgeList && av.heavyEdgeList.length > 0)) {
        const nX = av.nodeX;
        const nL = av.nodeLayer;
        const lDy = av.layerDy;
        const zoomRatio = zoom / fitZoom;
        const wBadges = [];
        const strokes = [];

        if (visibleCount > 1200) {
          const wList = av.heavyEdgeList;
          if (wList) {
            for (let i = 0; i < wList.length; i += 4) {
              const cu = wList[i];
              const cv = wList[i + 1];
              if (depthFiltered && (nDepth[cu] > curMaxDepth || nDepth[cv] > curMaxDepth)) continue;
              const mult = wList[i + 2];
              const ch = wList[i + 3];
              strokes.push(cu, cv, mult, ch);
            }
          }
        } else if (visibleCount > 0 && av.edgeWeights !== null) {
          const seenE = new Set();
          const candU = [];
          const candV = [];
          const candM = [];
          const candC = [];
          const candW = [];
          function addEdgeCand(cu, cv, mult, ch, w) {
            if (depthFiltered && (nDepth[cu] > curMaxDepth || nDepth[cv] > curMaxDepth)) return;
            const isLargeSuper =
              av.nodeFullId !== null &&
              av.nodeFullId[cv] < 0 &&
              cSuperCounts[-(av.nodeFullId[cv] + 1)] >= 400;
            if (w < 2 && !isLargeSuper) return;
            const key = cu * 262144 + cv;
            if (seenE.has(key)) return;
            seenE.add(key);
            candU.push(cu);
            candV.push(cv);
            candM.push(mult);
            candC.push(ch);
            candW.push(w);
          }
          for (let s = 0; s < slices.length; s += 2) {
            const a = slices[s];
            const b = slices[s + 1];
            for (let u = a; u < b; u++) {
              if (depthFiltered && nDepth[u] > curMaxDepth) continue;
              const ea = av.edgeOffsets[u];
              const eb = av.edgeOffsets[u + 1];
              for (let k = ea; k < eb; k++) {
                const v = av.edgeTargets[k];
                const w = av.edgeWeights[k];
                const mult = av.edgeMults ? av.edgeMults[k] : w;
                const ch = av.edgeChains ? av.edgeChains[k] : 0;
                addEdgeCand(u, v, mult, ch, w);
              }
              const ra = av.revOffsets[u];
              const rb = av.revOffsets[u + 1];
              const rLim = Math.min(rb, ra + 48);
              for (let k = ra; k < rLim; k++) {
                const p = av.revSources[k];
                const w = av.revWeights ? av.revWeights[k] : 1;
                if (w < 2 && !(av.nodeFullId && av.nodeFullId[u] < 0 && cSuperCounts[-(av.nodeFullId[u] + 1)] >= 400)) {
                  continue;
                }
                // Lookup exact mult/ch when needed only if edgeChains present; else mult=w, ch=0
                let mult = w;
                let ch = 0;
                if (av.edgeChains) {
                  const pa = av.edgeOffsets[p];
                  const pb = av.edgeOffsets[p + 1];
                  for (let pk = pa; pk < pb; pk++) {
                    if (av.edgeTargets[pk] === u) {
                      mult = av.edgeMults[pk];
                      ch = av.edgeChains[pk];
                      break;
                    }
                  }
                }
                addEdgeCand(p, u, mult, ch, w);
              }
            }
          }
          if (candU.length <= 1500) {
            for (let i = 0; i < candU.length; i++) {
              strokes.push(candU[i], candV[i], candM[i], candC[i]);
            }
          } else {
            const idxs = new Uint32Array(candU.length);
            for (let i = 0; i < candU.length; i++) idxs[i] = i;
            idxs.sort((ia, ib) => candW[ib] - candW[ia]);
            for (let i = 0; i < 1500; i++) {
              const idx = idxs[i];
              strokes.push(candU[idx], candV[idx], candM[idx], candC[idx]);
            }
          }
        }

        if (strokes.length > 0) {
          ovCtx.save();
          ovCtx.lineCap = "round";
          for (let i = 0; i < strokes.length; i += 4) {
            const cu = strokes[i];
            const cv = strokes[i + 1];
            const mult = strokes[i + 2];
            const ch = strokes[i + 3];
            const w = mult + ch;
            const ux = nX[cu];
            const uy = nL[cu] * lDy;
            const vx = nX[cv];
            const vy = nL[cv] * lDy;
            if ((ux < wxMin && vx < wxMin) || (ux > wxMax && vx > wxMax)) continue;
            if ((uy < wyMin && vy < wyMin) || (uy > wyMax && vy > wyMax)) continue;

            const sx0 = ux * zoom + panX;
            const sy0 = uy * zoom + panY;
            const sx1 = vx * zoom + panX;
            const sy1 = vy * zoom + panY;

            const lw = w >= 2
              ? Math.min(5.2, 1.25 + 0.78 * Math.log2(w))
              : Math.min(2.4, 0.9 + 0.25 * Math.log10(Math.max(10, cSuperCounts[-(av.nodeFullId[cv] + 1)])));
            const alpha = w >= 2
              ? Math.min(0.75, 0.24 + 0.14 * Math.sqrt(zoomRatio))
              : Math.min(0.45, 0.10 + 0.08 * Math.sqrt(zoomRatio));

            ovCtx.strokeStyle = groupCss[av.nodeGroup[cv]];
            ovCtx.globalAlpha = alpha;
            ovCtx.lineWidth = lw;
            ovCtx.beginPath();
            ovCtx.moveTo(sx0, sy0);
            ovCtx.lineTo(sx1, sy1);
            ovCtx.stroke();

            if (w >= 2 && visibleCount <= 550 && zoom >= 6) {
              wBadges.push({ sx0, sy0, sx1, sy1, w, mult, ch, col: groupCss[av.nodeGroup[cv]] });
            }
          }
          ovCtx.restore();
        }

        if (wBadges.length > 0) {
          wBadges.sort((a, b) => b.w - a.w);
          ovCtx.save();
          ovCtx.font = "600 9.5px ui-monospace, SFMono-Regular, Menlo, monospace";
          ovCtx.textAlign = "center";
          ovCtx.textBaseline = "middle";
          const maxBadges = 40;
          let drawnBadges = 0;
          for (let i = 0; i < wBadges.length && drawnBadges < maxBadges; i++) {
            const b = wBadges[i];
            const mx = b.sx0 * 0.38 + b.sx1 * 0.62;
            const my = b.sy0 * 0.38 + b.sy1 * 0.62;
            if (mx < 16 || mx > cssW - 16 || my < 16 || my > cssH - 16) continue;
            let txt;
            if (b.ch > 0 && b.mult > 1) txt = "\u00d7" + b.mult + " +" + b.ch;
            else if (b.ch > 0) txt = "+" + b.ch;
            else txt = "\u00d7" + b.mult;
            const bw = ovCtx.measureText(txt).width + 6;
            const bh = 13;
            const x0 = mx - bw * 0.5;
            const y0 = my - bh * 0.5;
            const x1 = x0 + bw;
            const y1 = y0 + bh;
            let clash = false;
            for (let j = 0; j < placed.length; j++) {
              const p = placed[j];
              if (x0 < p[2] && x1 > p[0] && y0 < p[3] && y1 > p[1]) {
                clash = true;
                break;
              }
            }
            if (clash) continue;
            placed.push([x0, y0, x1, y1]);
            drawnBadges++;
            ovCtx.fillStyle = "rgba(255, 255, 255, 0.92)";
            ovCtx.strokeStyle = b.col;
            ovCtx.lineWidth = 1;
            ovCtx.fillRect(x0, y0, bw, bh);
            ovCtx.strokeRect(x0, y0, bw, bh);
            ovCtx.fillStyle = "#0f172a";
            ovCtx.fillText(txt, mx, my + 0.5);
          }
          ovCtx.restore();
        }
      }

      // Deep-zoom directional arrowheads
      if (visibleCount > 0 && visibleCount <= 300 && zoom >= 12) {
        ovCtx.save();
        ovCtx.fillStyle = "rgba(51, 65, 85, 0.78)";
        let drawnArrows = 0;
        const maxArrows = 2000;
        const baseArrowLen = Math.min(9.5, Math.max(4.5, 4.0 + 0.08 * zoom));

        for (let s = 0; s < slices.length && drawnArrows < maxArrows; s += 2) {
          const a = slices[s];
          const b = slices[s + 1];
          for (let v = a; v < b && drawnArrows < maxArrows; v++) {
            if (depthFiltered && nDepth[v] > curMaxDepth) continue;
            const vx = av.nodeX[v] * zoom + panX;
            const vy = av.nodeLayer[v] * av.layerDy * zoom + panY;
            const padR = nodeRadiusCss(av, v) + 2.0;
            const rA = av.revOffsets[v];
            const rB = av.revOffsets[v + 1];
            const rLim = Math.min(rB, rA + 24);
            for (let k = rA; k < rLim && drawnArrows < maxArrows; k++) {
              const u = av.revSources[k];
              if (depthFiltered && nDepth[u] > curMaxDepth) continue;
              const w = av.revWeights ? av.revWeights[k] : 1;
              const arrowLen = w >= 2 ? Math.min(13.0, baseArrowLen + 1.1 * Math.log2(w)) : baseArrowLen;
              const arrowHalfW = arrowLen * 0.44;
              const ux = av.nodeX[u] * zoom + panX;
              const uy = av.nodeLayer[u] * av.layerDy * zoom + panY;
              const dx = vx - ux;
              const dy = vy - uy;
              const dist = Math.hypot(dx, dy);
              if (dist <= padR + arrowLen + 1.0) continue;
              const inv = 1.0 / dist;
              const nx = dx * inv;
              const ny = dy * inv;
              const tipX = vx - nx * padR;
              const tipY = vy - ny * padR;
              const baseX = tipX - nx * arrowLen;
              const baseY = tipY - ny * arrowLen;
              const px = -ny * arrowHalfW;
              const py = nx * arrowHalfW;
              ovCtx.beginPath();
              ovCtx.moveTo(tipX, tipY);
              ovCtx.lineTo(baseX + px, baseY + py);
              ovCtx.lineTo(baseX - px, baseY - py);
              ovCtx.closePath();
              ovCtx.fill();
              drawnArrows++;
            }
          }
        }
        ovCtx.restore();
      }

      // Progressive collision-free node labels
      let candidates = null;
      if (visibleCount > 1200) {
        candidates = [];
        for (let i = 0; i < av.landmarkIds.length; i++) {
          const id = av.landmarkIds[i];
          if (depthFiltered && nDepth[id] > curMaxDepth) continue;
          const wx = av.nodeX[id];
          const wy = av.nodeLayer[id] * av.layerDy;
          if (wx >= wxMin && wx <= wxMax && wy >= wyMin && wy <= wyMax) {
            candidates.push(id);
          }
        }
      } else if (visibleCount > 0) {
        candidates = [];
        for (let s = 0; s < slices.length; s += 2) {
          const a = slices[s];
          const b = slices[s + 1];
          for (let i = a; i < b; i++) {
            if (depthFiltered && nDepth[i] > curMaxDepth) continue;
            candidates.push(i);
          }
        }
        candidates.sort((a, b) => {
          const fa = av.nodeFullId ? av.nodeFullId[a] : a;
          const fb = av.nodeFullId ? av.nodeFullId[b] : b;
          const na = av.nodeWeight ? av.nodeWeight[a] : 1;
          const nb = av.nodeWeight ? av.nodeWeight[b] : 1;
          const pa = fa < 0
            ? (1e8 + cSuperCounts[-(fa + 1)] * 1000)
            : (av.nodeInDeg[a] === 0 ? 1e9 : (av.nodeInDeg[a] * 10 + av.nodeOutDeg[a] + (na > 1 ? na * 120 : 0)));
          const pb = fb < 0
            ? (1e8 + cSuperCounts[-(fb + 1)] * 1000)
            : (av.nodeInDeg[b] === 0 ? 1e9 : (av.nodeInDeg[b] * 10 + av.nodeOutDeg[b] + (nb > 1 ? nb * 120 : 0)));
          if (pa !== pb) return pb - pa;
          return a - b;
        });
      }

      if (!candidates || candidates.length === 0) return;

      const showDir = zoom >= 55;
      const fontSize = zoom >= 30 ? 12 : 11;
      ovCtx.save();
      ovCtx.textBaseline = "middle";
      ovCtx.textAlign = "left";
      ovCtx.lineJoin = "round";
      ovCtx.lineWidth = 3.5;

      let labelCount = 0;
      const maxLabels = zoom < fitZoom * 1.6 ? 22 : (zoom < fitZoom * 6.0 ? 50 : 90);

      for (let i = 0; i < candidates.length && labelCount < maxLabels; i++) {
        const id = candidates[i];
        const sx = av.nodeX[id] * zoom + panX;
        const sy = av.nodeLayer[id] * av.layerDy * zoom + panY;
        if (sx < -20 || sx > cssW + 20 || sy < -20 || sy > cssH + 20) continue;

        const fid = av.nodeFullId ? av.nodeFullId[id] : id;
        const isSuper = fid < 0;
        let label = "";
        let countSuffix = "";
        let subLabel = "";

        if (isSuper) {
          const sIdx = -(fid + 1);
          const rawTitle = cSuperTitles[sIdx] || "Published Theorem";
          label = rawTitle.length > 42 ? rawTitle.slice(0, 40) + "…" : rawTitle;
          countSuffix = " [" + cSuperCounts[sIdx].toLocaleString() + "]";
          if (showDir) {
            const fCnt = cSuperFrontierCounts[sIdx];
            subLabel = "Existing theory · " + fCnt + (fCnt === 1 ? " proof root" : " proof roots");
          }
        } else {
          label = shortNames[fid];
          if (!label) continue;
          const nw = av.nodeWeight ? av.nodeWeight[id] : 1;
          const dl = dirList[nodeDirId[fid]] || "";
          if (nw > 1) {
            countSuffix = " [" + nw.toLocaleString() + "]";
            if (showDir) {
              const meta = av.nodeMetaMap ? av.nodeMetaMap.get(id) : null;
              const k = nw - 1;
              let absTxt;
              if (k === 1 && meta && meta.repFullId >= 0 && shortNames[meta.repFullId]) {
                absTxt = "+1 leaf (" + shortNames[meta.repFullId] + ")";
              } else if (meta && meta.chains > 0) {
                absTxt = "+" + k.toLocaleString() + " collapsed (" + meta.leaves.toLocaleString() + " leaves, " + meta.chains.toLocaleString() + " chain)";
              } else {
                absTxt = "+" + k.toLocaleString() + " " + (k === 1 ? "leaf" : "leaves");
              }
              subLabel = dl && dl !== "(root)" ? absTxt + " · " + dl : absTxt;
            }
          } else if (showDir && dl && dl !== "(root)") {
            subLabel = dl;
          }
        }

        const rPx = nodeRadiusCss(av, id);
        const tx = sx + rPx + 4;
        const ty = sy;

        ovCtx.font = `600 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        const lw = ovCtx.measureText(label).width;
        let cw = 0;
        if (countSuffix) {
          ovCtx.font = `700 ${fontSize}px ui-monospace, SFMono-Regular, Menlo, monospace`;
          cw = ovCtx.measureText(countSuffix).width;
          ovCtx.font = `600 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        }
        let boxW = lw + cw;
        const boxH = subLabel ? 26 : 14;

        if (subLabel) {
          ovCtx.font = `400 10px ui-monospace, SFMono-Regular, Menlo, monospace`;
          const dw = ovCtx.measureText(subLabel).width;
          if (dw > boxW) boxW = dw;
          ovCtx.font = `600 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        }

        const x0 = tx - 3;
        const y0 = ty - 7;
        const x1 = tx + boxW + 5;
        const y1 = y0 + boxH;
        if (x0 < 4 || x1 > cssW - 4 || y0 < 4 || y1 > cssH - 4) continue;

        let overlaps = false;
        for (let j = 0; j < placed.length; j++) {
          const p = placed[j];
          if (x0 < p[2] && x1 > p[0] && y0 < p[3] && y1 > p[1]) {
            overlaps = true;
            break;
          }
        }
        if (overlaps) continue;

        placed.push([x0, y0, x1, y1]);
        labelCount++;

        ovCtx.strokeStyle = "rgba(255, 255, 255, 0.94)";
        ovCtx.fillStyle = isSuper ? "#0f172a" : "#111827";
        ovCtx.strokeText(label, tx, ty);
        ovCtx.fillText(label, tx, ty);

        if (countSuffix) {
          ovCtx.font = `700 ${fontSize}px ui-monospace, SFMono-Regular, Menlo, monospace`;
          ovCtx.fillStyle = groupCss[av.nodeGroup[id]];
          ovCtx.strokeText(countSuffix, tx + lw, ty);
          ovCtx.fillText(countSuffix, tx + lw, ty);
        }

        if (subLabel) {
          ovCtx.font = `400 10px ui-monospace, SFMono-Regular, Menlo, monospace`;
          ovCtx.fillStyle = "#64748b";
          ovCtx.strokeText(subLabel, tx, ty + 12);
          ovCtx.fillText(subLabel, tx, ty + 12);
        }
      }
      ovCtx.restore();
    }

    function drawFallback2D() {
      const av = activeView;
      const curMaxDepth = getEffectiveMaxDepth(av);
      const nDepth = av.nodeDepth;
      const ctx = glCanvas.getContext("2d");
      if (!ctx) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, cssW, cssH);

      const wxMin = -panX / zoom;
      const wxMax = (cssW - panX) / zoom;
      const wyMin = -panY / zoom;
      const wyMax = (cssH - panY) / zoom;

      const baseAlpha = Math.max(0.03, Math.min(0.55, 0.036 * Math.pow(zoom / fitZoom, 0.55)));
      for (let u = 0; u < av.nodeCount; u++) {
        if (nDepth[u] > curMaxDepth) continue;
        const ux = av.nodeX[u];
        const uy = av.nodeLayer[u] * av.layerDy;
        const sx0 = ux * zoom + panX;
        const sy0 = uy * zoom + panY;
        const a = av.edgeOffsets[u];
        const b = av.edgeOffsets[u + 1];
        for (let k = a; k < b; k++) {
          const v = av.edgeTargets[k];
          if (nDepth[v] > curMaxDepth) continue;
          const vx = av.nodeX[v];
          const vy = av.nodeLayer[v] * av.layerDy;
          if ((ux < wxMin && vx < wxMin) || (ux > wxMax && vx > wxMax)) continue;
          if ((uy < wyMin && vy < wyMin) || (uy > wyMax && vy > wyMax)) continue;
          const w = av.edgeWeights ? av.edgeWeights[k] : 1;
          ctx.strokeStyle = groupCss[av.nodeGroup[w >= 2 ? v : u]];
          ctx.globalAlpha = w >= 2 ? Math.min(0.75, baseAlpha * 3.0) : baseAlpha;
          ctx.lineWidth = w >= 2 ? Math.min(4.5, 1.1 + 0.7 * Math.log2(w)) : 1;
          ctx.beginPath();
          ctx.moveTo(sx0, sy0);
          ctx.lineTo(vx * zoom + panX, vy * zoom + panY);
          ctx.stroke();
        }
      }
      ctx.globalAlpha = 1.0;
      for (let i = 0; i < av.nodeCount; i++) {
        if (nDepth[i] > curMaxDepth) continue;
        const sx = av.nodeX[i] * zoom + panX;
        const sy = av.nodeLayer[i] * av.layerDy * zoom + panY;
        if (sx < -8 || sx > cssW + 8 || sy < -8 || sy > cssH + 8) continue;
        const r = nodeRadiusCss(av, i);
        const fid = av.nodeFullId ? av.nodeFullId[i] : i;
        ctx.fillStyle = groupCss[av.nodeGroup[i]];
        if (fid < 0) {
          ctx.beginPath();
          ctx.moveTo(sx, sy - r * 1.15);
          ctx.lineTo(sx + r * 1.15, sy);
          ctx.lineTo(sx, sy + r * 1.15);
          ctx.lineTo(sx - r * 1.15, sy);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(sx, sy, r, 0, Math.PI * 2);
          ctx.fill();
          if (av.nodeWeight && av.nodeWeight[i] > 1 && r >= 2.2) {
            ctx.save();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
            ctx.lineWidth = Math.max(1, r * 0.28);
            ctx.beginPath();
            ctx.arc(sx, sy, r * 0.55, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }
        }
      }
      drawOverlay();
    }

    function renderFrame() {
      rafPending = false;
      const av = activeView;

      if (!gl) {
        drawFallback2D();
        return;
      }

      const t0 = performance.now();
      gl.clearColor(1.0, 1.0, 1.0, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

      const scaleX = (2.0 * zoom) / cssW;
      const scaleY = (-2.0 * zoom) / cssH;
      const offX = (2.0 * panX) / cssW - 1.0;
      const offY = 1.0 - (2.0 * panY) / cssH;

      const baseAlpha = Math.max(0.020, Math.min(0.60, 0.024 * Math.pow(zoom / fitZoom, 0.62)));

      // Determine how many stratified edge buckets to draw
      let useBuckets = 8;
      if (isInteracting && lastFullDrawMs > 20) {
        useBuckets = lastFullDrawMs > 60 ? 2 : 4;
      }
      const drawVerts = av.bucketEdgeEnd[useBuckets - 1] * 2;
      const edgeAlpha = useBuckets === 8 ? baseAlpha : Math.min(0.85, baseAlpha * (8.0 / useBuckets));

      const curMaxDepth = getEffectiveMaxDepth(av);

      // Pass 1: Edges
      gl.useProgram(edgeProg);
      if (
        nodeLocs.a_weight >= 0 &&
        nodeLocs.a_weight !== edgeLocs.a_pos &&
        nodeLocs.a_weight !== edgeLocs.a_color &&
        nodeLocs.a_weight !== edgeLocs.a_depth
      ) {
        gl.disableVertexAttribArray(nodeLocs.a_weight);
      }
      gl.bindBuffer(gl.ARRAY_BUFFER, av.edgeVbo);
      gl.enableVertexAttribArray(edgeLocs.a_pos);
      gl.vertexAttribPointer(edgeLocs.a_pos, 2, gl.FLOAT, false, 12, 0);
      gl.enableVertexAttribArray(edgeLocs.a_color);
      gl.vertexAttribPointer(edgeLocs.a_color, 4, gl.UNSIGNED_BYTE, true, 12, 8);
      if (edgeLocs.a_depth >= 0) {
        gl.bindBuffer(gl.ARRAY_BUFFER, av.edgeDepthVbo);
        gl.enableVertexAttribArray(edgeLocs.a_depth);
        gl.vertexAttribPointer(edgeLocs.a_depth, 1, gl.UNSIGNED_SHORT, false, 2, 0);
      }

      gl.uniform2f(edgeLocs.u_scale, scaleX, scaleY);
      gl.uniform2f(edgeLocs.u_offset, offX, offY);
      gl.uniform1f(edgeLocs.u_alpha, edgeAlpha);
      gl.uniform1f(edgeLocs.u_maxDepth, curMaxDepth + 0.5);
      gl.drawArrays(gl.LINES, 0, drawVerts);

      // Pass 2: Nodes (always 100% up to curMaxDepth)
      gl.useProgram(nodeProg);
      gl.bindBuffer(gl.ARRAY_BUFFER, av.nodeVbo);
      gl.enableVertexAttribArray(nodeLocs.a_pos);
      gl.vertexAttribPointer(nodeLocs.a_pos, 2, gl.FLOAT, false, 16, 0);
      gl.enableVertexAttribArray(nodeLocs.a_weight);
      gl.vertexAttribPointer(nodeLocs.a_weight, 1, gl.FLOAT, false, 16, 8);
      gl.enableVertexAttribArray(nodeLocs.a_color);
      gl.vertexAttribPointer(nodeLocs.a_color, 4, gl.UNSIGNED_BYTE, true, 16, 12);
      if (nodeLocs.a_depth >= 0) {
        gl.bindBuffer(gl.ARRAY_BUFFER, av.nodeDepthVbo);
        gl.enableVertexAttribArray(nodeLocs.a_depth);
        gl.vertexAttribPointer(nodeLocs.a_depth, 1, gl.UNSIGNED_SHORT, false, 2, 0);
      }

      gl.uniform2f(nodeLocs.u_scale, scaleX, scaleY);
      gl.uniform2f(nodeLocs.u_offset, offX, offY);
      gl.uniform1f(nodeLocs.u_zoom, zoom);
      gl.uniform1f(nodeLocs.u_dpr, dpr);
      gl.uniform1f(nodeLocs.u_maxPointSize, maxPointSize);
