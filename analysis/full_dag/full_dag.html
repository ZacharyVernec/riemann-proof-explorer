<style>

    --bg: #ffffff;
    --text: #111111;
    --muted: #555555;
    --border: #cccccc;

    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-user-select: none;
    user-select: none;
  }
  #gl-canvas, #overlay-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #gl-canvas {
    cursor: grab;
    touch-action: none;
    z-index: 1;
    visibility: hidden;
  }
  #gl-canvas.grabbing {
    cursor: grabbing;
  }
  #overlay-canvas {
    pointer-events: none;
    z-index: 2;
  }
  .nav-pill {
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 10;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px;
    background: var(--pill-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 12.5px;
    line-height: 1.2;
    backdrop-filter: blur(4px);
  }
  .nav-pill a {
    color: #0056b3;
    text-decoration: none;
    font-weight: 500;
  }
  .nav-pill a:hover {
    text-decoration: underline;
  }
  .nav-sep {
    color: #999999;
  }
  .collapse-pill {
    position: fixed;
    top: 12px;
    right: 14px;
    z-index: 10;
    display: none;
    align-items: center;
    background: var(--pill-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    backdrop-filter: blur(4px);
  }
  .collapse-pill.visible {
    display: inline-flex;
  }
  .collapse-pill button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text);
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.2;
    padding: 6px 10px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .collapse-pill button:hover {
    background: var(--btn-hover);
  }
  .collapse-pill button[aria-pressed="true"] {
    background: #1e293b;
    color: #ffffff;
  }
  .collapse-pill button[aria-pressed="true"]:hover {
    background: #0f172a;

  .collapse-dot {
    width: 7px;

  .zoom-pill {
    position: fixed;
    right: 14px;

    background: var(--pill-bg);
    border: 1px solid var(--border);
    border-radius: 4px;

    background: transparent;

  .zoom-pill button:hover {

  .zoom-pill button:active {

  .legend-pill {
    position: fixed;
    left: 12px;

  .legend-list {

<script>
(function () {
  "use strict";

  const glCanvas = document.getElementById("gl-canvas");
  const ovCanvas = document.getElementById("overlay-canvas");
  const ovCtx = ovCanvas.getContext("2d");
  const loadingEl = document.getElementById("loading");
  const navPill = document.querySelector(".nav-pill");
  const collapsePill = document.getElementById("collapse-pill");
  const btnCollapse = document.getElementById("btn-collapse-existing");
  const collapseStatsEl = document.getElementById("collapse-stats");
  const legendPill = document.getElementById("legend-pill");
  const btnLegendToggle = document.getElementById("btn-legend-toggle");
  const legendToggleIcon = document.getElementById("legend-toggle-icon");
  const legendListEl = document.getElementById("legend-list");
  const legendSuperNote = document.getElementById("legend-super-note");
  const zoomPill = document.querySelector(".zoom-pill");
  const btnZoomIn = document.getElementById("btn-zoom-in");
  const btnZoomOut = document.getElementById("btn-zoom-out");
  const btnReset = document.getElementById("btn-reset");

  function showLoadError(msg) {
    loadingEl.textContent = msg;
    loadingEl.style.color = "#b91c1c";
    loadingEl.style.borderColor = "#fca5a5";
  }

  function base64ToUint8Array(b64) {
    const bin = atob(b64);
    const len = bin.length;
    const out = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      out[i] = bin.charCodeAt(i);
    }
    return out;
  }

  async function gunzipBuffer(gzBytes) {
    if (typeof DecompressionStream === "function") {
      const ds = new DecompressionStream("gzip");
      const stream = new Blob([gzBytes]).stream().pipeThrough(ds);
      return await new Response(stream).arrayBuffer();
    }
    throw new Error("DecompressionStream('gzip') is unavailable in this browser.");
  }

  function align4(pos) {
    return (pos + 3) & ~3;
  }

  function lowerBound(arr, lo, hi, val) {
    let l = lo, r = hi;
    while (l < r) {
      const m = (l + r) >>> 1;
      if (arr[m] < val) l = m + 1;
      else r = m;
    }
    return l;
  }

  function upperBound(arr, lo, hi, val) {
    let l = lo, r = hi;
    while (l < r) {
      const m = (l + r) >>> 1;
      if (arr[m] <= val) l = m + 1;
      else r = m;
    }
    return l;
  }

  function compileShader(gl, type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(sh);
      gl.deleteShader(sh);
      throw new Error("Shader compile error: " + log);
    }
    return sh;
  }

  function linkProgram(gl, vsSrc, fsSrc) {
    const vs = compileShader(gl, gl.VERTEX_SHADER, vsSrc);
    const fs = compileShader(gl, gl.FRAGMENT_SHADER, fsSrc);
    const prog = gl.createProgram();
    gl.attachShader(prog, vs);
    gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      const log = gl.getProgramInfoLog(prog);
      gl.deleteProgram(prog);
      throw new Error("Program link error: " + log);
    }
    gl.deleteShader(vs);
    gl.deleteShader(fs);
    return prog;
  }

  function formatCompact(n) {
    if (n >= 10000) return (n / 1000).toFixed(1) + "k";
    return n.toLocaleString();
  }

  async function init() {
    const b64 = window.__FULL_DAG_GZ_B64__;
    if (!b64 || typeof b64 !== "string") {
      showLoadError("Missing full_dag_data.js dataset.");
      return;
    }

    let rawBuf;
    try {
      const gzBytes = base64ToUint8Array(b64);
      rawBuf = await gunzipBuffer(gzBytes);
      delete window.__FULL_DAG_GZ_B64__;
    } catch (err) {
      showLoadError("Failed to decompress DAG data: " + (err && err.message ? err.message : err));
      return;
    }

    const view = new DataView(rawBuf);
    const u8 = new Uint8Array(rawBuf);
    const td = new TextDecoder("utf-8");

    if (
      u8[0] !== 76 || // 'L'
      u8[1] !== 68 || // 'D'
      u8[2] !== 65 || // 'A'
      u8[3] !== 71    // 'G'
    ) {
      showLoadError("Invalid binary DAG container magic.");
      return;
    }

    const version = view.getUint32(4, true);
    if (version !== 1 && version !== 2) {
      showLoadError("Unsupported binary DAG version: " + version);
      return;
    }

    const headerLen = view.getUint32(8, true);
    let pos = 12;
    const header = JSON.parse(td.decode(u8.subarray(pos, pos + headerLen)));
    pos = align4(pos + headerLen);

    const N = header.node_count;
    const M = header.edge_count;
    const numLayers = header.num_layers;
    const layerDy = header.layer_dy;
    const bounds = header.bounds;
    const groups = header.groups;

    const layerOffsets = new Uint32Array(rawBuf, pos, numLayers + 1);
    pos += (numLayers + 1) * 4;

    const nodeX = new Float32Array(rawBuf, pos, N);
    pos += N * 4;

    const nodeGroup = new Uint8Array(rawBuf, pos, N);
    pos = align4(pos + N);

    const nodeInDeg = new Uint16Array(rawBuf, pos, N);
    pos = align4(pos + N * 2);

    const nodeOutDeg = new Uint16Array(rawBuf, pos, N);
    pos = align4(pos + N * 2);

    const nodeDirId = new Uint32Array(rawBuf, pos, N);
    pos += N * 4;

    const dirBlobLen = view.getUint32(pos, true);
    pos += 4;
    const dirList = td.decode(u8.subarray(pos, pos + dirBlobLen)).split("\n");
    pos = align4(pos + dirBlobLen);

    const nameBlobLen = view.getUint32(pos, true);
    pos += 4;
    const shortNames = td.decode(u8.subarray(pos, pos + nameBlobLen)).split("\n");
    pos = align4(pos + nameBlobLen);

    const edgesBlobLen = view.getUint32(pos, true);
    pos += 4;
    const edgeStream = u8.subarray(pos, pos + edgesBlobLen);
    pos = align4(pos + edgesBlobLen);

    // Optional LDAG v2 collapsed data
    let cMeta = null;
    let cLayerOffsets = null;
    let cNodeX = null;
    let cNodeFullId = null;
    let cSuperCounts = null;
    let cSuperFrontierCounts = null;
    let cSuperGroup = null;
    let cSuperTitles = null;
    let cSuperEdgeStream = null;
    let deadEdgesRaw = null;

    if (version >= 2 && header.collapsed) {
      cMeta = header.collapsed;
      const cN = cMeta.node_count;
      const cNumLayers = cMeta.num_layers;
      const cSuperN = cMeta.supernode_count;

      cLayerOffsets = new Uint32Array(rawBuf, pos, cNumLayers + 1);
      pos += (cNumLayers + 1) * 4;

      cNodeX = new Float32Array(rawBuf, pos, cN);
      pos += cN * 4;

      cNodeFullId = new Int32Array(rawBuf, pos, cN);
      pos += cN * 4;

      cSuperCounts = new Uint32Array(rawBuf, pos, cSuperN);
      pos += cSuperN * 4;

      cSuperFrontierCounts = new Uint16Array(rawBuf, pos, cSuperN);
      pos = align4(pos + cSuperN * 2);

      cSuperGroup = new Uint8Array(rawBuf, pos, cSuperN);
      pos = align4(pos + cSuperN);

      const cTitlesLen = view.getUint32(pos, true);
      pos += 4;
      cSuperTitles = cTitlesLen > 0 ? td.decode(u8.subarray(pos, pos + cTitlesLen)).split("\n") : [];
      pos = align4(pos + cTitlesLen);

      const cSuperEdgesLen = view.getUint32(pos, true);
      pos += 4;
      cSuperEdgeStream = u8.subarray(pos, pos + cSuperEdgesLen);
      pos = align4(pos + cSuperEdgesLen);

      const deadEdgeCount = view.getUint32(pos, true);
      pos += 4;
      deadEdgesRaw = new Uint32Array(rawBuf, pos, deadEdgeCount * 2);
    }

    // Derive dense nodeLayer array from layerOffsets
    const nodeLayer = new Uint16Array(N);
    for (let ly = 0; ly < numLayers; ly++) {
      const a = layerOffsets[ly];
      const b = layerOffsets[ly + 1];
      for (let i = a; i < b; i++) {
        nodeLayer[i] = ly;
      }
    }

    // Decode LEB128 CSR edges, count reverse in-degrees and 8 stratified edge buckets
    const edgeOffsets = new Uint32Array(N + 1);
    const edgeTargets = new Uint32Array(M);
    const revCounts = new Uint32Array(N);
    const bucketCounts = new Uint32Array(8);

    let ePtr = 0;
    let tIdx = 0;
    for (let u = 0; u < N; u++) {
      edgeOffsets[u] = tIdx;
      let deg = 0;
      let shift = 0;
      while (true) {
        const b = edgeStream[ePtr++];
        deg |= (b & 0x7f) << shift;
        if ((b & 0x80) === 0) break;
        shift += 7;
      }
      let prevV = 0;
      for (let k = 0; k < deg; k++) {
        let delta = 0;
        shift = 0;
        while (true) {
          const b = edgeStream[ePtr++];
          delta |= (b & 0x7f) << shift;
          if ((b & 0x80) === 0) break;
          shift += 7;
        }
        const v = prevV + delta;
        prevV = v;
        edgeTargets[tIdx++] = v;
        revCounts[v]++;
        const bkt = ((Math.imul(u, 2654435761) ^ Math.imul(v, 2246822519)) >>> 29) & 7;
        bucketCounts[bkt]++;
      }
    }
    edgeOffsets[N] = tIdx;

    // Build reverse CSR for deep-zoom incoming arrowheads
    const revOffsets = new Uint32Array(N + 1);
    let rAcc = 0;
    for (let i = 0; i < N; i++) {
      revOffsets[i] = rAcc;
      rAcc += revCounts[i];
    }
    revOffsets[N] = rAcc;
    const revSources = new Uint32Array(M);
    const revWrite = new Uint32Array(revOffsets);
    for (let u = 0; u < N; u++) {
      const a = edgeOffsets[u];
      const b = edgeOffsets[u + 1];
      for (let k = a; k < b; k++) {
        const v = edgeTargets[k];
        revSources[revWrite[v]++] = u;
      }
    }

    // Group RGB lookup
    const numGroups = groups.length;
    const groupR = new Uint8Array(numGroups);
    const groupG = new Uint8Array(numGroups);
    const groupB = new Uint8Array(numGroups);
    const groupCss = new Array(numGroups);
    for (let g = 0; g < numGroups; g++) {
      groupR[g] = groups[g].rgb[0];
      groupG[g] = groups[g].rgb[1];
      groupB[g] = groups[g].rgb[2];
      groupCss[g] = groups[g].color;
    }

    function buildLegend() {
      if (!legendPill || !legendListEl || !Array.isArray(groups) || groups.length === 0) return;
      const frag = document.createDocumentFragment();
      for (let g = 0; g < groups.length; g++) {
        const item = groups[g];
        const cnt = typeof item.count === "number" ? item.count : 0;
        const li = document.createElement("li");
        li.className = "legend-row";
        li.title = `${item.name}: ${cnt.toLocaleString()} ${cnt === 1 ? "module" : "modules"} (${item.color})`;

        const dot = document.createElement("span");
        dot.className = "legend-dot";
        dot.style.background = item.color;
        dot.setAttribute("aria-hidden", "true");

        const nameEl = document.createElement("span");
        nameEl.className = "legend-name";
        nameEl.textContent = item.name;

        const countEl = document.createElement("span");
        countEl.className = "legend-count";
        countEl.textContent = cnt.toLocaleString();

        li.appendChild(dot);
        li.appendChild(nameEl);
        li.appendChild(countEl);
        frag.appendChild(li);
      }
      legendListEl.textContent = "";
      legendListEl.appendChild(frag);
      legendPill.classList.add("visible");
    }
    buildLegend();

    // Landmark list for fast overview/mid-zoom progressive labels (full DAG)
    const roots = [];
    const nonRoots = [];
    for (let i = 0; i < N; i++) {
      if (nodeInDeg[i] === 0) roots.push(i);
      else if (nodeInDeg[i] >= 12 || nodeLayer[i] <= 12) nonRoots.push(i);
    }
    nonRoots.sort((a, b) => {
      const da = nodeInDeg[a];
      const db = nodeInDeg[b];
      if (da !== db) return db - da;
      return a - b;
    });
    const maxLandmarks = Math.min(1800, nonRoots.length);
    const fullLandmarkIds = new Uint32Array(roots.length + maxLandmarks);
    for (let i = 0; i < roots.length; i++) fullLandmarkIds[i] = roots[i];
    for (let i = 0; i < maxLandmarks; i++) fullLandmarkIds[roots.length + i] = nonRoots[i];

    // Build stratified Edge VBO (12 bytes/vertex: f32 x, f32 y, u8 r,g,b,a)
    function createEdgeVboData(
      vNodeCount,
      vEdgeCount,
      vNodeX,
      vNodeLayer,
      vLayerDy,
      vNodeGroup,
      vEdgeOffsets,
      vEdgeTargets,
      vEdgeWeights,
      vBucketCounts,
      vNodeFullId
    ) {
      const bucketEdgeEnd = new Uint32Array(8);
      const bucketWriteVert = new Uint32Array(8);
      let eAcc = 0;
      for (let b = 0; b < 8; b++) {
        bucketWriteVert[b] = eAcc * 2;
        eAcc += vBucketCounts[b];
        bucketEdgeEnd[b] = eAcc;
      }

      const edgeBuf = new ArrayBuffer(vEdgeCount * 24);
      const edgeF32 = new Float32Array(edgeBuf);
      const edgeU8 = new Uint8Array(edgeBuf);

      for (let u = 0; u < vNodeCount; u++) {
        const ux = vNodeX[u];
        const uy = vNodeLayer[u] * vLayerDy;
        const ug = vNodeGroup[u];
        const ur = groupR[ug], ugr = groupG[ug], ub = groupB[ug];
        const a = vEdgeOffsets[u];
        const b = vEdgeOffsets[u + 1];
        for (let k = a; k < b; k++) {
          const v = vEdgeTargets[k];
          const bkt = ((Math.imul(u, 2654435761) ^ Math.imul(v, 2246822519)) >>> 29) & 7;
          const vIdx = bucketWriteVert[bkt];
          bucketWriteVert[bkt] = vIdx + 2;

          let alphaByte = 64; // 1.0x baseline via (v_color.a * 4.0)
          if (vEdgeWeights !== null && vNodeFullId !== null) {
            const w = vEdgeWeights[k];
            const fidV = vNodeFullId[v];
            if (w >= 2) {
              alphaByte = Math.min(255, Math.round(160 + 30 * Math.log2(w)));
            } else if (fidV < 0) {
              const sCnt = cSuperCounts[-(fidV + 1)];
              alphaByte = Math.min(255, Math.round(108 + 20 * Math.log10(Math.max(10, sCnt))));
            }
          }

          const fOff0 = vIdx * 3;
          const bOff0 = vIdx * 12;
          edgeF32[fOff0] = ux;
          edgeF32[fOff0 + 1] = uy;
          edgeU8[bOff0 + 8] = ur;
          edgeU8[bOff0 + 9] = ugr;
          edgeU8[bOff0 + 10] = ub;
          edgeU8[bOff0 + 11] = alphaByte;

          const vg = vNodeGroup[v];
          const fOff1 = fOff0 + 3;
          const bOff1 = bOff0 + 12;
          edgeF32[fOff1] = vNodeX[v];
          edgeF32[fOff1 + 1] = vNodeLayer[v] * vLayerDy;
          edgeU8[bOff1 + 8] = groupR[vg];
          edgeU8[bOff1 + 9] = groupG[vg];
          edgeU8[bOff1 + 10] = groupB[vg];
          edgeU8[bOff1 + 11] = alphaByte;
        }
      }

      return { edgeBuf, bucketEdgeEnd };
    }

    function createNodeVboData(
      vNodeCount,
      vNodeX,
      vNodeLayer,
      vLayerDy,
      vNodeGroup,
      vNodeInDeg,
      vNodeFullId
    ) {
      const nodeBuf = new ArrayBuffer(vNodeCount * 16);
      const nodeF32 = new Float32Array(nodeBuf);
      const nodeU8 = new Uint8Array(nodeBuf);
      for (let i = 0; i < vNodeCount; i++) {
        const fOff = i * 4;
        const bOff = i * 16;
        let weight;
        let isSuperByte = 0;
        if (vNodeFullId !== null && vNodeFullId[i] < 0) {
          const sCnt = cSuperCounts[-(vNodeFullId[i] + 1)];
          weight = 1.7 + 0.52 * Math.log1p(sCnt);
          isSuperByte = 255;
        } else {
          const inD = vNodeInDeg[i];
          weight = inD === 0 ? 2.4 : (1.0 + 0.32 * Math.log1p(inD));
        }
        nodeF32[fOff] = vNodeX[i];
        nodeF32[fOff + 1] = vNodeLayer[i] * vLayerDy;
        nodeF32[fOff + 2] = weight;
        const g = vNodeGroup[i];
        nodeU8[bOff + 12] = groupR[g];
        nodeU8[bOff + 13] = groupG[g];
        nodeU8[bOff + 14] = groupB[g];
        nodeU8[bOff + 15] = isSuperByte;
      }
      return nodeBuf;
    }

    const fullEdgePack = createEdgeVboData(
      N, M, nodeX, nodeLayer, layerDy, nodeGroup, edgeOffsets, edgeTargets, null, bucketCounts, null
    );
    const fullNodeBuf = createNodeVboData(N, nodeX, nodeLayer, layerDy, nodeGroup, nodeInDeg, null);

    // Initialize WebGL1 (or fallback to 2D Canvas if unavailable)
    const gl =
      glCanvas.getContext("webgl", {
        antialias: true,
        alpha: false,
        preserveDrawingBuffer: true,
        powerPreference: "high-performance",
      }) ||
      glCanvas.getContext("experimental-webgl", {
        antialias: true,
        alpha: false,
        preserveDrawingBuffer: true,
      });

    let edgeProg = null;
    let nodeProg = null;
    let edgeLocs = null;
    let nodeLocs = null;
    let maxPointSize = 64.0;

    if (gl) {
      const edgeVs = [
        "attribute vec2 a_pos;",
        "attribute vec4 a_color;",
        "uniform vec2 u_scale;",
        "uniform vec2 u_offset;",
        "varying vec4 v_color;",
        "void main() {",
        "  gl_Position = vec4(a_pos * u_scale + u_offset, 0.0, 1.0);",
        "  v_color = a_color;",
        "}",
      ].join("\n");

      const edgeFs = [
        "precision mediump float;",
        "uniform float u_alpha;",
        "varying vec4 v_color;",
        "void main() {",
        "  float mult = v_color.a * 4.0;",
        "  gl_FragColor = vec4(v_color.rgb, clamp(u_alpha * mult, 0.0, 0.92));",
        "}",
      ].join("\n");

      const nodeVs = [
        "attribute vec2 a_pos;",
        "attribute float a_weight;",
        "attribute vec4 a_color;",
        "uniform vec2 u_scale;",
        "uniform vec2 u_offset;",
        "uniform float u_zoom;",
        "uniform float u_dpr;",
        "uniform float u_maxPointSize;",
        "varying vec4 v_color;",
        "varying float v_pointSize;",
        "varying float v_rimStrength;",
        "varying float v_isSuper;",
        "void main() {",
        "  gl_Position = vec4(a_pos * u_scale + u_offset, 0.0, 1.0);",
        "  float sz = (1.25 + 0.55 * a_weight) * (0.72 + 0.38 * sqrt(max(u_zoom, 0.05))) * u_dpr;",
        "  if (u_zoom >= 4.0) {",
        "    float cap = a_color.a > 0.5 ? 0.85 : 0.76;",
        "    sz = min(sz, cap * u_zoom * u_dpr);",
        "  }",
        "  float minSz = (a_color.a > 0.5 ? 2.2 : 1.5) * u_dpr;",
        "  sz = clamp(sz, minSz, u_maxPointSize);",
        "  gl_PointSize = sz;",
        "  v_pointSize = sz;",
        "  v_rimStrength = clamp((sz - 5.5 * u_dpr) / (3.0 * u_dpr), 0.0, 1.0);",
        "  v_isSuper = a_color.a;",
        "  v_color = a_color;",
        "}",
      ].join("\n");

      const nodeFs = [
        "precision mediump float;",
        "varying vec4 v_color;",
        "varying float v_pointSize;",
        "varying float v_rimStrength;",
        "varying float v_isSuper;",
        "void main() {",
        "  vec2 p = (gl_PointCoord - vec2(0.5)) * 2.0;",
        "  if (v_isSuper > 0.5) {",
        "    float dist = abs(p.x) + abs(p.y);",
        "    float edgeW = min(0.45, 2.1 / max(v_pointSize, 2.0));",
        "    float alpha = 1.0 - smoothstep(1.0 - edgeW, 1.0, dist);",
        "    if (alpha < 0.02) discard;",
        "    vec3 col = v_color.rgb;",
        "    if (dist < 0.48 && v_pointSize > 4.5) {",
        "      col = mix(col, vec3(1.0), 0.74);",
        "    } else {",
        "      float rim = smoothstep(0.68, 0.90, dist);",
        "      col = mix(col, col * 0.48, rim * 0.70);",
        "    }",
        "    gl_FragColor = vec4(col, alpha);",
        "  } else {",
        "    float dist = length(p);",
        "    float edgeW = min(0.45, 1.75 / max(v_pointSize, 2.0));",
        "    float alpha = 1.0 - smoothstep(1.0 - edgeW, 1.0, dist);",
        "    if (alpha < 0.02) discard;",
        "    vec3 col = v_color.rgb;",
        "    if (v_rimStrength > 0.01) {",
        "      float rim = smoothstep(0.70, 0.86, dist);",
        "      col = mix(col, col * 0.55, rim * 0.75 * v_rimStrength);",
        "    }",
        "    gl_FragColor = vec4(col, alpha);",
        "  }",
        "}",
      ].join("\n");

      edgeProg = linkProgram(gl, edgeVs, edgeFs);
      nodeProg = linkProgram(gl, nodeVs, nodeFs);

      edgeLocs = {
        a_pos: gl.getAttribLocation(edgeProg, "a_pos"),
        a_color: gl.getAttribLocation(edgeProg, "a_color"),
        u_scale: gl.getUniformLocation(edgeProg, "u_scale"),
        u_offset: gl.getUniformLocation(edgeProg, "u_offset"),
        u_alpha: gl.getUniformLocation(edgeProg, "u_alpha"),
      };
      nodeLocs = {
        a_pos: gl.getAttribLocation(nodeProg, "a_pos"),
        a_weight: gl.getAttribLocation(nodeProg, "a_weight"),
        a_color: gl.getAttribLocation(nodeProg, "a_color"),
        u_scale: gl.getUniformLocation(nodeProg, "u_scale"),
        u_offset: gl.getUniformLocation(nodeProg, "u_offset"),
        u_zoom: gl.getUniformLocation(nodeProg, "u_zoom"),
        u_dpr: gl.getUniformLocation(nodeProg, "u_dpr"),
        u_maxPointSize: gl.getUniformLocation(nodeProg, "u_maxPointSize"),
      };

      const ptRange = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE);
      if (ptRange && ptRange.length >= 2) {
        maxPointSize = Math.min(128.0, ptRange[1]);
      }
    }

    function uploadVbo(buf) {
      if (!gl) return null;
      const vbo = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
      gl.bufferData(gl.ARRAY_BUFFER, buf, gl.STATIC_DRAW);
      return vbo;
    }

    const fullView = {
      isCollapsed: false,
      nodeCount: N,
      edgeCount: M,
      numLayers: numLayers,
      layerDy: layerDy,
      bounds: bounds,
      layerOffsets: layerOffsets,
      nodeX: nodeX,
      nodeLayer: nodeLayer,
      nodeGroup: nodeGroup,
      nodeInDeg: nodeInDeg,
      nodeOutDeg: nodeOutDeg,
      nodeFullId: null,
      edgeOffsets: edgeOffsets,
      edgeTargets: edgeTargets,
      edgeWeights: null,
      revOffsets: revOffsets,
      revSources: revSources,
      revWeights: null,
      landmarkIds: fullLandmarkIds,
      weightedEdgeList: null,
      bucketEdgeEnd: fullEdgePack.bucketEdgeEnd,
      edgeVbo: uploadVbo(fullEdgePack.edgeBuf),
      nodeVbo: uploadVbo(fullNodeBuf),
    };

    let collapsedView = null;

    function getOrBuildCollapsedView() {
      if (collapsedView) return collapsedView;
      if (!cMeta) return null;

      const cN = cMeta.node_count;
      const cM = cMeta.edge_count;
      const cNumLayers = cMeta.num_layers;
      const cLayerDy = cMeta.layer_dy;

      const fullToCollapsed = new Int32Array(N);
      fullToCollapsed.fill(-1);

      const cNodeLayer = new Uint16Array(cN);
      for (let ly = 0; ly < cNumLayers; ly++) {
        const a = cLayerOffsets[ly];
        const b = cLayerOffsets[ly + 1];
        for (let i = a; i < b; i++) {
          cNodeLayer[i] = ly;
        }
      }

      const cNodeGroup = new Uint8Array(cN);
      const cNodeInDeg = new Uint16Array(cN);
      const cNodeOutDeg = new Uint16Array(cN);
      for (let i = 0; i < cN; i++) {
        const fid = cNodeFullId[i];
        if (fid >= 0) {
          fullToCollapsed[fid] = i;
          cNodeGroup[i] = nodeGroup[fid];
        } else {
          cNodeGroup[i] = cSuperGroup[-(fid + 1)];
        }
      }

      const deadSet = new Set();
      for (let i = 0; i < deadEdgesRaw.length; i += 2) {
        deadSet.add(deadEdgesRaw[i] * 262144 + deadEdgesRaw[i + 1]);
      }

      // Decode supernode edges from cSuperEdgeStream
      const cSuperN = cMeta.super_edge_count;
      const supStart = new Uint32Array(cN);
      const supEnd = new Uint32Array(cN);
      const supTargets = new Uint32Array(cSuperN);
      const supWeights = new Uint16Array(cSuperN);
      let sp = 0;
      let sIdxWrite = 0;
      for (let cu = 0; cu < cN; cu++) {
        supStart[cu] = sIdxWrite;
        let deg = 0;
        let shift = 0;
        while (true) {
          const b = cSuperEdgeStream[sp++];
          deg |= (b & 0x7f) << shift;
          if ((b & 0x80) === 0) break;
          shift += 7;
        }
        let prevV = 0;
        for (let k = 0; k < deg; k++) {
          let delta = 0;
          shift = 0;
          while (true) {
            const b = cSuperEdgeStream[sp++];
            delta |= (b & 0x7f) << shift;
            if ((b & 0x80) === 0) break;
            shift += 7;
          }
          let w = 0;
          shift = 0;
          while (true) {
            const b = cSuperEdgeStream[sp++];
            w |= (b & 0x7f) << shift;
            if ((b & 0x80) === 0) break;
            shift += 7;
          }
          const cv = prevV + delta;
          prevV = cv;
          supTargets[sIdxWrite] = cv;
          supWeights[sIdxWrite] = w;
          sIdxWrite++;
        }
        supEnd[cu] = sIdxWrite;
      }

      const cEdgeOffsets = new Uint32Array(cN + 1);
      const cEdgeTargets = new Uint32Array(cM);
      const cEdgeWeights = new Uint16Array(cM);
      const cRevCounts = new Uint32Array(cN);
      const cBucketCounts = new Uint32Array(8);
      const weightedEdgeTriples = [];

      let ctIdx = 0;
      for (let cu = 0; cu < cN; cu++) {
        cEdgeOffsets[cu] = ctIdx;
        const fid = cNodeFullId[cu];
        if (fid >= 0) {
          const a = edgeOffsets[fid];
          const b = edgeOffsets[fid + 1];
          for (let k = a; k < b; k++) {
            const fv = edgeTargets[k];
            const cv = fullToCollapsed[fv];
            if (cv >= 0 && (deadSet.size === 0 || !deadSet.has(fid * 262144 + fv))) {
              cEdgeTargets[ctIdx] = cv;
              cEdgeWeights[ctIdx] = 1;
              ctIdx++;
              cRevCounts[cv]++;
              const bkt = ((Math.imul(cu, 2654435761) ^ Math.imul(cv, 2246822519)) >>> 29) & 7;
              cBucketCounts[bkt]++;
            }
          }
          const sa = supStart[cu];
          const sb = supEnd[cu];
          for (let s = sa; s < sb; s++) {
            const cv = supTargets[s];
            const w = supWeights[s];
            cEdgeTargets[ctIdx] = cv;
            cEdgeWeights[ctIdx] = w;
            ctIdx++;
            cRevCounts[cv]++;
            const bkt = ((Math.imul(cu, 2654435761) ^ Math.imul(cv, 2246822519)) >>> 29) & 7;
            cBucketCounts[bkt]++;
            const superCount = cSuperCounts[-(cNodeFullId[cv] + 1)];
            if (w >= 2 || superCount >= 400) {
              weightedEdgeTriples.push(cu, cv, w);
            }
          }
        }
        cNodeOutDeg[cu] = Math.min(65535, ctIdx - cEdgeOffsets[cu]);
      }
      cEdgeOffsets[cN] = ctIdx;

      const cRevOffsets = new Uint32Array(cN + 1);
      let cRAcc = 0;
      for (let i = 0; i < cN; i++) {
        cNodeInDeg[i] = Math.min(65535, cRevCounts[i]);
        cRevOffsets[i] = cRAcc;
        cRAcc += cRevCounts[i];
      }
      cRevOffsets[cN] = cRAcc;
      const cRevSources = new Uint32Array(ctIdx);
      const cRevWeights = new Uint16Array(ctIdx);
      const cRevWrite = new Uint32Array(cRevOffsets);
      for (let cu = 0; cu < cN; cu++) {
        const a = cEdgeOffsets[cu];
        const b = cEdgeOffsets[cu + 1];
        for (let k = a; k < b; k++) {
          const cv = cEdgeTargets[k];
          const posW = cRevWrite[cv]++;
          cRevSources[posW] = cu;
          cRevWeights[posW] = cEdgeWeights[k];
        }
      }

      // Collapsed landmarks: roots -> ALL literature supernodes (by collapsed size desc) -> top active hubs
      const cRoots = [];
      const cSupers = [];
      const cHubs = [];
      for (let i = 0; i < cN; i++) {
        const fid = cNodeFullId[i];
        if (fid < 0) {
          cSupers.push(i);
        } else if (cNodeInDeg[i] === 0) {
          cRoots.push(i);
        } else if (cNodeInDeg[i] >= 10 || cNodeLayer[i] <= 10) {
          cHubs.push(i);
        }
      }
      cSupers.sort((a, b) => {
        const ca = cSuperCounts[-(cNodeFullId[a] + 1)];
        const cb = cSuperCounts[-(cNodeFullId[b] + 1)];
        if (ca !== cb) return cb - ca;
        return a - b;
      });
      cHubs.sort((a, b) => {
        const da = cNodeInDeg[a];
        const db = cNodeInDeg[b];
        if (da !== db) return db - da;
        return a - b;
      });
      const maxCHubs = Math.min(1200, cHubs.length);
      const cLandmarks = new Uint32Array(cRoots.length + cSupers.length + maxCHubs);
      let lOff = 0;
      for (let i = 0; i < cRoots.length; i++) cLandmarks[lOff++] = cRoots[i];
      for (let i = 0; i < cSupers.length; i++) cLandmarks[lOff++] = cSupers[i];
      for (let i = 0; i < maxCHubs; i++) cLandmarks[lOff++] = cHubs[i];

      const cEdgePack = createEdgeVboData(
        cN, ctIdx, cNodeX, cNodeLayer, cLayerDy, cNodeGroup, cEdgeOffsets, cEdgeTargets, cEdgeWeights, cBucketCounts, cNodeFullId
      );
      const cNodeBuf = createNodeVboData(
        cN, cNodeX, cNodeLayer, cLayerDy, cNodeGroup, cNodeInDeg, cNodeFullId
      );

      collapsedView = {
        isCollapsed: true,
        nodeCount: cN,
        edgeCount: ctIdx,
        numLayers: cNumLayers,
        layerDy: cLayerDy,
        bounds: cMeta.bounds,
        layerOffsets: cLayerOffsets,
        nodeX: cNodeX,
        nodeLayer: cNodeLayer,
        nodeGroup: cNodeGroup,
        nodeInDeg: cNodeInDeg,
        nodeOutDeg: cNodeOutDeg,
        nodeFullId: cNodeFullId,
        edgeOffsets: cEdgeOffsets,
        edgeTargets: cEdgeTargets,
        edgeWeights: cEdgeWeights,
        revOffsets: cRevOffsets,
        revSources: cRevSources,
        revWeights: cRevWeights,
        landmarkIds: cLandmarks,
        weightedEdgeList: new Uint32Array(weightedEdgeTriples),
        bucketEdgeEnd: cEdgePack.bucketEdgeEnd,
        edgeVbo: uploadVbo(cEdgePack.edgeBuf),
        nodeVbo: uploadVbo(cNodeBuf),
      };
      return collapsedView;
    }

    let activeView = fullView;

    // Viewport state
    let cssW = window.innerWidth || 1280;
    let cssH = window.innerHeight || 720;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    let zoom = 1.0;
    let panX = 0.0;
    let panY = 0.0;
    let fitZoom = 0.35;

    function computeFitTransform() {
      const b = activeView.bounds;
      const worldW = Math.max(1, b.xmax - b.xmin);
      const worldH = Math.max(1, b.ymax - b.ymin);
      const padX = Math.max(40, cssW * 0.04);
      const padY = Math.max(44, cssH * 0.055);
      const z = Math.min((cssW - 2 * padX) / worldW, (cssH - 2 * padY) / worldH);
      fitZoom = Math.max(0.05, z);
      const cx = 0.5 * (b.xmin + b.xmax);
      const cy = 0.5 * (b.ymin + b.ymax);
      return {
        zoom: fitZoom,
        panX: cssW * 0.5 - cx * fitZoom,
        panY: cssH * 0.5 - cy * fitZoom,
      };
    }

    function fitToView() {
      const t = computeFitTransform();
      zoom = t.zoom;
      panX = t.panX;
      panY = t.panY;
    }

    function resizeCanvases(preserveCenter) {
      const prevW = cssW;
      const prevH = cssH;
      const worldCx = (prevW * 0.5 - panX) / zoom;
      const worldCy = (prevH * 0.5 - panY) / zoom;

      cssW = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1280);
      cssH = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 720);
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      const pixW = Math.max(1, Math.round(cssW * dpr));
      const pixH = Math.max(1, Math.round(cssH * dpr));

      glCanvas.width = pixW;
      glCanvas.height = pixH;
      ovCanvas.width = pixW;
      ovCanvas.height = pixH;
      if (gl) {
        gl.viewport(0, 0, pixW, pixH);
      }

      if (preserveCenter) {
        const t = computeFitTransform();
        fitZoom = t.zoom;
        panX = cssW * 0.5 - worldCx * zoom;
        panY = cssH * 0.5 - worldCy * zoom;
      } else {
        fitToView();
      }
    }

    // Adaptive rendering & LOD state
    let rafPending = false;
    let isInteracting = false;
    let idleTimer = 0;
    let lastFullDrawMs = 0;

    function nodeRadiusCss(av, idx) {
      const fid = av.nodeFullId ? av.nodeFullId[idx] : idx;
      let weight;
      let isSuper = false;
      if (fid < 0) {
        const sCnt = cSuperCounts[-(fid + 1)];
        weight = 1.7 + 0.52 * Math.log1p(sCnt);
        isSuper = true;
      } else {
        const inD = av.nodeInDeg[idx];
        weight = inD === 0 ? 2.4 : (1.0 + 0.32 * Math.log1p(inD));
      }
      let sz = (1.25 + 0.55 * weight) * (0.72 + 0.38 * Math.sqrt(Math.max(zoom, 0.05)));
      if (zoom >= 4.0) {
        sz = Math.min(sz, (isSuper ? 0.85 : 0.76) * zoom);
      }
      sz = Math.max(isSuper ? 2.2 : 1.5, Math.min(maxPointSize / dpr, sz));
      return 0.5 * sz;
    }

    function reserveUiRects(placed) {
      const pad = 6;
      const els = [navPill, collapsePill, legendPill, zoomPill];
      for (let i = 0; i < els.length; i++) {
        const el = els[i];
        if (!el) continue;
        const r = el.getBoundingClientRect();
        if (r.width > 0 && r.height > 0) {
          placed.push([r.left - pad, r.top - pad, r.right + pad, r.bottom + pad]);
        }
      }
    }

    function drawOverlay() {
      const av = activeView;
      ovCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ovCtx.clearRect(0, 0, cssW, cssH);

      const wxMin = -panX / zoom;
      const wxMax = (cssW - panX) / zoom;
      const wyMin = -panY / zoom;
      const wyMax = (cssH - panY) / zoom;

      const marginWorldX = 16 / zoom;
      const marginWorldY = 16 / zoom;

      const minLy = Math.max(0, Math.floor((wyMin - marginWorldY) / av.layerDy));
      const maxLy = Math.min(av.numLayers - 1, Math.ceil((wyMax + marginWorldY) / av.layerDy));

      const slices = [];
      let visibleCount = 0;
      for (let ly = minLy; ly <= maxLy; ly++) {
        const lStart = av.layerOffsets[ly];
        const lEnd = av.layerOffsets[ly + 1];
        if (lStart >= lEnd) continue;
        const a = lowerBound(av.nodeX, lStart, lEnd, wxMin - marginWorldX);
        const b = upperBound(av.nodeX, a, lEnd, wxMax + marginWorldX);
        if (a < b) {
          slices.push(a, b);
          visibleCount += (b - a);
        }
      }

      const placed = [];
      reserveUiRects(placed);

      // Post-collapse variable-thickness weighted edges overlay (collapsed mode)
      if (av.isCollapsed && av.weightedEdgeList && av.weightedEdgeList.length > 0) {
        const wList = av.weightedEdgeList;
        const nX = av.nodeX;
        const nL = av.nodeLayer;
        const lDy = av.layerDy;
        const zoomRatio = zoom / fitZoom;
        const wBadges = [];

        ovCtx.save();
        ovCtx.lineCap = "round";
        for (let i = 0; i < wList.length; i += 3) {
          const cu = wList[i];
          const cv = wList[i + 1];
          const w = wList[i + 2];
          const ux = nX[cu];
          const uy = nL[cu] * lDy;
          const vx = nX[cv];
          const vy = nL[cv] * lDy;
          if ((ux < wxMin && vx < wxMin) || (ux > wxMax && vx > wxMax)) continue;
          if ((uy < wyMin && vy < wyMin) || (uy > wyMax && vy > wyMax)) continue;

          const sx0 = ux * zoom + panX;
          const sy0 = uy * zoom + panY;
          const sx1 = vx * zoom + panX;
          const sy1 = vy * zoom + panY;

          const lw = w >= 2
            ? Math.min(5.2, 1.35 + 0.82 * Math.log2(w))
            : Math.min(2.4, 0.9 + 0.25 * Math.log10(Math.max(10, cSuperCounts[-(av.nodeFullId[cv] + 1)])));
          const alpha = w >= 2
            ? Math.min(0.75, 0.26 + 0.14 * Math.sqrt(zoomRatio))
            : Math.min(0.45, 0.10 + 0.08 * Math.sqrt(zoomRatio));

          ovCtx.strokeStyle = groupCss[av.nodeGroup[cv]];
          ovCtx.globalAlpha = alpha;
          ovCtx.lineWidth = lw;
          ovCtx.beginPath();
          ovCtx.moveTo(sx0, sy0);
          ovCtx.lineTo(sx1, sy1);
          ovCtx.stroke();

          if (w >= 2 && visibleCount <= 550 && zoom >= 6) {
            wBadges.push({ sx0, sy0, sx1, sy1, w, col: groupCss[av.nodeGroup[cv]] });
          }
        }
        ovCtx.restore();

        if (wBadges.length > 0) {
          wBadges.sort((a, b) => b.w - a.w);
          ovCtx.save();
          ovCtx.font = "600 9.5px ui-monospace, SFMono-Regular, Menlo, monospace";
          ovCtx.textAlign = "center";
          ovCtx.textBaseline = "middle";
          const maxBadges = 40;
          let drawnBadges = 0;
          for (let i = 0; i < wBadges.length && drawnBadges < maxBadges; i++) {
            const b = wBadges[i];
            const mx = b.sx0 * 0.38 + b.sx1 * 0.62;
            const my = b.sy0 * 0.38 + b.sy1 * 0.62;
            if (mx < 16 || mx > cssW - 16 || my < 16 || my > cssH - 16) continue;
            const txt = "×" + b.w;
            const bw = ovCtx.measureText(txt).width + 6;
            const bh = 13;
            const x0 = mx - bw * 0.5;
            const y0 = my - bh * 0.5;
            const x1 = x0 + bw;
            const y1 = y0 + bh;
            let clash = false;
            for (let j = 0; j < placed.length; j++) {
              const p = placed[j];
              if (x0 < p[2] && x1 > p[0] && y0 < p[3] && y1 > p[1]) {
                clash = true;
                break;
              }
            }
            if (clash) continue;
            placed.push([x0, y0, x1, y1]);
            drawnBadges++;
            ovCtx.fillStyle = "rgba(255, 255, 255, 0.92)";
            ovCtx.strokeStyle = b.col;
            ovCtx.lineWidth = 1;
            ovCtx.fillRect(x0, y0, bw, bh);
            ovCtx.strokeRect(x0, y0, bw, bh);
            ovCtx.fillStyle = "#0f172a";
            ovCtx.fillText(txt, mx, my + 0.5);
          }
          ovCtx.restore();
        }
      }

      // Deep-zoom directional arrowheads
      if (visibleCount > 0 && visibleCount <= 300 && zoom >= 12) {
        ovCtx.save();
        ovCtx.fillStyle = "rgba(51, 65, 85, 0.78)";
        let drawnArrows = 0;
        const maxArrows = 2000;
        const baseArrowLen = Math.min(9.5, Math.max(4.5, 4.0 + 0.08 * zoom));

        for (let s = 0; s < slices.length && drawnArrows < maxArrows; s += 2) {
          const a = slices[s];
          const b = slices[s + 1];
          for (let v = a; v < b && drawnArrows < maxArrows; v++) {
            const vx = av.nodeX[v] * zoom + panX;
            const vy = av.nodeLayer[v] * av.layerDy * zoom + panY;
            const padR = nodeRadiusCss(av, v) + 2.0;
            const rA = av.revOffsets[v];
            const rB = av.revOffsets[v + 1];
            const rLim = Math.min(rB, rA + 24);
            for (let k = rA; k < rLim && drawnArrows < maxArrows; k++) {
              const u = av.revSources[k];
              const w = av.revWeights ? av.revWeights[k] : 1;
              const arrowLen = w >= 2 ? Math.min(13.0, baseArrowLen + 1.1 * Math.log2(w)) : baseArrowLen;
              const arrowHalfW = arrowLen * 0.44;
              const ux = av.nodeX[u] * zoom + panX;
              const uy = av.nodeLayer[u] * av.layerDy * zoom + panY;
              const dx = vx - ux;
              const dy = vy - uy;
              const dist = Math.hypot(dx, dy);
              if (dist <= padR + arrowLen + 1.0) continue;
              const inv = 1.0 / dist;
              const nx = dx * inv;
              const ny = dy * inv;
              const tipX = vx - nx * padR;
              const tipY = vy - ny * padR;
              const baseX = tipX - nx * arrowLen;
              const baseY = tipY - ny * arrowLen;
              const px = -ny * arrowHalfW;
              const py = nx * arrowHalfW;
              ovCtx.beginPath();
              ovCtx.moveTo(tipX, tipY);
              ovCtx.lineTo(baseX + px, baseY + py);
              ovCtx.lineTo(baseX - px, baseY - py);
              ovCtx.closePath();
              ovCtx.fill();
              drawnArrows++;
            }
          }
        }
        ovCtx.restore();
      }

      // Progressive collision-free node labels
      let candidates = null;
      if (visibleCount > 1200) {
        candidates = [];
        for (let i = 0; i < av.landmarkIds.length; i++) {
          const id = av.landmarkIds[i];
          const wx = av.nodeX[id];
          const wy = av.nodeLayer[id] * av.layerDy;
          if (wx >= wxMin && wx <= wxMax && wy >= wyMin && wy <= wyMax) {
            candidates.push(id);
          }
        }
      } else if (visibleCount > 0) {
        candidates = [];
        for (let s = 0; s < slices.length; s += 2) {
          const a = slices[s];
          const b = slices[s + 1];
          for (let i = a; i < b; i++) {
            candidates.push(i);
          }
        }
        candidates.sort((a, b) => {
          const fa = av.nodeFullId ? av.nodeFullId[a] : a;
          const fb = av.nodeFullId ? av.nodeFullId[b] : b;
          const pa = fa < 0 ? (1e8 + cSuperCounts[-(fa + 1)] * 1000) : (av.nodeInDeg[a] === 0 ? 1e9 : (av.nodeInDeg[a] * 10 + av.nodeOutDeg[a]));
          const pb = fb < 0 ? (1e8 + cSuperCounts[-(fb + 1)] * 1000) : (av.nodeInDeg[b] === 0 ? 1e9 : (av.nodeInDeg[b] * 10 + av.nodeOutDeg[b]));
          if (pa !== pb) return pb - pa;
          return a - b;
        });
      }

      if (!candidates || candidates.length === 0) return;

      const showDir = zoom >= 55;
      const fontSize = zoom >= 30 ? 12 : 11;
      ovCtx.save();
      ovCtx.textBaseline = "middle";
      ovCtx.textAlign = "left";
      ovCtx.lineJoin = "round";
      ovCtx.lineWidth = 3.5;

      let labelCount = 0;
      const maxLabels = zoom < fitZoom * 1.6 ? 22 : (zoom < fitZoom * 6.0 ? 50 : 90);

      for (let i = 0; i < candidates.length && labelCount < maxLabels; i++) {
        const id = candidates[i];
        const sx = av.nodeX[id] * zoom + panX;
        const sy = av.nodeLayer[id] * av.layerDy * zoom + panY;
        if (sx < -20 || sx > cssW + 20 || sy < -20 || sy > cssH + 20) continue;

        const fid = av.nodeFullId ? av.nodeFullId[id] : id;
        const isSuper = fid < 0;
        let label = "";
        let countSuffix = "";
        let subLabel = "";

        if (isSuper) {
          const sIdx = -(fid + 1);
          const rawTitle = cSuperTitles[sIdx] || "Published Theorem";
          label = rawTitle.length > 42 ? rawTitle.slice(0, 40) + "…" : rawTitle;
          countSuffix = " [" + cSuperCounts[sIdx].toLocaleString() + "]";
          if (showDir) {
            const fCnt = cSuperFrontierCounts[sIdx];
            subLabel = "Existing theory · " + fCnt + (fCnt === 1 ? " proof root" : " proof roots");
          }
        } else {
          label = shortNames[fid];
          if (!label) continue;
          if (showDir) {
            const dl = dirList[nodeDirId[fid]] || "";
            if (dl && dl !== "(root)") subLabel = dl;
          }
        }

        const rPx = nodeRadiusCss(av, id);
        const tx = sx + rPx + 4;
        const ty = sy;

        ovCtx.font = `600 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        const lw = ovCtx.measureText(label).width;
        let cw = 0;
        if (countSuffix) {
          ovCtx.font = `700 ${fontSize}px ui-monospace, SFMono-Regular, Menlo, monospace`;
          cw = ovCtx.measureText(countSuffix).width;
          ovCtx.font = `600 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        }
        let boxW = lw + cw;
        const boxH = subLabel ? 26 : 14;

        if (subLabel) {
          ovCtx.font = `400 10px ui-monospace, SFMono-Regular, Menlo, monospace`;
          const dw = ovCtx.measureText(subLabel).width;
          if (dw > boxW) boxW = dw;
          ovCtx.font = `600 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        }

        const x0 = tx - 3;
        const y0 = ty - 7;
        const x1 = tx + boxW + 5;
        const y1 = y0 + boxH;
        if (x0 < 4 || x1 > cssW - 4 || y0 < 4 || y1 > cssH - 4) continue;

        let overlaps = false;
        for (let j = 0; j < placed.length; j++) {
          const p = placed[j];
          if (x0 < p[2] && x1 > p[0] && y0 < p[3] && y1 > p[1]) {
            overlaps = true;
            break;
          }
        }
        if (overlaps) continue;

        placed.push([x0, y0, x1, y1]);
        labelCount++;

        ovCtx.strokeStyle = "rgba(255, 255, 255, 0.94)";
        ovCtx.fillStyle = isSuper ? "#0f172a" : "#111827";
        ovCtx.strokeText(label, tx, ty);
        ovCtx.fillText(label, tx, ty);

        if (countSuffix) {
          ovCtx.font = `700 ${fontSize}px ui-monospace, SFMono-Regular, Menlo, monospace`;
          ovCtx.fillStyle = groupCss[av.nodeGroup[id]];
          ovCtx.strokeText(countSuffix, tx + lw, ty);
          ovCtx.fillText(countSuffix, tx + lw, ty);
        }

        if (subLabel) {
          ovCtx.font = `400 10px ui-monospace, SFMono-Regular, Menlo, monospace`;
          ovCtx.fillStyle = "#64748b";
          ovCtx.strokeText(subLabel, tx, ty + 12);
          ovCtx.fillText(subLabel, tx, ty + 12);
        }
      }
      ovCtx.restore();
    }

    function drawFallback2D() {
      const av = activeView;
      const ctx = glCanvas.getContext("2d");
      if (!ctx) return;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, cssW, cssH);

      const wxMin = -panX / zoom;
      const wxMax = (cssW - panX) / zoom;
      const wyMin = -panY / zoom;
      const wyMax = (cssH - panY) / zoom;

      const baseAlpha = Math.max(0.03, Math.min(0.55, 0.036 * Math.pow(zoom / fitZoom, 0.55)));
      for (let u = 0; u < av.nodeCount; u++) {
        const ux = av.nodeX[u];
        const uy = av.nodeLayer[u] * av.layerDy;
        const sx0 = ux * zoom + panX;
        const sy0 = uy * zoom + panY;
        const a = av.edgeOffsets[u];
        const b = av.edgeOffsets[u + 1];
        for (let k = a; k < b; k++) {
          const v = av.edgeTargets[k];
          const vx = av.nodeX[v];
          const vy = av.nodeLayer[v] * av.layerDy;
          if ((ux < wxMin && vx < wxMin) || (ux > wxMax && vx > wxMax)) continue;
          if ((uy < wyMin && vy < wyMin) || (uy > wyMax && vy > wyMax)) continue;
          const w = av.edgeWeights ? av.edgeWeights[k] : 1;
          ctx.strokeStyle = groupCss[av.nodeGroup[w >= 2 ? v : u]];
          ctx.globalAlpha = w >= 2 ? Math.min(0.75, baseAlpha * 3.0) : baseAlpha;
          ctx.lineWidth = w >= 2 ? Math.min(4.5, 1.1 + 0.7 * Math.log2(w)) : 1;
          ctx.beginPath();
          ctx.moveTo(sx0, sy0);
          ctx.lineTo(vx * zoom + panX, vy * zoom + panY);
          ctx.stroke();
        }
      }
      ctx.globalAlpha = 1.0;
      for (let i = 0; i < av.nodeCount; i++) {
        const sx = av.nodeX[i] * zoom + panX;
        const sy = av.nodeLayer[i] * av.layerDy * zoom + panY;
        if (sx < -8 || sx > cssW + 8 || sy < -8 || sy > cssH + 8) continue;
        const r = nodeRadiusCss(av, i);
        const fid = av.nodeFullId ? av.nodeFullId[i] : i;
        ctx.fillStyle = groupCss[av.nodeGroup[i]];
        if (fid < 0) {
          ctx.beginPath();
          ctx.moveTo(sx, sy - r * 1.15);
          ctx.lineTo(sx + r * 1.15, sy);
          ctx.lineTo(sx, sy + r * 1.15);
          ctx.lineTo(sx - r * 1.15, sy);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.beginPath();
          ctx.arc(sx, sy, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      drawOverlay();
    }

    function renderFrame() {
      rafPending = false;
      const av = activeView;

      if (!gl) {
        drawFallback2D();
        return;
      }

      const t0 = performance.now();
      gl.clearColor(1.0, 1.0, 1.0, 1.0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

      const scaleX = (2.0 * zoom) / cssW;
      const scaleY = (-2.0 * zoom) / cssH;
      const offX = (2.0 * panX) / cssW - 1.0;
      const offY = 1.0 - (2.0 * panY) / cssH;

      const baseAlpha = Math.max(0.020, Math.min(0.60, 0.024 * Math.pow(zoom / fitZoom, 0.62)));

      // Determine how many stratified edge buckets to draw
      let useBuckets = 8;
      if (isInteracting && lastFullDrawMs > 20) {
        useBuckets = lastFullDrawMs > 60 ? 2 : 4;
      }
      const drawVerts = av.bucketEdgeEnd[useBuckets - 1] * 2;
      const edgeAlpha = useBuckets === 8 ? baseAlpha : Math.min(0.85, baseAlpha * (8.0 / useBuckets));

      // Pass 1: Edges
      gl.useProgram(edgeProg);
      gl.bindBuffer(gl.ARRAY_BUFFER, av.edgeVbo);
      gl.enableVertexAttribArray(edgeLocs.a_pos);
      gl.vertexAttribPointer(edgeLocs.a_pos, 2, gl.FLOAT, false, 12, 0);
      gl.enableVertexAttribArray(edgeLocs.a_color);
      gl.vertexAttribPointer(edgeLocs.a_color, 4, gl.UNSIGNED_BYTE, true, 12, 8);
      if (nodeLocs.a_weight >= 0) gl.disableVertexAttribArray(nodeLocs.a_weight);

      gl.uniform2f(edgeLocs.u_scale, scaleX, scaleY);
      gl.uniform2f(edgeLocs.u_offset, offX, offY);
      gl.uniform1f(edgeLocs.u_alpha, edgeAlpha);
      gl.drawArrays(gl.LINES, 0, drawVerts);

      // Pass 2: Nodes (always 100%)
      gl.useProgram(nodeProg);
      gl.bindBuffer(gl.ARRAY_BUFFER, av.nodeVbo);
      gl.enableVertexAttribArray(nodeLocs.a_pos);
      gl.vertexAttribPointer(nodeLocs.a_pos, 2, gl.FLOAT, false, 16, 0);
      gl.enableVertexAttribArray(nodeLocs.a_weight);
      gl.vertexAttribPointer(nodeLocs.a_weight, 1, gl.FLOAT, false, 16, 8);
      gl.enableVertexAttribArray(nodeLocs.a_color);
      gl.vertexAttribPointer(nodeLocs.a_color, 4, gl.UNSIGNED_BYTE, true, 16, 12);

      gl.uniform2f(nodeLocs.u_scale, scaleX, scaleY);
      gl.uniform2f(nodeLocs.u_offset, offX, offY);
      gl.uniform1f(nodeLocs.u_zoom, zoom);
      gl.uniform1f(nodeLocs.u_dpr, dpr);
      gl.uniform1f(nodeLocs.u_maxPointSize, maxPointSize);
      gl.drawArrays(gl.POINTS, 0, av.nodeCount);

      if (useBuckets === 8) {
        lastFullDrawMs = performance.now() - t0;
      }

      drawOverlay();
    }

    function scheduleRender() {
      if (!rafPending) {
        rafPending = true;
        requestAnimationFrame(renderFrame);
      }
    }

    function markInteracting() {
      isInteracting = true;
      if (idleTimer) clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        isInteracting = false;
        scheduleRender();
      }, 90);
    }

    function zoomAt(screenX, screenY, factor) {
      const minZoom = fitZoom * 0.4;
      const maxZoom = 380.0;
      const nextZoom = Math.max(minZoom, Math.min(maxZoom, zoom * factor));
      if (Math.abs(nextZoom - zoom) < 1e-9) return;
      const wx = (screenX - panX) / zoom;
      const wy = (screenY - panY) / zoom;
      zoom = nextZoom;
      panX = screenX - wx * zoom;
      panY = screenY - wy * zoom;
      markInteracting();
      scheduleRender();
    }

    function updateModeMetadata() {
      window.__FULL_DAG_MODE__ = activeView.isCollapsed ? "collapsed" : "full";
      window.__FULL_DAG_STATS__ = {
        mode: window.__FULL_DAG_MODE__,
        nodeCount: activeView.nodeCount,
        edgeCount: activeView.edgeCount,
        numLayers: activeView.numLayers,
        collapsedModules: cMeta ? cMeta.collapsed_module_count : 0,
        supernodeCount: cMeta ? cMeta.supernode_count : 0,
      };
    }

    function toggleExistingTheory() {
      if (!cMeta) return;
      const enable = !activeView.isCollapsed;
      if (enable) {
        const cv = getOrBuildCollapsedView();
        if (!cv) return;
        activeView = cv;
        btnCollapse.setAttribute("aria-pressed", "true");
        collapseStatsEl.textContent =
          "−" + formatCompact(cMeta.collapsed_module_count) + " modules · " + cMeta.num_layers + " layers";
      } else {
        activeView = fullView;
        btnCollapse.setAttribute("aria-pressed", "false");
        collapseStatsEl.textContent = "";
      }
      if (legendSuperNote) {
        legendSuperNote.classList.toggle("visible", enable);
      }
      lastFullDrawMs = 0;
      isInteracting = false;
      fitToView();
      updateModeMetadata();
      renderFrame();
    }

    if (cMeta) {
      collapsePill.classList.add("visible");
      btnCollapse.addEventListener("click", toggleExistingTheory);
    }

    if (btnLegendToggle && legendPill) {
      btnLegendToggle.addEventListener("click", () => {
        const isCollapsed = legendPill.classList.toggle("collapsed");
        btnLegendToggle.setAttribute("aria-expanded", String(!isCollapsed));
        if (legendToggleIcon) {
          legendToggleIcon.textContent = isCollapsed ? "+" : "\u2212";
        }
        scheduleRender();
      });
    }

    // Initial sizing & first draw
    resizeCanvases(false);
    loadingEl.remove();
    glCanvas.style.visibility = "visible";
    updateModeMetadata();
    renderFrame();
    window.__FULL_DAG_READY__ = true;

    // Mouse wheel / trackpad zoom
    glCanvas.addEventListener(
      "wheel",
      (ev) => {
        ev.preventDefault();
        let dy = ev.deltaY;
        if (ev.deltaMode === 1) dy *= 16;
        else if (ev.deltaMode === 2) dy *= cssH;
        const clamped = Math.max(-180, Math.min(180, dy));
        const factor = Math.exp(-clamped * 0.0018);
        zoomAt(ev.clientX, ev.clientY, factor);
      },
      { passive: false }
    );

    // Pointer pan + multi-touch pinch-zoom (strictly no node clicking or tooltips)
    const pointers = new Map();
    let dragLastX = 0;
    let dragLastY = 0;
    let pinchLastDist = 0;
    let pinchLastMidX = 0;
    let pinchLastMidY = 0;

    glCanvas.addEventListener("pointerdown", (ev) => {
      if (ev.button !== 0 && ev.pointerType === "mouse") return;
      glCanvas.setPointerCapture(ev.pointerId);
      pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (pointers.size === 1) {
        dragLastX = ev.clientX;
        dragLastY = ev.clientY;
        glCanvas.classList.add("grabbing");
      } else if (pointers.size === 2) {
        const pts = Array.from(pointers.values());
        pinchLastDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        pinchLastMidX = 0.5 * (pts[0].x + pts[1].x);
        pinchLastMidY = 0.5 * (pts[0].y + pts[1].y);
      }
    });

    glCanvas.addEventListener("pointermove", (ev) => {
      if (!pointers.has(ev.pointerId)) return;
      pointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });

      if (pointers.size === 1) {
        const dx = ev.clientX - dragLastX;
        const dy = ev.clientY - dragLastY;
        if (dx === 0 && dy === 0) return;
        dragLastX = ev.clientX;
        dragLastY = ev.clientY;
        panX += dx;
        panY += dy;
        markInteracting();
        scheduleRender();
      } else if (pointers.size >= 2) {
        const pts = Array.from(pointers.values());
        const dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        const midX = 0.5 * (pts[0].x + pts[1].x);
        const midY = 0.5 * (pts[0].y + pts[1].y);
        panX += midX - pinchLastMidX;
        panY += midY - pinchLastMidY;
        if (pinchLastDist > 1 && dist > 1) {
          zoomAt(midX, midY, dist / pinchLastDist);
        } else {
          markInteracting();
          scheduleRender();
        }
        pinchLastDist = dist;
        pinchLastMidX = midX;
        pinchLastMidY = midY;
      }
    });

    function endPointer(ev) {
      if (!pointers.has(ev.pointerId)) return;
      pointers.delete(ev.pointerId);
      if (pointers.size === 1) {
        const rem = Array.from(pointers.values())[0];
        dragLastX = rem.x;
        dragLastY = rem.y;
      } else if (pointers.size === 0) {
        glCanvas.classList.remove("grabbing");
      }
    }

    glCanvas.addEventListener("pointerup", endPointer);
    glCanvas.addEventListener("pointercancel", endPointer);

    // Corner zoom pill controls
    btnZoomIn.addEventListener("click", () => {
      zoomAt(cssW * 0.5, cssH * 0.5, 1.45);
    });
    btnZoomOut.addEventListener("click", () => {
      zoomAt(cssW * 0.5, cssH * 0.5, 1.0 / 1.45);
    });
    btnReset.addEventListener("click", () => {
      fitToView();
      isInteracting = false;
      scheduleRender();
    });

    // Keyboard pan/zoom + collapse toggle
    window.addEventListener("keydown", (ev) => {
      if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
      const step = Math.round(Math.min(cssW, cssH) * 0.14);
      if (ev.key === "c" || ev.key === "C") {
        ev.preventDefault();
        toggleExistingTheory();
      } else if (ev.key === "+" || ev.key === "=") {
        ev.preventDefault();
        zoomAt(cssW * 0.5, cssH * 0.5, 1.35);
      } else if (ev.key === "-" || ev.key === "_") {
        ev.preventDefault();
        zoomAt(cssW * 0.5, cssH * 0.5, 1.0 / 1.35);
      } else if (ev.key === "0" || ev.key === "r" || ev.key === "R") {
        ev.preventDefault();
        fitToView();
        isInteracting = false;
        scheduleRender();
      } else if (ev.key === "ArrowLeft") {
        ev.preventDefault();
        panX += step;
        markInteracting();
        scheduleRender();
      } else if (ev.key === "ArrowRight") {
        ev.preventDefault();
        panX -= step;
        markInteracting();
        scheduleRender();
      } else if (ev.key === "ArrowUp") {
        ev.preventDefault();
        panY += step;
        markInteracting();
        scheduleRender();
      } else if (ev.key === "ArrowDown") {
        ev.preventDefault();
        panY -= step;
        markInteracting();
        scheduleRender();
      }
    });

    window.addEventListener("resize", () => {
      resizeCanvases(true);
      scheduleRender();
    });
  }

  init();
})();
</script>
</body>
</html>
